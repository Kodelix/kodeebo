    status: active
  - id: IC-COUNTER-ENROLMENT-R7
    contract: "effective when ADR-0008 is Accepted (amends ADR-0007): enrol once, valid on every device of the person's assigned branches. Password path: the counter calls the dashboard sign-in API (app_rt) with username, password and TOTP or one recovery code (no passkey on the counter); success returns a single-use enrolment assertion bound to the device credential (Enrolment.issueAssertion), never a session; the device consumes it over device_rt (Enrolment.consumeAssertion); the device refuses a PIN equal to the password just entered or contained in it, compared in memory only, never stored or sent. Sponsored path: a sponsor signed in on that device, confirmed online (Device scope), holding staff.enrol_device, assigned to that branch, whose permission set is a strict superset of the target's (owner above every role), picks the person; the device shows a random one-time TemporaryPin once, changed at first use, expiring on the lease clock. The device computes the Argon2id verifier (per-user salt, PHC, parameters fitted to the weakest supported PC by S40 = S22/S23, PBKDF2-SHA256 600k fallback, clamped on the device both ways) and uploads it; floors 6 / 8 as owner-visible settings, a raised floor forces a new PIN; lockout per device (delay from 5, lock at <= 10, override-dialog failures count) on the lease clock, failures reported at contact and summed per person into a lock on every device through the feed (aggregate budget a named deviation). Revised effective when ADR-0008 is Accepted: a verifier from a device-minted fact (sponsor, counter_reset, self_change, parameter rehash) is unconfirmed and delivered only to its minting device until it is confirmed; for a person holding a privileged key only a confirmed verifier leaves the minting device; a dashboard-issued activation code (IC-PIN-ACTIVATION) also confirms. The per-person lock threshold has a compiled ceiling of 10, a reported success clears the sum, an owner's lock is cleared by a dashboard reset required plus a password-path enrolment, and the widened 6.1.1 lockout is accepted by name. A received verifier with parameters outside the device's floor or ceiling is not installed. A pending verifier is confirmed only by the person setting a PIN on the password path (a new password_assertion upload, which replaces it) or by the owner's dashboard confirmation (step-up, showing person, device, fact kind and time, after checking with the person); a password-path sign-in that sets no PIN confirms nothing. While it is pending, other devices keep the last confirmed verifier; a dashboard reset required retires an old PIN everywhere. An activation code may also replace an existing PIN fleet-wide (owner-started remote reset). Amended 2026-10-19 by the staff-auth threat model (founder): the owner's dashboard confirmation applies only to a person holding no privileged key (a privileged person's pending verifier is replaced only by their own password-path PIN); the person is notified of each pending verifier and confirmation. A reported success clears only the failures the same device reported; single-device person locks are flagged for owner review; lockout reports are rate-limited per device; an owner or approver lock alerts the owner. Each password-path enrolment writes an owner notice and counts as a new-device sign-in; the counter zeroises the password. The first use of a temporary PIN notifies the owner. A device refuses a verifier_version lower than the highest it acknowledged and raises a security event. Amended 2026-10-20 (effective when the founder accepts the 2026-10-20 amendment:) a fourth path, approve-on-phone (IC-APPROVE-ON-PHONE-ENROLMENT); once it ships the password path is refused for the owner and anyone holding a privileged key (non-privileged dashboard users keep it, owner-switchable); a privileged person with no second device cannot enrol on a counter; a counter-only person holding a privileged key enrols on each counter separately, each PIN in that counter's slot until a confirmed enrolment replaces them; a counter reset clears a person lock only on its own counter, a fleet-wide clear needs reset required."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: IC-SIGNIN-FAILURE-CEILING-R2
    contract: "At NIST's 100-consecutive-failure ceiling the identifier's dashboard password path is blocked until a reset (forgotten password or owner-issued temporary password); passkey and recovery-code sign-in stay open; the owner is notified. Anonymous attempts count toward the identifier's ceiling; attempts carrying a known-device signal count toward a separate ceiling (at most 100) per login and signal, which blocks only that signal; a re-block after reset is tested. The known-device signal is a __Host- Secure HttpOnly SameSite=Strict cookie with an opaque >= 128-bit CSPRNG value stored as SHA-256, bound to one login, set at a full sign-in, revoked by a password reset and by Sessions.endOthers, and in the crypto inventory. The per-address delay never alone blocks a known identifier. The remaining dashboard malicious-lockout risk is an ASVS 6.1.1 deviation accepted by Kamel Mohamed, founder, 2026-10-19 (staff-auth threat model M2). Amended 2026-10-20 (effective when the founder accepts the 2026-10-20 amendment:) per-known-login and per-known-device-signal consecutive-failure counts, ceiling blocks, not-me block and last_notice_at persist in the PL table login_failure_state (survive restarts; blocked rows never expire); per-address and unknown-identifier state stays in memory; admission control before any hash (429, Retry-After), bounded Argon2 queue with wait deadline and a reserved lane for known-device attempts, no challenge (ALTCHA PoW designed, built only on the S13/M43 or credential-stuffing trigger); owner notice at N = 10 consecutive failures per known login, at most one per 24 h, no action link, and on a correct password after N or more failures (configuration)."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: IC-STEP-UP-R3
    contract: "StepUp.issue only after a fresh TOTP code or a user-verified passkey assertion (fresh = the TOTP step or WebAuthn challenge was created after the step-up request; the challenge carries action and target; a recovery code never counts); the step-up rotates the session token (Sessions.rotate, ASVS 7.2.4) and the grant is bound to (new token hash, action, target), single use, short configured lifetime; the action's use case calls StepUp.consume inside its own transaction; missing, used, expired or mismatched grant -> refused + security event. Dashboard actions (owner only until the ADR-0003 amendment): closure request/cancel, erase person, support grant approve/revoke, role and assignment changes, second-factor and recovery-contact changes, recovery-code regeneration, tenant export, device enrol/revoke, tenant security settings, issue a temporary password, disable or re-enable a login, require a PIN reset, start another person's factor reset. Console actions: suspend or reinstate a tenant, Sessions.endAllForTenant, SupportGrants.revokeAllForTenant, plan or limit change, start a Kodelix closure, request a support grant, seat and licence issue/approve/move/suspend/revoke, and the licensing ADR's list (M36, M15). A dashboard user without a second factor cannot run a step-up action. The 2FA rule for privileged roles covers dashboard logins only; a counter-only person approves overrides with their PIN. Amended 2026-10-20 (effective when the founder accepts the 2026-10-20 amendment:) new dashboard step-up action counter.enrol.approve, bound to the approve-on-phone request id; a recovery code never satisfies it."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: IC-APPROVE-ON-PHONE-ENROLMENT
    contract: "Effective when the founder accepts the 2026-10-20 amendment: approve-on-phone counter enrolment, an adapted RFC 8628 flow with no OAuth server. The counter (device_rt, Device scope) starts a request bound to device credential, tenant and branch, after the person picks their own name (the first owner at the guided install skips it); user_code >= 40 bits (10 base-20 characters), device_code >= 128 bits, both stored as HMAC under a server key; <= 10 minutes, single use, one live request per device, a new request never resets the failure count. The named person approves only in their own dashboard session on a second device by typing the code (compare-and-tap refused), with step-up counter.enrol.approve; refused for another person, tenant, unassigned branch, or an inactive or lease-invalid device. Requests live in the TD table enrolment_requests (one pending per device; unique pending user-code HMAC per tenant) with pin_writer functions issue (device_rt), approve (app_rt; StepUp.consume returns the user, who must be the intended person) and poll (device_rt; calls Enrolment.issuePhoneAssertion); the per-device failure count (declined, expired, not-me) lives in enrolment_device_failures and only a consumed enrolment resets it; approve has per-approver-session and per-tenant wrong-code limits and calls StepUp.consume (EXECUTE also for pin_writer); a restore voids pending and approved requests. Consent screen names counter, branch, time, code and consequence; Decline as prominent as Approve. The counter shows the approver's name with Not me before the PIN screen; owner and person notified with a not-me action. Number matching default on for people holding a privileged key (the post-PIN that-was-me step was dropped by the founder after the re-check, 2026-10-20; a privileged person's phone_assertion PIN goes fleet-wide at once). Nudge or poll <= 2 s; framing protection on the approval and sign-in pages. The counter consumes the existing enrolment assertion; the upload is a phone_assertion fact. QR deferred; same-device detection open (Q-samedevice)."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: IC-BREACHED-PASSWORD-CHECK
    contract: "Effective when the founder accepts the 2026-10-20 amendment: whenever a password is set, the backend checks it against the HIBP Pwned Passwords range API (SHA-1 computed in memory; only the first 5 hex characters sent; Add-Padding: true; suffixes compared locally; timeout, circuit breaker, reply size cap; in-process cache by prefix 24 h, single-flight) and a bundled common-password list (provenance checked before shipping). If HIBP is unreachable the check fails open on the bundled list, writes breach_check_skipped and rechecks at the next successful sign-in. No password or full hash leaves the server."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: IC-DEPLOY-ENTRY
    contract: "Effective when ADR-0009 is Accepted: the VPS's authorized_keys holds exactly two keys, both the founder's, and no key, account or sudo entry of the AI agent (T2). (1) The founder deploy key: command=<wrapper>,restrict,from=<founder machine tailnet address> on a dedicated deploy account; the wrapper ignores SSH_ORIGINAL_COMMAND and runs one sudo entry (NOPASSWD, empty-argument form, env_reset, secure_path, no ALL, no SETENV) for one root-owned no-argument deploy script; input only on stdin as one length-prefixed stream of exactly three parts (manifest, manifest.sig, image.tar) with per-part caps, read by the script into fresh root-owned staging under an exclusive lock; output one word from the closed vocabulary (ok, busy, args_present, input_format, input_too_large, state_missing, unsigned, bad_signature, namespace_mismatch, signer_unknown_or_expired, field_syntax, not_next_release, chain_mismatch, manifest_expired, config_mismatch, tarball_hash_mismatch, image_digest_mismatch, unreviewed_migration, privileged_migration_pending, checksum_mismatch, migration_failed, fingerprint_mismatch, health_failed, catalogue_check_failed, record_failed, rolled_back) plus an exit code, never raw tool output. (2) The founder admin key: interactive OpenSSH login on the admin account (kadmin, sudo: in effect root) for founder-run host steps and the rollback script, each host-step session starting with the clean-session check from the USB. Both keys are held on the encrypted signing USB (FIDO2 at the first paying customer), never loaded in an ssh-agent while an agent session runs. OpenSSH over the tailnet only; the Tailscale SSH feature is off for the VPS; root login disabled and password authentication off (founder, 2026-10-20). Founder routes outside SSH: the VPS provider account (console, rescue, snapshots; the lost-USB recovery route) and the Tailscale admin account (network reachability only), both with 2FA on the founder's phone, used only from the phone, never signed in from the workstation browser. Scripts, wrapper, allowed_signers, gate state, secret files, Compose file (image as ${KODEEBO_IMAGE}, set by the deploy script from the verified image_digest) and nginx configuration are root-owned and changed only over the admin key; per-release expected-fingerprints files are written only by the deploy script."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: IC-RELEASE-MANIFEST
    contract: "Effective when ADR-0009 is Accepted: every release carries a manifest the founder signs in the release ceremony, namespace kodeebo-release-manifest-v1, one field per line, each exactly once: release, previous_manifest_sha256, not_after, git_commit, image_digest, image_tarball_sha256, migrations, key_fingerprint.<label> per server key, compose_sha256, nginx_conf_sha256, sbom_app_sha256, sbom_image_sha256, scan summary. The deploy script verifies the staged copy with ssh-keygen -Y verify -n kodeebo-release-manifest-v1 -I founder-signing@kodeebo -f /etc/kodeebo/allowed_signers (OpenSSH 9.6p1 on the VPS passed S40v), parses fields only from the verified copy, and accepts only release = last_release + 1, previous_manifest_sha256 equal to the last accepted manifest's SHA-256, not_after in the future, and compose/nginx hashes equal to the host files. Gate state (last_release, last_manifest_sha256) is root-owned, written by rename only when the run ends ok, founder-initialised, backed up off-host, and re-initialised from the off-host deploy record after any restore; missing state refuses. Signing custody: its own encrypted USB now (hand-typed passphrase, no AI agent session running, USB removed after); two FIDO2 keys at the first paying customer after S45; a TPM key only as an optional interim after the agent-account move and S47."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: IC-MIGRATION-JOB
    contract: "Effective when ADR-0009 is Accepted: migrations run as a one-shot container from the backend image, under its own UID, before the new version starts: Flyway Community 13.10.3 as a library (flyway-core, flyway-database-postgresql, pgjdbc 42.7.14), files V<n>__<verb>_<object>.sql, login deploy_rt with the role default migrator, flyway.postgresql.transactional.lock=false, validate before migrate (checksum_mismatch stops); it stops with privileged_migration_pending when a pending version is on the committed privileged-migrations.txt and with unreviewed_migration when a pending id is not in the signed manifest; logs session_user, current_user and the run identity. The bootstrap roles script runs outside Flyway as the bootstrap superuser (local peer), so the first deploy_rt run creates the history table as migrator. Privileged versions are applied only by the privileged procedure: the migration job run by the founder as the bootstrap superuser through the PostgreSQL container's socket with target=<version>, non-role objects ending owned by migrator or their C5 definer owner (S57 before the first one). S52 (history table owned by migrator, installed_by migrator, a privileged CREATE ROLE fails 42501) is a CI test re-run on every Flyway or pgjdbc bump."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: IC-STARTUP-FINGERPRINT
    contract: "Effective when ADR-0009 is Accepted: before serving, the backend computes HMAC-SHA-256(key, fixed label per key and purpose including the key id) for each server key and compares a truncated value with the expected value the deploy script wrote from the verified manifest to that release's own file /etc/kodeebo/releases/<N>/expected-fingerprints (root-owned 0444, mounted read-only into that release's backend only; a rollback mounts the previous release's file; never an environment value, never agent-writable): FingerprintCheck.verify(expected) -> Ok | Mismatch(label) | Missing(label); it logs only the label and ok|mismatch|missing, never the computed value, and exits non-zero on anything but Ok, with a bounded restart count; the health gate then fails and the old version keeps running."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: IC-SCANNER-CONTAINER
    contract: "Effective when ADR-0009 is Accepted: scanners run only on the founder's machine inside a locked-down container (--pull=never --rm --read-only --cap-drop ALL --security-opt no-new-privileges --user 65534:65534, pids/memory/CPU limits, bounded /tmp tmpfs rw,noexec,nosuid,nodev, HOME=/tmp, the Trivy binary mounted read-only) with no access to the home directory, SSH keys, Bitwarden, Tailscale or the Docker socket, inputs (image tarball, lockfile or SBOM) mounted read-only, and network only in the step that needs it. Trivy update step (network on): trivy image --download-db-only --db-repository ghcr.io/aquasecurity/trivy-db:2 --skip-version-check --disable-telemetry. Trivy scan step (--network none, DB cache read-only at /cache, TRIVY_CACHE_DIR=/cache): trivy image --input <tar> --cache-backend memory --pkg-types os --scanners vuln --skip-db-update --skip-java-db-update --offline-scan --skip-version-check --disable-telemetry. OSV-Scanner on gradle.lockfile runs in the same container type as its own step with network for its lookup. trivy-db is refreshed once per release, never more than once a day. Reason: the 2026-03-19 Trivy release compromise (GHSA-69fq-xp46-6x23). A scan that could not run is not_run, never a pass."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: IC-RELEASE-CEREMONY
    contract: "Effective when ADR-0009 is Accepted: every release is built, scanned, signed and sent by the founder in the release ceremony, with no AI agent session running (checked, S48), in a split order so that agent-written build code never runs while the signing USB is present: (1) clean-session check, USB in, scripts' hash checked, scripts copied to a root-owned read-only location, USB out; (2) with the USB absent, Gradle in a throwaway container (only the checkout and the founder's dedicated caches; no home, no USB, no Docker socket; network on during this step only, nothing secret reachable from it), image build with the founder account's Docker from the reviewed git commit (Gradle strict verification; base images by digest), docker save, Trivy scan and image SBOM in the scanner container, CycloneDX Gradle plugin SBOM; (3) image digest and SBOM hashes recorded; (4) clean-session check again, USB in, scripts' hash re-checked, manifest printed field by field with its SHA-256, ssh-keygen -Y sign, send on the founder deploy key's stdin, USB out. The founder account's own Gradle and Docker caches (never the agent's) are filled only after the agent-account move, and no release ceremony runs before it. Remaining trust: the founder's review of build files and dependency updates. The ceremony runs from scripts plus docs/runbooks/release-ceremony.md (every command, what it does, expected output, what to do on failure). The AI writes the scripts; every change is reviewed by the founder as a git diff before first use; the ceremony runs only the reviewed copy on the signing USB, never the repository copy; its SHA-256 is recorded off-machine (paper or the Bitwarden app on the founder's phone, never the Bitwarden browser extension on the workstation) and checked against the value the founder types at the start of every ceremony. The one-time dependency download into the founder's caches is recorded with its size once measured."
    adr: ADR-0009
    adr_status: Accepted
    status: "superseded_by: ADR-0009 threat-model amendment review 2026-10-20 -> IC-RELEASE-CEREMONY-R2"
  - id: IC-RELEASE-CEREMONY-R2
    contract: "Effective (ADR-0009 Accepted; amendment note 2026-10-20 approved by the founder): every release is built, scanned, signed and sent by the founder in the release ceremony, with no AI agent session running (checked, S48), in a split order so that agent-written build code never runs while the signing USB is present: (1) clean-session check, USB in, scripts' hash checked, scripts copied to a root-owned read-only location, USB out; (2) with the USB absent (step 2 refuses to start while the USB block device is present), under a dedicated build account (neither the founder's nor the agent's) on a rootless Docker runtime, never the founder account's rootful daemon: (2a) fetch, network on: Gradle resolves dependencies under strict verification into the dependency cache (only caches/modules-2 persists), base images pulled by digest from the official repository with tag->digest shown to the founder; (2b) build, --network none: Gradle --offline in a throwaway container with the scanner flags (non-root, cap-drop ALL, no-new-privileges, read-only root, bounded tmpfs, limits), the dependency cache read-only, a fresh GRADLE_USER_HOME on tmpfs, no init scripts, build and configuration caches off; image build --network none from the pinned base, installing no packages; docker save, Trivy scan and image SBOM in the scanner container, CycloneDX Gradle plugin SBOM; S59 proves a changed cached JAR fails the build, else the dependency cache is fresh per release; (3) image digest and SBOM hashes recorded; (4) reboot, clean-session check again (also covering the build account and system units and timers), USB in, scripts' hash re-checked, manifest printed field by field with its SHA-256, ssh-keygen -Y sign, send on the founder deploy key's stdin, USB out. The build account's Gradle and Docker caches (never the agent's) are filled only after the agent-account move; no release ceremony and no admin-key host step runs before it (Migration Plan order 1-4, 7, 5, 6, 8, 9). Remaining trust: the founder's review of build files and dependency updates. The ceremony runs from scripts plus docs/runbooks/release-ceremony.md (every command, what it does, expected output, what to do on failure). The AI writes the scripts; every change is reviewed by the founder as a git diff before first use; the ceremony runs only the reviewed copy on the signing USB, never the repository copy; its SHA-256 is recorded off-machine (paper or the Bitwarden app on the founder's phone, never the Bitwarden browser extension on the workstation) and checked against the value the founder types at the start of every ceremony. The one-time dependency download into the build account's caches (or the per-release download if S59 fails) is recorded with its size once measured."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: IC-OUTBOX-SWEEP-R3
    contract: "Effective when ADR-0012 is Accepted (replaces IC-OUTBOX-SWEEP-R2 then): the JobRunner pass reads tenant ids and status from CP tenant_status as platform_rt (no cache); per tenant, one withScope(Job, tenant) transaction reads job_schedule and inserts only missing (tenant, kind) rows for kinds the status allows (ON CONFLICT DO NOTHING) and reads the tenant's metric counts; then one item per transaction: claim one due job_schedule row or job_outbox row (pending with run_at <= now, or running with lease_until < now) of an allowed kind with the Exposed DSL forUpdate(ForUpdateOption.PostgreSQL.ForUpdate(MODE.SKIP_LOCKED)) and limit(1), run it, commit; up to batchPerTenant items per tenant per pass; no singleton or new advisory lock (two runners are safe by row locks); lock order claim row lock, then ADR-0008 advisory locks, then enqueue inserts. Each kind declares the tenant statuses it runs in (defaults from TR-SUSPENSION-CONTRACT-R3 and TR-CLOSURE-STATES-R4; a feature spec may only narrow them). Enqueue is an INSERT into job_outbox in the causing transaction (app_rt Staff, device_rt Device, job_rt chained) with ON CONFLICT (tenant_id, kind, idempotency_key) DO NOTHING; traceparent stored only if W3C-valid and used as a span link. Retry in a fresh transaction: attempts + 1, last_error_class enum, run_at = now + min(cap, base * 2^(attempts-1)) * jitter[0.5,1.0] from an injected source, dead at max_attempts, all per-kind config. Job and platform Database objects use DatabaseConfig { defaultMaxAttempts = 1 }; the helper passes the role's Database explicitly; handlers never open their own transaction."
    adr: ADR-0012
    adr_status: Proposed
    status: "superseded_by: ADR-0012 (CTO-ADR revision 2026-10-21) -> IC-OUTBOX-SWEEP-R4"
  - id: IC-EXTERNAL-EFFECT
    contract: "Effective when ADR-0012 is Accepted: a job whose effect calls a provider (email, push, any outbound call) runs as: transaction A claims the job_outbox row and sets status running, lease_until = now + leaseDuration, lease_owner = instanceId, attempts + 1, commits; the provider is called outside any transaction with the item id as the provider's idempotency key, under a timeout, retry policy and circuit breaker; transaction B (NonCancellable) marks done WHERE status = 'running' AND lease_owner = instanceId, or sets pending with backoff or dead. Done means the provider accepted the message (the event ADR-0007 M31 gating needs). An expired lease makes the row claimable again; leaseDuration exceeds the provider timeout plus the retry budget. auth_notices (PL) follows this contract; its claim and ack functions are added to ADR-0001 § 1c by ADR-0013, and no notice kind ships before that. Database-only effects instead commit claim, effect and done in one transaction (the open transaction is the lease)."
    adr: ADR-0012
    adr_status: Proposed
    status: "superseded_by: ADR-0012 (threat-model amendment 2026-10-21) -> IC-EXTERNAL-EFFECT-R2"
  - id: IC-JOB-LIFECYCLE
    contract: "Effective when ADR-0012 is Accepted: one JobRunner per backend process with its own CoroutineScope(SupervisorJob() + db-job dispatcher), start() from an ApplicationStarted handler gated by config jobs.enabled (so testApplication never starts it), stop(timeout) from an ApplicationStopping handler bridged with runBlocking and bounded by its own withTimeoutOrNull (logs drain time and timed-out); Hikari pools closed in ApplicationStopped; ApplicationStopPreparing and @InternalAPI disposeAndJoin never used; the loop is never launched on the Application scope. Timeout rule 1: per-kind transaction_timeout < runner stop timeout. Rule 2: Ktor's stop phases are sequential (engine stop, ApplicationStopping handlers, disposeAndJoin under shutdownTimeout set explicitly), and their sum stays below the Compose stop grace period. job_rt and platform_rt pools set client_connection_check_interval (typed default 1 s) through the pgjdbc options string built in one place; job_rt also has idle_in_transaction_session_timeout. CancellationException is always rethrown, never an attempt; retry bookkeeping runs in NonCancellable. instanceId per process start for leases and metrics."
    adr: ADR-0012
    adr_status: Proposed
    status: active
  - id: IC-OUTBOX-SWEEP-R4
    contract: "Effective when ADR-0012 is Accepted (replaces IC-OUTBOX-SWEEP-R2 then; R3 superseded by the CTO-ADR revision of 2026-10-21): the JobRunner pass reads tenant ids and status from CP tenant_status as platform_rt (no cache); per tenant, one withScope(Job, tenant) transaction reads job_schedule and inserts only missing (tenant, kind) rows for kinds the status allows (ON CONFLICT DO NOTHING) and reads the tenant's metric counts (pending, oldest pending age, dead, schedule overdue, consecutive failures); then one item per transaction: claim one due job_schedule row or job_outbox row (pending with run_at <= now, or running with lease_until < now) of an allowed kind with the Exposed DSL forUpdate(ForUpdateOption.PostgreSQL.ForUpdate(MODE.SKIP_LOCKED)) and limit(1), run it, commit; up to batchPerTenant items per tenant per pass; no singleton or new advisory lock; lock order claim row lock, then ADR-0008 advisory locks, then enqueue inserts. Each kind declares the tenant statuses it runs in (defaults from TR-SUSPENSION-CONTRACT-R3 and TR-CLOSURE-STATES-R4, including the owner tenant-wide export while suspended and, for archive_retained, archive export, archive purge and job pruning; a feature spec may only narrow them). Enqueue is an INSERT into job_outbox in the causing transaction with ON CONFLICT (tenant_id, kind, idempotency_key) DO NOTHING; traceparent stored only if W3C-valid and used as a span link. Retry bookkeeping runs in a fresh, guarded transaction: re-claim FOR UPDATE SKIP LOCKED WHERE id and the status and attempts seen (schedule rows: next_run_at seen); no row means another runner owns the item and the bookkeeping is dropped. Outbox rows: attempts + 1, last_error_class, run_at = now + min(cap, base * 2^(attempts-1)) * jitter[0.5,1.0], dead at max_attempts. Recurring rows never go dead: consecutive_failures + 1, next_run_at = now + min(interval, backoff), reset on success, alert at a per-kind threshold or when overdue. Job and platform Database objects use DatabaseConfig { defaultMaxAttempts = 1 }; the helper passes the role's Database explicitly; handlers never open their own transaction."
    adr: ADR-0012
    adr_status: Proposed
    status: "superseded_by: ADR-0012 (threat-model amendment 2026-10-21) -> IC-OUTBOX-SWEEP-R5"
  - id: IC-EXTERNAL-EFFECT-R2
    contract: "Effective when ADR-0012 is Accepted (threat-model amendment 2026-10-21): a job whose effect calls a provider (email, push, any outbound call) runs as: transaction A claims the job_outbox row and sets status running, lease_until = now() + leaseDuration on database time, a fresh per-claim lease_token, lease_owner = instanceId (metrics only), attempts + 1, commits; the provider is called outside any transaction with the item id as the provider's idempotency key, under a timeout, retry policy and circuit breaker; transaction B (NonCancellable) marks done WHERE status = 'running' AND lease_token = the claim's token, and the failure branch (pending with backoff, or dead) uses the same guard. Done means the provider accepted the message (the event ADR-0007 M31 gating needs). An expired lease makes the row claimable again; leaseDuration exceeds the provider timeout plus the retry budget. auth_notices (PL) follows this contract; its claim and ack functions are added to ADR-0001 § 1c by ADR-0013, and no notice kind ships before that. Database-only effects instead commit claim, effect and done in one transaction (the open transaction is the lease)."
    adr: ADR-0012
    adr_status: Proposed
    status: "superseded_by: ADR-0012 (text correction 2026-10-21) -> IC-EXTERNAL-EFFECT-R3"
  - id: IC-EXTERNAL-EFFECT-R3
    contract: "Effective when ADR-0012 is Accepted (text correction 2026-10-21, notifications research F106, F112, F218): a job whose effect calls a provider (email, push, any outbound call) runs as: transaction A claims the job_outbox row and sets status running, lease_until = now() + leaseDuration on database time, a fresh per-claim lease_token, lease_owner = instanceId (metrics only), attempts + 1, commits; the provider is called outside any transaction with the item id as the idempotency key (passed to the provider where it accepts one), under a timeout, retry policy and circuit breaker; transaction B (NonCancellable) marks done WHERE status = 'running' AND lease_token = the claim's token, and the failure branch (pending with backoff, or dead) uses the same guard. Done means the provider accepted the message (the event ADR-0007 M31 gating needs). An expired lease makes the row claimable again, so an external effect is at-least-once: SMTP, Web Push and FCM take no idempotency key, a duplicate email is accepted and a duplicate push is dropped on the client by notice id (ADR-0013 states this per channel); leaseDuration exceeds the provider timeout plus the retry budget. auth_notices (PL) follows this contract; its claim and ack functions are added to ADR-0001 § 1c by ADR-0013, and no notice kind ships before that. Database-only effects instead commit claim, effect and done in one transaction (the open transaction is the lease)."
    adr: ADR-0012
    adr_status: Proposed
    status: active
  - id: IC-OUTBOX-SWEEP-R5
    contract: "Effective when ADR-0012 is Accepted (replaces IC-OUTBOX-SWEEP-R2 then; R3 and R4 superseded by the 2026-10-21 revisions): the JobRunner pass reads tenant ids and status from CP tenant_status as platform_rt (no cache); per tenant, one withScope(Job, tenant) transaction reads job_schedule and inserts only missing (tenant, kind) rows for kinds the status allows and reads the tenant's metric counts; then one item per transaction: claim one due job_schedule row or job_outbox row (pending with run_at <= now, or running with lease_until < now) of an allowed kind with the Exposed DSL forUpdate(ForUpdateOption.PostgreSQL.ForUpdate(MODE.SKIP_LOCKED)) and limit(1), run it, commit; up to batchPerTenant items per tenant per pass, claim order by priority then run_at; no singleton or new advisory lock; lock order claim row lock, then ADR-0008 advisory locks, then enqueue inserts. Each kind declares runsWhen (defaults from TR-SUSPENSION-CONTRACT-R3 and TR-CLOSURE-STATES-R4, including the owner tenant-wide export while suspended; a registry test fails a widened set and any kind for purged), producers (Staff-owner, Staff-any, Device, Job; the WorkQueue adapter refuses others and stamps producer_kind and producer_subject from the scoped transaction) and personRefs; state-sensitive kinds re-read tenant_status in their own transaction; person-started or branch-limited kinds re-check the producer at run time (Dead(reauth_refused) otherwise). Enqueue is an INSERT into job_outbox in the causing transaction with ON CONFLICT (tenant_id, kind, idempotency_key) DO NOTHING; the payload is the sealed JobPayload type (typed ids, enums, bounded integers, instants only) and the key a typed IdempotencyKey built from domain ids; traceparent stored only if W3C-valid and used as a span link. Retry bookkeeping runs in a fresh, guarded transaction (re-claim FOR UPDATE SKIP LOCKED on id plus the status and attempts seen; schedule rows next_run_at seen); outbox rows back off and go dead at max_attempts; recurring rows never go dead (consecutive_failures, backoff, alerts). Job and platform Database objects use DatabaseConfig { defaultMaxAttempts = 1 }; the helper passes the role's Database explicitly; handlers never open their own transaction; job logs and spans carry only the allow-listed fields."
    adr: ADR-0012
    adr_status: Proposed
    status: "superseded_by: ADR-0012 (CTO delta re-check revision 2026-10-21) -> IC-OUTBOX-SWEEP-R6"
  - id: IC-OUTBOX-SWEEP-R6
    contract: "Effective when ADR-0012 is Accepted (replaces IC-OUTBOX-SWEEP-R2 then; R3 to R5 superseded by the 2026-10-21 revisions): the JobRunner pass reads tenant ids and status from CP tenant_status as platform_rt (no cache); per tenant, one withScope(Job, tenant) transaction reads job_schedule and inserts only missing (tenant, kind) rows for kinds the status allows and reads the tenant's metric counts; then one item per transaction: claim one due job_schedule row or job_outbox row (pending with run_at <= now, or running with lease_until < now) of an allowed kind with the Exposed DSL forUpdate(ForUpdateOption.PostgreSQL.ForUpdate(MODE.SKIP_LOCKED)) and limit(1), ordered by the priority column (set by the WorkQueue adapter from the kind registry) then run_at, run it, commit; up to batchPerTenant items per tenant per pass; no singleton or new advisory lock; lock order claim row lock, then ADR-0008 advisory locks, then enqueue inserts. Each kind declares runsWhen (defaults from TR-SUSPENSION-CONTRACT-R3 and TR-CLOSURE-STATES-R4, including the owner tenant-wide export while suspended; a registry test fails a widened set and any kind for purged), producers (Staff-owner, Staff-any, Device, Job; the WorkQueue adapter refuses others and stamps producer_kind and producer_subject from the scoped transaction) and personRefs. Steps a closure cancel can race (closure steps, purges) act only through a conditional transition owned by the ADR-0005 closure flow (UPDATE ... WHERE state = :expected; 0 rows means do nothing and log NotYet; no FOR SHARE, no CP grant for job_rt); a plain re-read only where a stale status is harmless. Person-started or branch-limited kinds re-check the producer at run time (Dead(reauth_refused) otherwise). Enqueue is an INSERT into job_outbox in the causing transaction with ON CONFLICT (tenant_id, kind, idempotency_key) DO NOTHING; the payload is the sealed JobPayload type (typed ids, enums, bounded integers, instants only) and the key a typed IdempotencyKey built from domain ids; traceparent stored only if W3C-valid and used as a span link. Retry bookkeeping runs in a fresh, guarded transaction (re-claim FOR UPDATE SKIP LOCKED on id plus the status and attempts seen; schedule rows next_run_at seen); outbox rows back off and go dead at max_attempts; recurring rows never go dead (consecutive_failures, backoff, alerts). Job and platform Database objects use DatabaseConfig { defaultMaxAttempts = 1 }; the helper passes the role's Database explicitly; handlers never open their own transaction; job logs and spans carry only the allow-listed fields."
    adr: ADR-0012
    adr_status: Proposed
    status: "active (superseded_by: ADR-0013, effective on acceptance -> IC-OUTBOX-SWEEP-R7)"
  - id: IC-CORE-MODULE-IDENTITY
    contract: "Effective when ADR-0010 is Accepted: each of the fourteen Layer 1 modules (tenancy, identity, otp, ratelimit, authz, audit, operator, licensing, billing, notify, jobs, observability, analytics, storage) and its <module>-conformance module has Gradle group net.kodelix.core, project name = module name, package net.kodelix.core.<module>, strict explicitApi(), a committed ABI dump <module>/api/<module>.api checked by checkKotlinAbi on every PR, migrations in src/main/resources/db/migration/net/kodelix/core/<module>/V0001__<verb>_<object>.sql (4-digit, never reused), history table flyway_<module>, and migration id <module>:<version> in the job, manifest, privileged list and deploy record; product contexts use net.kodelix.kodeebo.<context> with the same migration layout. A lift changes build files and regenerated lock and verification files only, never Kotlin source."
    adr: ADR-0010
    adr_status: Proposed
    status: active
  - id: IC-RETENTION-PARTICIPANT
    contract: "Effective when ADR-0010 is Accepted (founder 2026-10-21): tenancy defines TenantDataParticipant (export its tables EXP-2, purge personal data, delete, for one tenant) and identity defines the per-person form (de-identify, delete personal fields, extract); steps and signatures are ADR-0005s, written in /design-spec tenant-foundation. Every module holding tenant or personal data implements it; only :app registers participants; the orchestrator deletes in reverse dependency order (children first) and exports in dependency order; coverage tests (ADR-0005 M47, erasure) fail when a module with tenant tables registers none."
    adr: ADR-0010
    adr_status: Proposed
    status: active
  - id: IC-CORE-ROLES-BOOTSTRAP
    contract: "Effective when ADR-0010 is Accepted (founder 2026-10-21): the founder-run bootstrap roles script (outside Flyway, ADR-0009 B4/M5) is split into a core part, shipped versioned with the tenancy module at tenancy/src/main/resources/bootstrap/net/kodelix/core/tenancy/roles.sql and moved with it on a lift, creating the roles and role defaults Layer 1 SQL needs (ADR-0001 1b as amended), and a product part for Kodeebo-only roles. Both run once as the bootstrap superuser through the local peer login; a product consuming saas-core-kotlin runs the core part before its first migration. A new role needs an ADR-0001 amendment and the ADR-0009 4a privileged route."
    adr: ADR-0010
    adr_status: Proposed
    status: active
  - id: IC-NOTICE-GATED-FACTOR-CHANGE-R2
    contract: "Effective when ADR-0013 is Accepted (replaces IC-NOTICE-GATED-FACTOR-CHANGE then): a lost-factor reset (SecondFactors.startReset) and a delayed factor removal (SecondFactors.applyPendingRemovals) apply only after AuthNotices.isAccepted is true for every notice they require: no recipient of the notice pending and at least one accepted (provider accepted = the SMTP 250 reply to the end of DATA). A recipient whose address is flagged failing, or whose item went dead, does not block the notice and raises an alert naming the contact, never the address. The delay counts from the last acceptance. If every recipient failed, or no acceptance arrives within the configured bound, the change pauses and the operator is alerted (ids only) (staff-auth threat model M31; ADR-0013 Decision 7)."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: IC-PRE-CONTEXT-LOOKUPS-R12
    contract: "Effective when ADR-0013 is Accepted (replaces IC-PRE-CONTEXT-LOOKUPS-R11 then): ADR-0001 § 1c, SECURITY DEFINER functions owned by auth_lookup, pinned search_path, EXECUTE only for the named roles: LoginLookup.find(identifier), Logins.create/disable (owner, app_rt), Logins.statusOf(user) (inside, tenant match, app_rt), Logins.changeOwnVerifier(tokenHash, verifier) (app_rt, after the app re-verifies the current password); SessionLookup.find, Sessions.create, Sessions.end (app_rt), Sessions.endAllForUser (owner, app_rt), Sessions.endAllForTenant (platform_rt); EnrolmentCodeLookup.find(codeHash) -> {tenant, branch, branchLabel, seat, state} (device_rt, no consumption), Enrolment.createCode (owner, app_rt; stores the branch display label on the code row), Enrolment.redeem (device_rt); DeviceCredentialLookup.find, Devices.rotateCredential (device_rt), Devices.revokeCredential (owner, app_rt), Devices.revokeCredentialForLicensing (licensing service roles, tenant match only); SupportGrantLookup.find(grantId, operatorId), listByOperator(operatorId) (support_rt); SupportGrants.revokeAllForTenant(tenant) (before, platform_rt, suspension step); inside, job (EXECUTE by job_rt only, app.tenant_id must equal the row's tenant, context tenant only): Closure.endSessions(), Closure.purgeLogins() (owner's login included), Closure.purgeEnrolmentCodes(), Closure.revokeDevices(), Closure.revokeGrants(), Closure.purgeRemaining() (at purged), Erasure.erasePersonLogin(user). auth_lookup never reads TD tables. Effective when ADR-0007 is Accepted (ADR-0007 Key Interfaces is the full list): Sessions.create(user, tenant, tokenHash, aal, absoluteExpiresAt, idleExpiresAt) replaces the old signature; Sessions.touch, rotate, listOwn, endOwn, endOthers (before, app_rt, bound to the caller's session); Contacts.startVerify/confirm (login_contacts); Recovery.create(identifier, tokenHash, expiresAt) (no-op for a disabled login or a non-owner of a suspended tenant; reads the verified address from login_contacts; writes auth_notices), Recovery.redeem -> resetHandle; Logins.resetVerifier(resetHandle, verifier, pepperKeyId) consumes the handle, ends every session, voids recovery requests and step-up grants in one transaction; Logins.rehash (compare-and-set), Logins.issueTemporary (inside, owner until the ADR-0003 amendment), Logins.markMustReset(pepperKeyId) (inside, job); Logins.disable also voids recovery requests and step-up grants; SecondFactors.forLogin, findByCredentialId, recoveryCodesFor, consumeRecoveryCode(user, codeId), acceptTotpStep, updatePasskeyCounter, enrol/remove (before, app_rt), startReset (inside, owner, step-up), applyPendingRemovals and reencrypt (inside, job), cancelRemoval (before, app_rt); Challenges.create/consume for register and step-up (unbound sign-in challenges stay in process memory); StepUp.issue (before, app_rt, after Sessions.rotate), StepUp.consume (inside, tenant match, app_rt); AuthNotices.claim (inside, job: the notice job reads owner contacts in tenant scope); Enrolment.issueAssertion (before, app_rt, after a full sign-in check, no session) and Enrolment.consumeAssertion(assertionHash, deviceKeyId) (before, device_rt, single use); Erasure.erasePersonLogin and Closure.purgeLogins also cover login_contacts, second_factors, recovery_requests, enrolment_assertions (erasure also step_up_grants); Closure.endSessions also step_up_grants and webauthn_challenges. No SMS path; device_rt gets no password or second-factor lookup. Amended by ADR-0008 (effective when ADR-0008 is Accepted): Logins.statusOf also EXECUTE by job_rt; Logins.disable and Erasure.erasePersonLogin take the last-owner lock (after any trail append) and refuse the last active owner; Logins.issueTemporary and Logins.disable refuse an owner target unless app.branch_all = 'on'; for these checks only, auth_lookup may SELECT staff_roles and roles.is_owner inside the tenant context. Amended 2026-10-19 by the staff-auth threat model (founder): Enrolment.consumeAssertion also returns a single-use receipt (>= 128 bits CSPRNG, SHA-256 in enrolment_assertions.receipt_hash) bound to tenant, the login user, device key and a short expiry; new Enrolment.consumeReceipt(receiptHash, userId, deviceKeyId) (inside, tenant match, device_rt, called by the pin_upload_facts trigger, which resolves the uploading person to their login on the TD side) consumes it once; the first use of a temporary password (Logins.issueTemporary) writes an auth_notices row for the owner (M55); no key in the database; a restore voids unconsumed receipts. Amended 2026-10-20 (effective when the founder accepts the 2026-10-20 amendment:) Enrolment.consumeReceipt(receiptHash, userId) -> {path, requestId} | null reads app.device_id itself and accepts only a receipt whose stored device key belongs to that device in device_credentials (no device key id from the trigger or request), EXECUTE by pin_writer only; enrolment_assertions gains issuing_path and request_id, set only by the issuing function; Enrolment.issuePhoneAssertion(userId, assertionHash, expiresAt) (inside, tenant match, device key from app.device_id, EXECUTE pin_writer only); login_failure_state unique NULLS NOT DISTINCT (tenant_id, user_id, signal_hash); the not-me block sits on the anonymous row and blocks every signal; unblock(user) clears every row; the use case appends login.block/unblock to the control journal before calling the function; FailureState.of, recordFailure, clearOnSuccess (count only, never a block) with (user, signalHash), noteSent(user), block(user, signalHash, ceiling|not_me), unblock (before, app_rt; only for logins LoginLookup.find returned, after admission; block and unblock write login.block / login.unblock to the control journal; unblock only inside Logins.resetVerifier or an owner-issued temporary password) and FailureState.purgeExpired (inside, job; never a blocked row); Erasure.erasePersonLogin and Closure.purgeLogins also cover login_failure_state. Amended by ADR-0013 (effective when ADR-0013 is Accepted): AuthNotices.claim(batch) is replaced by AuthNotices.claimOne(), AuthNotices.addRecipients(noticeId, recipients), AuthNotices.recipientAccepted(noticeId, recipientId) (idempotent), AuthNotices.recipientFailed(noticeId, recipientId, reason); Contacts.addressFor(contactId), Contacts.markFailing(contactId), Contacts.markOk(contactId); Recovery.addToken(requestId, tokenHash, expiresAt), Recovery.confirmToken(requestId, tokenHash); SecondFactors.addCancelToken(removalId, tokenHash, expiresAt), SecondFactors.confirmCancelToken(removalId, tokenHash) (all inside, job, EXECUTE job_rt, tenant match); AuthNotices.isAccepted(noticeId) is internal to auth_lookup (EXECUTE granted to no role) and used by the M31 gate; Recovery.create(identifier, expiresAt) replaces the signature with tokenHash; the new PL table auth_notice_recipients is reached only through these functions; Erasure.erasePersonLogin and Closure.purgeLogins also cover auth_notice_recipients."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: IC-OUTBOX-SWEEP-R7
    contract: "Effective when ADR-0012 and ADR-0013 are both Accepted (replaces IC-OUTBOX-SWEEP-R6 then): the JobRunner pass reads tenant ids and status from CP tenant_status as platform_rt (no cache); per tenant, one withScope(Job, tenant) transaction reads job_schedule and inserts only missing (tenant, kind) rows for kinds the status allows and reads the tenant's metric counts; then one item per transaction: claim one due job_schedule row or job_outbox row (pending with run_at <= now, or running with lease_until < now) of an allowed kind with the Exposed DSL forUpdate(ForUpdateOption.PostgreSQL.ForUpdate(MODE.SKIP_LOCKED)) and limit(1), ordered by the priority column (set by the WorkQueue adapter from the kind registry) then run_at, run it, commit; up to batchPerTenant items per tenant per pass; no singleton or new advisory lock; lock order claim row lock, then ADR-0008 advisory locks, then enqueue inserts. Each kind declares runsWhen (defaults from TR-SUSPENSION-CONTRACT-R3 and TR-CLOSURE-STATES-R4, including the owner tenant-wide export while suspended; a registry test fails a widened set and any kind for purged), producers (Staff-owner, Staff-any, Device, Job; the WorkQueue adapter refuses others and stamps producer_kind and producer_subject from the scoped transaction) and personRefs. Steps a closure cancel can race (closure steps, purges) act only through a conditional transition owned by the ADR-0005 closure flow (UPDATE ... WHERE state = :expected; 0 rows means do nothing and log NotYet; no FOR SHARE, no CP grant for job_rt); a plain re-read only where a stale status is harmless. Person-started or branch-limited kinds re-check the producer at run time (Dead(reauth_refused) otherwise). Enqueue is an INSERT into job_outbox in the causing transaction with ON CONFLICT (tenant_id, kind, idempotency_key) DO NOTHING; the payload is the sealed JobPayload type (typed ids, enums, bounded integers, instants only) and the key a typed IdempotencyKey built from domain ids; traceparent stored only if W3C-valid and used as a span link. Retry bookkeeping runs in a fresh, guarded transaction (re-claim FOR UPDATE SKIP LOCKED on id plus the status and attempts seen; schedule rows next_run_at seen); outbox rows back off and go dead at max_attempts; recurring rows never go dead (consecutive_failures, backoff, alerts). Job and platform Database objects use DatabaseConfig { defaultMaxAttempts = 1 }; the helper passes the role's Database explicitly; handlers never open their own transaction; job logs and spans carry only the allow-listed fields. Amended by ADR-0013 Decision 9: before claiming an item of a mail or push kind the sweep asks SendAdmission (global and per-tenant token buckets, destination breakers); held means nothing of those kinds is claimed for that tenant in that pass and no attempt is spent; a reserved token is returned when the claim finds no due item. The JobRunner also hosts platform periodic tasks beside the sweep: each reads an outside source, then works one tenant per withScope(Job, tenant) transaction under the tenant status gate, holds no row and no lock, is idempotent and is bounded by the runner stop timeout (the bounce reader is the first). JobHandler gains inClaim(tx, item) -> ClaimContext in transaction A and onAccepted(tx, item, ctx) in transaction B; transactions A and B call only the ADR-0001 § 1c functions the kind declares; neither hook calls a provider."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: IC-NOTIFY-MAIL-SEND
    contract: "Effective when ADR-0013 is Accepted: notify's MailSender sends one recipient per message from a mail job item (an external effect, ADR-0012); the message is built once per item (the same bytes, Date and Message-ID on every attempt); the envelope sender is the VERP address no-reply+<tenant>.<item>@kodelix.net (opaque ids only); accepted = the 250 reply to the end of DATA. Classification by stage and reply code: 4yz, 421 and connect, TLS, greeting or EHLO failures are transient (retry); any I/O failure after DATA began is ambiguous (retry with the same item id and Message-ID; a duplicate email is accepted); an AUTH, MAIL FROM, certificate or TLS refusal is a sender configuration fault (retry, mail breaker open, operator alert); 5yz to RCPT is Dead(recipient_rejected) and flags the address failing; 5yz to DATA or to the dot is Dead(message_rejected). Typed config defaults, never code: connect 5 s, read 20 s, write 20 s, whole-send deadline 60 s by a watchdog off the send dispatcher, mail leaseDuration 120 s, Dispatchers.IO.limitedParallelism(2, \"notify-mail\"); Transport.close() in a finally; an outer cancellation is rethrown. The mailbox password is a 0400 secret file read at start (start fails if missing, empty, wrongly owned or not 0400); host, ports and username are config."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: IC-AUTH-NOTICE-FANOUT
    contract: "Effective when ADR-0013 is Accepted: an auth_notices row is fanned out by a database-only job kind in tenant scope in one transaction (AuthNotices.claimOne; the recipients read from tenant data or the login's verified-address reference; AuthNotices.addRecipients; one job_outbox mail item per recipient keyed by notice id and recipient id). A recipient whose address is flagged failing is written failed(address_failing) and not sent. Each sent item's transaction B calls recipientAccepted; a dead item calls recipientFailed. isAccepted = no recipient pending and at least one accepted; each failed recipient raises an owner and operator alert naming the contact, never the address. Link-bearing notices mint their token in transaction A (Recovery.addToken or SecondFactors.addCancelToken: hash and expiry only); the raw token exists only in memory and in the email; earlier links stay valid until a later attempt is accepted, whose transaction B confirms its token and voids the others; the reset and cancel pages answer an expired, used or replaced token with 'the link has expired or was replaced; use the most recent email'."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: IC-SEND-ADMISSION
    contract: "Effective when ADR-0013 is Accepted: SendAdmission is asked by the sweep before it claims a mail or push item: in-process token buckets per instance, global 300 emails/hour and per tenant 30/hour (typed config defaults, never code; the founder's host allows 500/hour shared by every mailbox on the account), refilled evenly, burst capacity in config; destination breakers. A held item is delayed, never dropped, and spends no attempt; a reserved token is returned if the claim finds nothing; an alert fires at 80 % of either cap over a rolling hour; the buckets use the injected Clock."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: IC-BOUNCE-READER
    contract: "Effective when ADR-0013 is Accepted: a JobRunner platform periodic task (interval in config) reads the no-reply mailbox over imaps with the same 0400 secret file, outside any transaction, with explicit timeouts bounded by the runner stop timeout. Per bounce it parses the RFC 3464 report, takes tenant and item from the VERP address, and in withScope(Job, tenant) acts only when that tenant holds a mail item with that id sent within the configured window (anything else is ignored and counted). A 5.7.1 relay refusal (MailChannels Domain Lockdown) is a sender configuration fault (operator alert, mail breaker open), never a recipient flag. A permanent recipient failure flags the address failing (delivery_state on the address store; login_contacts through Contacts.markFailing) and enqueues an owner alert keyed by the bounce's Message-ID. Nothing from a bounce is stored except the class and ids; the processed message is deleted; the tenant status gate applies."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: IC-EGRESS-GUARD
    contract: "Effective when ADR-0013 is Accepted: every request to a URL a user, tenant or client can influence (Web Push now, outbound webhooks and remote image fetch later) goes through egress GuardedHttp (net.kodelix.core.egress): https only; every resolved address is checked and private, loopback, link-local, unique-local and metadata ranges are refused; the connection is made to the checked address with TLS verified for the original host name (a resolver-level check on the OkHttp or Apache5 engine, proven by spike S24); the URL is never rewritten to the IP; no redirect is followed; a timeout, a response-size cap and a per-host breaker; an optional host allowlist per caller (the push-service hosts for Web Push); a negative test for each refusal; a VPS egress firewall as defence in depth (platform-lead)."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: IC-PUSH-SENDER
    contract: "Effective when ADR-0013 is Accepted: notify's PushSender has a Web Push adapter first (the maintained web-push library's RFC 8291 encryption and RFC 8292 VAPID signing; the request through egress with the push-host allowlist; BouncyCastle registered once at start; the library's own HTTP client excluded) and an FCM adapter only if OQ6 lands on Capacitor or native. Accepted = Web Push 201 or FCM 2xx; 429 and 5xx retry honouring Retry-After; Web Push 404 or 410 and FCM UNREGISTERED delete the subscription and end Dead(recipient_gone); 400 and 413 dead with an alert; 401 and 403 a credential fault (breaker open, alert). No provider de-duplicates: the payload carries the notice id and the client shows one notification per notice id; the Web Push Topic is derived from the item id. TTL = the notice's remaining life (approval requests at most 10 minutes); urgency high for approvals only; payload ids and an enum only. The VAPID private key is a 0400 secret file and its key id is stored per subscription; subscriptions are created only from an authenticated dashboard session and deleted on gone, sign-out, revoke, person erasure and by a prune job; the push_subscriptions schema is decided by the push story's migration."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: IC-APPROVAL-NUDGE
    contract: "Effective when ADR-0013 is Accepted: a push for a remote-approval request carries only the request id and a generic localised text; the owner approves only in the signed-in dashboard with step-up bound to the request (ADR-0007 § 7 pattern); nothing is approved from a notification and email is never an approval channel; remote approval never sits on a counter path: the counter's own action completes locally under 3 s and shows a waiting state, and the answer arrives by the sync nudge or a poll of 2 s or less."
    adr: ADR-0013
    adr_status: Proposed
    status: active
