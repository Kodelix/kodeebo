# Architecture registry — binding stances from ADRs, read by /architecture-decision
# (Step 3a) before any new ADR. Append only; a changing stance gets
# `status: superseded_by: ADR-NNNN` and a new entry. Never edit an entry's text.
# `adr_status` mirrors the ADR's Status at the time the entry was written.
# 2026-10-18: ADR-0001..0004 Accepted by the founder; adr_status updated to Accepted on every entry (superseded entries keep their superseded_by status).
# 2026-10-18: ADR-0001..0004 revised in place (still Proposed) after /architecture-review
# (FAIL, text fixes B1, B2 and per-ADR items); changed stances superseded by "-R2" entries.
# 2026-10-18: ADR-0005 revised after /architecture-review (FAIL, text fixes) with dated ADR-0001 and ADR-0004 amendments; changed stances superseded.
# 2026-10-18: second ADR-0005 review (FAIL, text fixes) applied; ADR-0001/0004 amendment stances say they take effect only when ADR-0005 is Accepted.
# 2026-10-18: third ADR-0005 round (re-review CONCERNS) applied: 6 superseded, TR-DEVICE-ERASURE new.
# 2026-10-18: ADR-0005 Accepted by the founder; adr_status set to Accepted on every ADR-0005 entry (superseded entries keep their superseded_by status); the ADR-0001/0004 amendments it carries are in effect.

data_ownership: []

tenancy_rules:
  - id: TR-RLS-SHARED-SCHEMA
    rule: "Every table holding tenant data has tenant_id uuid NOT NULL, ENABLE + FORCE ROW LEVEL SECURITY and a permissive policy tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid per command; unique keys and PKs lead with tenant_id; FKs between tenant tables are composite with tenant_id."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 -> TR-RLS-RESTRICTIVE-TENANT"
  - id: TR-TENANT-UNIT
    rule: "Tenant = owner organisation; branch = venue, keyed (tenant_id, id); device = cashier PC, keyed (tenant_id, branch_id, id). Seats, pricing and device binding: docs/research/licensing.md Part 1 and the licensing ADR."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: TR-SCOPE-ONCE-PER-TX
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets app.tenant_id (and branch list, device, plan timeout) with set_config(..., true) exactly once, first, from a server-side source (session lookup or verified device credential)."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 -> TR-SCOPE-ONCE-PER-TX-R2"
  - id: TR-BRANCH-SCOPE
    rule: "Branch-scoped tables carry branch_id with a composite FK to branches and a RESTRICTIVE policy on app.branch_ids / app.branch_all; app.branch_all = 'on' only for a verified owner role; application-layer function permissions through one deny-by-default Authorizer."
    adr: ADR-0003
    adr_status: Accepted
    status: "superseded_by: ADR-0003 revision 2026-10-18 -> TR-BRANCH-SCOPE-R2"
  - id: TR-SUPPORT-GRANT-GATE
    rule: "Kodelix support reads tenant data only as support_rt (NOSUPERUSER, NOBYPASSRLS, owns nothing, SELECT only on tenant tables) whose policies TO support_rt require the tenant context AND a live owner grant (approved, revoked_at IS NULL, expires_at > clock_timestamp()); the grant carries an explicit branch list and never sets app.branch_all; support writes only through SECURITY DEFINER verbs gated by a grant naming the verb; the helper commits the access record before the read."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 -> TR-SUPPORT-GRANT-GATE-R2"
  - id: TR-RLS-RESTRICTIVE-TENANT
    rule: "Every TD, CP and PL table has tenant_id uuid NOT NULL, ENABLE + FORCE ROW LEVEL SECURITY and a RESTRICTIVE FOR ALL policy tenant_isolation: tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid (USING and WITH CHECK); on TD tables it has no TO clause (binds every role); each role gets its own permissive policy TO that role for the commands it needs. Unique keys and PKs lead with tenant_id; FKs between tenant tables are composite with tenant_id."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: TR-TABLE-CLASSES
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; support grants and journal), no USING (true); CP tenant-keyed control plane without personal, sales, tax or licensing data (tenant status, plan, restore watermark), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context lookups (device_credentials, enrolment_codes, sessions), restrictive tenant policy TO every inventory role except auth_lookup, read only through SECURITY DEFINER functions owned by auth_lookup that return identity for one key."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (usage counts) -> TR-TABLE-CLASSES-R3"
  - id: TR-ROLE-INVENTORY
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL), bootstrap superuser (local only, cluster admin), app_rt, device_rt, job_rt, licensing service roles (named by the licensing ADR), platform_rt (CP only), auth_lookup (NOLOGIN, PL lookups), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment; catalogue C4 fails on any other role."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (second review) -> TR-ROLE-INVENTORY-R2"
  - id: TR-SCOPE-ONCE-PER-TX-R2
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Staff (session lookup), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (live grant + operator session: app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read). Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. Only PL lookup functions run before a scope exists."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 (Job kind) -> TR-SCOPE-ONCE-PER-TX-R3"
  - id: TR-BRANCH-SCOPE-R2
    rule: "Branch-scoped tables carry branch_id with a composite FK to branches and a RESTRICTIVE policy branch_scope on app.branch_ids / app.branch_all written TO app_rt, device_rt, support_rt, support_fn; app.branch_all = 'on' only for a verified owner (never a device or a support grant); staff_roles and staff_branches are tenant-wide; application-layer function permissions through one deny-by-default Authorizer."
    adr: ADR-0003
    adr_status: Accepted
    status: "superseded_by: ADR-0003 revision 2026-10-18 (second review) -> TR-BRANCH-SCOPE-R3"
  - id: TR-ROLE-ASSIGNMENT-GUARD
    rule: "app_rt's INSERT, UPDATE and DELETE policies on staff_roles and staff_branches require current_setting('app.branch_all', true) = 'on' (owner only), as database defence in depth behind the Authorizer (research F421)."
    adr: ADR-0003
    adr_status: Accepted
    status: active
  - id: TR-SUPPORT-GRANT-GATE-R2
    rule: "Kodelix support reads TD data only as support_rt (SELECT only), bound by the restrictive tenant and branch_scope policies, through a permissive policy TO support_rt requiring a live owner grant (approved, revoked_at IS NULL, expires_at > clock_timestamp()); support_grants: app_rt INSERT and UPDATE require app.branch_all = 'on', approved_at within the inserting transaction, CHECK expires_at <= approved_at + interval '7 days', UPDATE on revoked_at only WITH CHECK (revoked_at IS NOT NULL); writes only through support_fn verbs gated by a grant naming the verb; journal written only through audit_writer functions; access record committed before the read; support transactions bounded by transaction_timeout."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 (second review) -> TR-SUPPORT-GRANT-GATE-R3"
  - id: TR-USAGE-COUNTS
    rule: "Kodelix sees per-tenant usage counts without a grant (founder 2026-10-18): bills per business day, sessions, active devices, data size, counts only. job_rt computes them through the ADR-0002 helper, one tenant per transaction in that tenant's scope, and writes only integer counts and dates to a CP table (e.g. tenant_usage_daily) that platform_rt reads. Customer terms must disclose the collection."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: TR-TABLE-CLASSES-R3
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; support grants and journal), no USING (true); CP tenant-keyed control plane without personal data or sales, tax or licensing records (tenant status, plan, restore watermark, usage counts per tenant and business day: derived counts allowed only without money amounts, names, items, bill contents or free text), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context lookups (device_credentials, enrolment_codes, sessions), restrictive tenant policy TO every inventory role except auth_lookup, read only through SECURITY DEFINER functions owned by auth_lookup that return identity for one key."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (second review) -> TR-TABLE-CLASSES-R4"
  - id: TR-SCOPE-ONCE-PER-TX-R3
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction, no cross-tenant query), Staff (session lookup), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (live grant + operator session: app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read). Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. Only PL lookup functions run before a scope exists."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 (second review) -> TR-SCOPE-ONCE-PER-TX-R4"
  - id: TR-TABLE-CLASSES-R4
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; the support access journal), no USING (true); CP tenant-keyed control plane without personal data or sales, tax or licensing records (tenant status, plan, restore watermark, usage counts without money, names, items, bill contents or free text), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context (login_identities, sessions, enrolment_codes, device_credentials, support_grants), restrictive tenant policy TO every inventory role except auth_lookup; access across tenants, reads and writes, only through the ADR-0001 § 1c SECURITY DEFINER functions owned by auth_lookup; in-tenant permissive policies only where an ADR names them."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: TR-ROLE-INVENTORY-R2
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy), deploy_rt (LOGIN, member of migrator with SET, deploy pipeline only), bootstrap superuser (local only, cluster admin), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38 single-purpose cross-tenant roles: future amendment with the licensing ADR)."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (third review) -> TR-ROLE-INVENTORY-R3"
  - id: TR-SCOPE-ONCE-PER-TX-R4
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction), Staff (session lookup; the empty branch list is the ADR-0003 principal read), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (grant loaded before any tenant through SupportGrantLookup.find(grantId, operatorId); sets app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read). Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. The ADR-0001 § 1c PL functions are the only DB access, reads or writes, outside the helper."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 (third review) -> TR-SCOPE-ONCE-PER-TX-R5"
  - id: TR-BRANCH-SCOPE-R3
    rule: "Branch-scoped tables carry branch_id with a composite FK to branches and a RESTRICTIVE policy branch_scope on app.branch_ids / app.branch_all written TO app_rt, device_rt, support_rt, support_fn; app.branch_all = 'on' only for a verified owner (never a device or a support grant); staff_roles and staff_branches are tenant-wide; exports a person starts run as app_rt under that person's Staff scope, never as job_rt (ASVS 8.3.3); application-layer function permissions through one deny-by-default Authorizer."
    adr: ADR-0003
    adr_status: Accepted
    status: "superseded_by: ADR-0003 revision 2026-10-18 (fourth review) -> TR-BRANCH-SCOPE-R4"
  - id: TR-SUPPORT-GRANT-GATE-R3
    rule: "Kodelix support reads TD data only as support_rt (SELECT only), bound by the restrictive tenant and branch_scope policies, through a permissive policy TO support_rt requiring a live owner grant with scope 'read' (approved, revoked_at IS NULL, expires_at > clock_timestamp()) and the session's app.branch_ids contained in the grant's branch_ids; support_grants is PL: loaded before any tenant only through SupportGrantLookup, owner INSERT/UPDATE in-tenant require app.branch_all = 'on', approved_at within the inserting transaction, CHECK expires_at <= approved_at + interval '7 days', UPDATE on revoked_at only WITH CHECK (revoked_at IS NOT NULL); writes only through support_fn verbs gated by a grant naming the verb (same branch check); journal appended only through audit_writer functions, which read their own tenant's chain head under a per-tenant transaction-level advisory lock; access record committed before the read; support transactions bounded by transaction_timeout."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 (third review) -> TR-SUPPORT-GRANT-GATE-R4"
  - id: TR-ROLE-INVENTORY-R3
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; run by the founder with the credential from Bitwarden; each marked privileged; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR)."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (fourth review) -> TR-ROLE-INVENTORY-R4"
  - id: TR-SCOPE-ONCE-PER-TX-R5
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction), Staff (session lookup; the empty branch list is the ADR-0003 principal read), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (grant loaded before any tenant through SupportGrantLookup.find(grantId, operatorId); sets app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read; outcome appended as the last statement of the scoped transaction). Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. The ADR-0001 § 1c functions are the only access to TD and PL rows outside the helper; also outside it and never on TD or PL rows: platform_rt on CP tables, DDL by deploy_rt and privileged migrations by the bootstrap superuser, physical backup by backup_rt."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 (fourth review) -> TR-SCOPE-ONCE-PER-TX-R6"
  - id: TR-SUPPORT-GRANT-GATE-R4
    rule: "Kodelix support reads TD data only as support_rt (SELECT only), bound by the restrictive tenant and branch_scope policies, through a permissive policy TO support_rt requiring a live owner grant with scope 'read' (approved, revoked_at IS NULL, expires_at > clock_timestamp()) and the session's app.branch_ids contained in the grant's branch_ids; support_grants is PL: loaded before any tenant only through SupportGrantLookup; in-tenant SELECT policies for app_rt as owner (app.branch_all = 'on'; lists and finds grants to revoke), support_rt and support_fn (operator_id = app.operator_id); owner INSERT/UPDATE require app.branch_all = 'on', approved_at within the inserting transaction, CHECK expires_at <= approved_at + interval '7 days', UPDATE on revoked_at only WITH CHECK (revoked_at IS NOT NULL); writes only through support_fn verbs gated by a grant naming the verb (same branch check); journal appended only through audit_writer functions, which read their own tenant's chain head under a per-tenant transaction-level advisory lock; access record committed before the read; outcome appended as the last statement; support transactions bounded by transaction_timeout."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: TR-BRANCH-SCOPE-R4
    rule: "Branch-scoped tables carry branch_id with a composite FK to branches and a RESTRICTIVE policy branch_scope on app.branch_ids / app.branch_all written TO app_rt, device_rt, support_rt, support_fn; app.branch_all = 'on' only for a verified owner (never a device or a support grant); staff_roles and staff_branches are tenant-wide; exports a person starts run as app_rt under that person's Staff scope, never as job_rt (ASVS 8.3.3); a background export re-checks the requester's status (Logins.statusOf) and re-reads role and branches when it starts, and is refused if the user is disabled or lost the permission or branch; a plain logout does not cancel it; application-layer function permissions through one deny-by-default Authorizer."
    adr: ADR-0003
    adr_status: Accepted
    status: active
  - id: TR-ROLE-INVENTORY-R4
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; run by the founder with the credential from Bitwarden; each marked privileged; the deploy pipeline stops for the founder to run them on the database host; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR; none runs until it adds their scope kind), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR)."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 amendment 2026-10-18 (third ADR-0005 round) -> TR-ROLE-INVENTORY-R5"
  - id: TR-SCOPE-ONCE-PER-TX-R6
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction), Staff (session lookup; the empty branch list is the ADR-0003 principal read), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (grant loaded before any tenant through SupportGrantLookup.find(grantId, operatorId); sets app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read; outcome appended as the last statement of the scoped transaction). No licensing scope kind yet: the licensing ADR adds it by amending ADR-0002, with M27/M38; until then no licensing service role runs. Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. The ADR-0001 § 1c functions are the only access to TD and PL rows outside the helper; also outside it and never on TD or PL rows: platform_rt on CP tables, DDL by deploy_rt and privileged migrations by the bootstrap superuser, physical backup by backup_rt."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 J1 addendum 2026-10-19 -> TR-SCOPE-ONCE-PER-TX-R7"
  - id: TR-SUSPENSION-CONTRACT
    rule: "For a suspended (unpaid) tenant (ADR-0001 Decision 4, founder 2026-10-18): already-sold device uploads are always accepted with a tenant_suspended notice; leases are not renewed, so devices stop new sales at lease end and the backlog is still accepted; no enrolment (createCode, redeem refuse); dashboard owner only, for export and payment (endAllForTenant at suspension; Sessions.create refuses non-owners; LoginLookup returns tenant status); existing support grants revoked, none approved; no purge before a closure state; usage counts continue; tenant status read per request from CP tenant_status with no cache; reinstatement restores access and suspension deletes nothing."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 amendment 2026-10-18 (ADR-0005 review) -> TR-SUSPENSION-CONTRACT-R2"
  - id: TR-CLOSURE-STATES
    rule: "Tenant closure is the staged state machine active -> suspended -> closure_requested -> export_window -> purge_personal -> archive_retained(retain_until) -> purged; owner only with step-up, cooling-off and every owner contact notified; purge_personal only after the export is downloaded or the window ends, never for a suspended tenant; each step idempotent, run as job_rt via the Job kind, and recorded with date and time."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 revision 2026-10-18 -> TR-CLOSURE-STATES-R2"
  - id: TR-TAX-ARCHIVE
    rule: "Sales, receipts, ETA payloads and cancelled originals are kept in append-only archive tables (class TD) with a per-tenant retain_until of five years after the tax period; after purge_personal staff appear only as an opaque id with no mapping to a name; readable only for the owner's export and a legal hold; purged with a dated record when retain_until passes."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 revision 2026-10-18 -> TR-TAX-ARCHIVE-R2"
  - id: TR-DELETION-REPLAY
    rule: "Backups expire inside a window shorter than 60 days; every tenant deletion, person erasure and device revocation writes a tombstone to a deletion journal outside the restorable database (home set by the storage ADR, D5-C); the restore runbook replays every tombstone before the restored database serves traffic. Retention values stay open in ADR-0005 and are set in the feature spec."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 revision 2026-10-18 -> TR-DELETION-REPLAY-R2"

  - id: TR-SUSPENSION-CONTRACT-R2
    rule: "For a suspended (unpaid) tenant (ADR-0001 Decision 4, founder 2026-10-18; amended 2026-10-18): already-sold device uploads are always accepted with a tenant_suspended notice; leases are not renewed, so devices stop new sales at lease end and the backlog is still accepted; no enrolment (createCode, redeem refuse); dashboard owner only, for export, payment and a closure request (endAllForTenant at suspension; Sessions.create refuses non-owners; LoginLookup returns tenant status); existing support grants revoked by SupportGrants.revokeAllForTenant (platform_rt), none approved; no closure purge (purge_personal, archive) before a closure state, while routine retention (expired export files, ended sessions, logs) continues; usage counts continue; after 90 days of suspension (ADR-0005 retention table) Kodelix may start closure, with notices to the owner contacts at suspension and at days 30, 60 and 80; tenant status read per request from CP tenant_status with no cache; reinstatement restores access and suspension deletes nothing."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 amendment 2026-10-18 (second ADR-0005 review) -> TR-SUSPENSION-CONTRACT-R3"
  - id: TR-CLOSURE-STATES-R2
    rule: "Tenant closure is the staged state machine active -> [suspended, optional] -> closure_requested -> export_window -> purge_personal -> archive_retained(retain_until) -> purged. Started by the owner with step-up (every owner contact notified) or by Kodelix (platform_rt) after the Kodelix-closure threshold of suspension (default 90 days) with notices at suspension and days 30, 60, 80; the owner can cancel with step-up before purge_personal starts (back to active, or suspended if it was). Leases stop renewing at closure_requested; cooling-off (default 14 days) must exceed the device lease (CI-checked). purge_personal waits until every device's lease has ended and its backlog has drained (at most until the export window ends; a lost device does not hold it longer) and until the export is downloaded or the window ends; never while suspended. purge_personal runs as job_rt via the Job kind, one tenant per transaction: deletes staff and customer personal data not needed for tax through job_rt DELETE policies, de-identifies staff in the archive, runs the ADR-0001 § 1c Closure functions (sessions, logins including the owner's, enrolment codes, devices, grants) and prunes the support journal per retention. purged removes the archive and archive_contact, every remaining PL row (Closure.purgeRemaining), the support journal (final anchor off-host) and usage counts per retention; the CP tenant_status row stays as purged, IDs only. Every transition idempotent, resumable and recorded with date and time."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> TR-CLOSURE-STATES-R3"
  - id: TR-TAX-ARCHIVE-R2
    rule: "Sales, receipts, ETA payloads and cancelled originals are written to append-only archive tables (class TD) from the first sale, with a per-tenant retain_until of five years after the tax period; runtime roles have no UPDATE or DELETE on them, and the only delete path is a job_rt DELETE policy requiring retain_until < clock_timestamp() and no legal hold. After purge_personal staff appear only as an opaque id with no mapping to a name; de-identification covers staff only: tax-required buyer identifiers stay inside the byte-exact signed ETA payloads (threat model R-6). A sale arriving after purge_personal is accepted into the archive with staff identifiers replaced on arrival. After purge_personal the owner has no login; archive access is a Kodelix-run EXP-2 export on the owner's verified request, using one owner contact kept in archive_contact (TD), deleted at purged. Erasing one staff member de-identifies their sales, never deletes them."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> TR-TAX-ARCHIVE-R3"
  - id: TR-DELETION-REPLAY-R2
    rule: "Backups expire inside the backup window (default 30 days, below the 60-day device retention); a scheduled check compares the oldest backup's age with the window and alerts. Every tenant deletion, person erasure, device revocation and legal-hold change writes a tombstone to a deletion journal outside the restorable database (home set by the storage ADR, D5-C), kept 5 years by default (longer than the backup window, CI-checked); the restore runbook replays every tombstone before the restored database serves traffic and destroys the side instance."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> TR-DELETION-REPLAY-R3"
  - id: TR-LEGAL-HOLD
    rule: "Legal hold is a Kodelix operator flag with a reason on CP tenant_status, set and released only by platform_rt; each set and release is recorded in the deletion journal; while set, the archive purge (archive_retained -> purged) does not run and job_rt's archive DELETE policy refuses."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> TR-LEGAL-HOLD-R2"
  - id: TR-SUPPORT-JOURNAL-PRUNE
    rule: "The support grant and access journal is never updated; its only DELETE path is SupportJournal.pruneBefore(cutoff), a SECURITY DEFINER function owned by audit_writer (privileged migration), EXECUTE by job_rt only, inside the tenant context: under the per-tenant advisory lock it deletes oldest-first only rows older than the retention cutoff (default 2 years) and in the same transaction writes a chain anchor (hash of the last pruned row, count, cutoff) that becomes the chain's new start and is shipped to the off-host log; verification starts from the newest anchor; at purged the whole journal is pruned once its retention ends, leaving a final anchor off-host."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 amendment 2026-10-18 (second ADR-0005 review) -> TR-SUPPORT-JOURNAL-PRUNE-R2"
  - id: TR-RETENTION-DEFAULTS
    rule: "One retention table, every period configuration with a typed default; founder defaults 2026-10-18, which the feature spec may refine: closure cooling-off 14 days (must exceed the device lease); export window 30 days; generated export files 7 days, then deleted; backup window 30 days (below the 60-day device retention); ended sessions 90 days; support access journal 2 years; technical logs 30 days, with no personal data; security events 1 year; usage counts 3 years; deletion journal 5 years; Kodelix-started closure after 90 days of suspension. Fixed by other rules: tax archive 5 years after the tax period; device keeps 60 days; staff access requests answered within 6 working days. Routine retention runs while a tenant is suspended; each purge job logs every run; no period is a literal in code."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> TR-RETENTION-DEFAULTS-R2"
  - id: TR-SUSPENSION-CONTRACT-R3
    rule: "For a suspended (unpaid) tenant (ADR-0001 Decision 4, founder 2026-10-18): already-sold device uploads are always accepted with a tenant_suspended notice; leases are not renewed, so devices stop new sales at lease end and the backlog is still accepted; no enrolment (createCode, redeem refuse); dashboard owner only, for export and payment; existing support grants revoked, none approved; no purge before a closure state; usage counts continue; tenant status read per request from CP tenant_status with no cache; reinstatement restores access and suspension deletes nothing. Amendment 2026-10-18, effective only when ADR-0005 is Accepted: the dashboard also allows a closure request; grants are revoked by SupportGrants.revokeAllForTenant (platform_rt); only closure purges wait, routine retention (expired export files, ended sessions, logs) continues; after 90 days of suspension Kodelix may start closure (platform_rt finds the tenant on CP; notices at suspension and days 30, 60, 80 sent by a job_rt job in that tenant's scope); a tenant that enters closure from suspended keeps this contract through closure_requested and export_window, and cancel returns it to suspended (closure_origin)."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: TR-CLOSURE-STATES-R3
    rule: "Tenant closure is the staged state machine active -> [suspended, optional] -> closure_requested -> export_window -> purge_personal -> archive_retained(retain_until) -> purged. Started by the owner with step-up (every owner contact notified) or by Kodelix after the Kodelix-closure threshold of suspension (default 90 days): platform_rt moves the tenant on CP, a job_rt job in the tenant's scope sends the notices at suspension and days 30, 60, 80. closure_origin (active | suspended) is recorded on CP tenant_status: from either origin no enrolment and no lease renewal; origin active keeps normal access until purge_personal; origin suspended keeps the suspension contract; the owner can cancel with step-up before purge_personal starts, returning to closure_origin. Cooling-off (default 15 days) must exceed the longest lease of any plan (14 days today), CI-checked against the plan catalogue. purge_personal waits until every device's lease has ended and its backlog has drained (at most until the export window ends) and until the export is downloaded or the window ends; never while suspended. purge_personal runs as job_rt via the Job kind, one tenant per transaction: deletes the TD tables marked personal (every TD table carries a personal | tax | other marker, CI-checked), de-identifies staff by deleting the id-to-name mapping, runs the ADR-0001 § 1c Closure functions and prunes the support journal per retention. purged removes the archive and archive_contact, every remaining PL row, the support journal (final anchor off-host) and usage counts per retention; the CP tenant_status row stays as purged, IDs only. Every transition idempotent, resumable and recorded with date and time in the deletion journal."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 third round 2026-10-18 -> TR-CLOSURE-STATES-R4"
  - id: TR-TAX-ARCHIVE-R3
    rule: "Sales, receipts, ETA payloads and cancelled originals are written to append-only archive tables (class TD) from the first sale, carrying only an opaque staff id; runtime roles have no UPDATE or DELETE on archive rows, and the only delete path is a job_rt DELETE policy requiring retain_until < clock_timestamp() and no legal hold, run only from archive_retained, so an active tenant's archive is never purged. retain_until (end of the last tax period with a sale + five years) is written only by a job_rt function, recomputed on a late sale, and only moves later (a trigger refuses any decrease; a tax-period change never lowers it). De-identification covers staff and deletes the id-to-name link, never updating an archive row; tax-required buyer identifiers stay inside the byte-exact signed ETA payloads (threat model R-6). A late sale is inserted with the opaque id and any name field dropped. After purge_personal the owner has no login; archive access is a Kodelix-run EXP-2 export after a one-time code sent to archive_contact (TD, read by job_rt) is returned (code hash on CP archive_requests, written by platform_rt; verification recorded in the deletion journal); the file goes only to the archive contact. Erasing one staff member keeps their sales with the opaque id."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 third round 2026-10-18 -> TR-TAX-ARCHIVE-R4"
  - id: TR-DELETION-REPLAY-R3
    rule: "Backups expire inside the backup window (default 30 days, below the 60-day device retention); a scheduled check alerts when the oldest backup is older than the window. The deletion journal is a separate store from the support journal: outside the restorable database (home set by the storage ADR, D5-C), kept 5 years (longer than the backup window, CI-checked); it holds tombstones (tenant, person, device), closure transitions and cancels, legal-hold set and release, archive purges, export deliveries and archive-request verifications. Security events (1 year) hold refused step-ups, refused closure or erasure attempts, export rate-cap hits and failed sign-ins with the identifier masked. The restore runbook replays every tombstone before the restored database serves traffic and destroys the side instance."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 third round 2026-10-18 -> TR-DELETION-REPLAY-R4"
  - id: TR-LEGAL-HOLD-R2
    rule: "Legal hold is a Kodelix operator flag on CP tenant_status with a reason that is an enum or a ticket id, never free text; set and released only by platform_rt; each set and release is recorded in the deletion journal; while set, the archive purge does not run and job_rt's archive DELETE policy refuses. Legal hold is not an access path."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-SUPPORT-JOURNAL-PRUNE-R2
    rule: "The support grant and access journal is a TD table inside the database, a separate store from the deletion journal (founder 2026-10-18; departs from research § 4.2 item 3 because retention, location and deletion rules differ). It is never updated; its only DELETE path is SupportJournal.pruneBefore(cutoff), a SECURITY DEFINER function owned by audit_writer (privileged migration), EXECUTE by job_rt only, inside the tenant context: under the per-tenant advisory lock it refuses a cutoff later than clock_timestamp() minus the support-journal period read from the class-G retention table (default 2 years), deletes oldest-first only rows older than the cutoff, and in the same transaction writes a chain anchor (hash of the last pruned row, count, cutoff) that becomes the chain's new start and is shipped to the off-host log; it never touches a tombstone. At purged the whole journal is pruned once its retention ends, leaving a final anchor off-host. A restore can roll the journal back to the backup point; the off-host log records the gap. Effective only when ADR-0005 is Accepted."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 amendment 2026-10-18 (third ADR-0005 round) -> TR-SUPPORT-JOURNAL-PRUNE-R3"
  - id: TR-RETENTION-DEFAULTS-R2
    rule: "One retention table, class G (runtime roles read only), every period configuration with a typed default, changed only through a reviewed migration run as deploy_rt; a change takes effect at the next purge without a code change. Founder defaults 2026-10-18, which the feature spec may refine: closure cooling-off 15 days (must exceed the longest lease of any plan, 14 days today); export window 30 days; generated export files 7 days, then deleted; backup window 30 days (below the 60-day device retention); ended sessions 90 days; support access journal 2 years; technical logs 30 days, with no personal data; security events 1 year; usage counts 3 years; deletion journal 5 years (must exceed the backup window); Kodelix-started closure after 90 days of suspension. Fixed by other rules: tax archive 5 years after the tax period; device keeps 60 days; staff access requests answered within 6 working days. CI checks both invariants. Routine retention runs while a tenant is suspended; each purge job logs every run; no period is a literal in code."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 third round 2026-10-18 -> TR-RETENTION-DEFAULTS-R3"
  - id: TR-ROLE-INVENTORY-R5
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy; one stated exception, effective when ADR-0005 is Accepted: writes data in class G tables (retention table, plan catalogue, tax rates; never tenant data) only inside a reviewed migration that deploy_rt runs through SET ROLE migrator), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; run by the founder with the credential from Bitwarden; each marked privileged; the deploy pipeline stops for the founder to run them on the database host; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR; none runs until it adds their scope kind), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR)."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: TR-RETENTION-DEFAULTS-R3
    rule: "One retention table, class G (runtime roles read only), every period configuration with a typed default, changed only through a reviewed migration that deploy_rt runs through SET ROLE migrator (ADR-0001 § 1b exception); a change takes effect at the next purge without a code change. Founder defaults 2026-10-18, which the feature spec may refine: closure cooling-off 15 days (must exceed the lease cap compiled into the app, 14 days; the licensing ADR keeps emergency unlock within it); export window 30 days; generated export files 7 days, then deleted; backup window 30 days (below the 60-day device retention); ended sessions 90 days; support access journal 2 years (compiled prune floor 365 days); technical logs 30 days, with no personal data; security events 1 year; usage counts 3 years; deletion journal 5 years (must exceed the backup window); Kodelix-started closure after 90 days of suspension. Fixed by other rules: tax archive 5 years after the tax period; device keeps 60 days; staff access requests answered within 6 working days. CI checks both invariants. Routine retention runs while a tenant is suspended; each purge job logs every run; no period is a literal in code."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-SUPPORT-JOURNAL-PRUNE-R3
    rule: "The support grant and access journal is a TD table inside the database, a separate store from the deletion journal (founder 2026-10-18; departs from research § 4.2 item 3 because retention, location and deletion rules differ). It is never updated; its only DELETE path is SupportJournal.pruneBefore(cutoff), a SECURITY DEFINER function owned by audit_writer (privileged migration), EXECUTE by job_rt only, inside the tenant context: under the per-tenant advisory lock it refuses a cutoff later than clock_timestamp() minus the support-journal period read from the class-G retention table (default 2 years), refuses when that period is shorter than a floor compiled into the function body (365 days, founder 2026-10-18), deletes oldest-first only rows older than the cutoff, and in the same transaction writes a chain anchor (hash of the last pruned row, count, cutoff) that becomes the chain's new start and is shipped to the off-host log; it never touches a tombstone. At purged the whole journal is pruned once its retention ends, leaving a final anchor off-host. A restore can roll the journal back to the backup point; the off-host log records the gap. Effective only when ADR-0005 is Accepted."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: TR-TAX-ARCHIVE-R4
    rule: "Sales, receipts, ETA payloads and cancelled originals are written to append-only archive tables (class TD) from the first sale, carrying only an opaque staff id; runtime roles have no UPDATE or DELETE on archive rows, and the only delete path is a job_rt DELETE policy requiring retain_until < clock_timestamp() and no legal hold, run only from archive_retained, so an active tenant's archive is never purged. retain_until (end of the last tax period with a sale + five years) is held in one row per tenant in the TD table archive_retention, never on archive rows; it is written only by a job_rt function, recomputed on a late sale, and only moves later (a trigger on archive_retention refuses any decrease; a tax-period change never lowers it). De-identification covers staff and deletes the id-to-name link, never updating an archive row; tax-required buyer identifiers stay inside the byte-exact signed ETA payloads (threat model R-6). A late sale is inserted with the opaque id and any name field dropped. After purge_personal the owner has no login; archive access is a Kodelix-run EXP-2 export after a one-time code is returned: platform_rt opens the CP archive_requests row (IDs and status only); a job_rt job in the tenant's scope generates the code (CSPRNG), sends it to archive_contact (TD) and writes only its hash to that row, so no operator role sees the code; the verification is recorded in the deletion journal; the file goes only to the archive contact. This path is not ADR-0004 support access. Erasing one staff member keeps their sales with the opaque id."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-CLOSURE-STATES-R4
    rule: "Tenant closure is the staged state machine active -> [suspended, optional] -> closure_requested -> export_window -> purge_personal -> archive_retained(retain_until) -> purged. Started by the owner with step-up (every owner contact notified) or by Kodelix after the Kodelix-closure threshold of suspension (default 90 days): platform_rt moves the tenant on CP, a job_rt job in the tenant's scope sends the notices at suspension and days 30, 60, 80. closure_origin (active | suspended) is recorded on CP tenant_status: from either origin no enrolment and no lease renewal; origin active keeps normal access until purge_personal, including owner-approved support grants (founder 2026-10-18), all revoked there; origin suspended keeps the suspension contract; the owner can cancel with step-up before purge_personal starts, returning to closure_origin. Cooling-off (default 15 days) must exceed the lease cap compiled into the app (14 days), CI-checked against that constant; the licensing ADR keeps any emergency unlock within this rule. purge_personal waits until every device's lease has ended and its backlog has drained (at most until the export window ends) and until the export is downloaded or the window ends; never while suspended. purge_personal runs as job_rt via the Job kind, one tenant per transaction: deletes the TD tables marked personal (every TD table carries a personal | tax | other marker, CI-checked), de-identifies staff by deleting the id-to-name mapping, runs the ADR-0001 § 1c Closure functions and prunes the support journal per retention. purged removes the archive and archive_contact, every remaining PL row, the support journal (final anchor off-host) and usage counts per retention; the CP tenant_status row stays as purged, IDs only. Every transition idempotent, resumable and recorded with date and time in the deletion journal."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-DELETION-REPLAY-R4
    rule: "Backups expire inside the backup window (default 30 days, below the 60-day device retention); a scheduled check alerts when the oldest backup is older than the window. The deletion journal is a separate store from the support journal: outside the restorable database (home set by the storage ADR, D5-C), kept 5 years (longer than the backup window, CI-checked); it holds tombstones (tenant, person, device), closure transitions and cancels, legal-hold set and release, archive purges, export deliveries and archive-request verifications. Security events (1 year) hold refused step-ups, refused closure or erasure attempts, export rate-cap hits and failed sign-ins with the identifier masked. The restore runbook replays every tombstone before the restored database serves traffic and destroys the side instance. Control journal (one definition): the append-only store outside the restorable database (D5-C) holding the control facts a device cannot resend (enrolment, approval, revocation, rotation, owner review decisions, the licence issuance log) and the deletion-journal records; the support journal and the security event log are not part of it."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-DEVICE-ERASURE
    rule: "An erased person's personal fields on a cashier device: the erase person sync command is applied at the device's next contact and confirmed; a revoked or retired device, or one whose tenant reached purge_personal, deletes staff personal fields at its next contact; no device deletes them at lease end (staff must still sign in to close open sessions); a lost device that never syncs keeps them encrypted at rest in the device store (residual R-7, accepted by Kamel Mohamed, founder, 2026-10-18). The sync ADR adds both commands to the sync protocol."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-SCOPE-ONCE-PER-TX-R7
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction), Staff (session lookup; the empty branch list is the ADR-0003 principal read), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (grant loaded before any tenant through SupportGrantLookup.find(grantId, operatorId); sets app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read; outcome appended as the last statement of the scoped transaction). No licensing scope kind yet: the licensing ADR adds it by amending ADR-0002, with M27/M38; until then no licensing service role runs. Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. The ADR-0001 § 1c functions are the only access to TD and PL rows outside the helper; also outside it and never on TD or PL rows: platform_rt on CP tables, DDL by deploy_rt and privileged migrations by the bootstrap superuser, physical backup by backup_rt. Ktor track (ADR-0002 J1 addendum 2026-10-19, effective when ADR-0006 is Accepted): one stated exception, the EXP-2 export carrier inside the helper module - a plain-JDBC transaction with auto-commit off whose first statement is the same set-once scope routine; it refuses a null app.tenant_id read-back and a second scope, exposes only copyOut, and is removed when S23 passes. Jobs stay inside Exposed transactions."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0006 re-check revision 2026-10-19 -> TR-SCOPE-ONCE-PER-TX-R8"
  - id: TR-SCOPE-ONCE-PER-TX-R8
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction), Staff (session lookup; the empty branch list is the ADR-0003 principal read), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (grant loaded before any tenant through SupportGrantLookup.find(grantId, operatorId); sets app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read; outcome appended as the last statement of the scoped transaction). No licensing scope kind yet: the licensing ADR adds it by amending ADR-0002, with M27/M38; until then no licensing service role runs. Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. The ADR-0001 § 1c functions are the only access to TD and PL rows outside the helper; also outside it and never on TD or PL rows: platform_rt on CP tables, DDL by deploy_rt and privileged migrations by the bootstrap superuser, physical backup by backup_rt. Ktor track (ADR-0002 J1 addendum 2026-10-19, revised after the re-check; effective when ADR-0006 is Accepted): one stated exception, the EXP-2 export carrier inside the helper module - Job and Staff scopes only (Support and Device refused); one REPEATABLE READ transaction with auto-commit off for the whole export, whose first statement is the same set-once scope routine; it refuses a null app.tenant_id read-back and a second scope, runs every table's copyOut in that transaction (one snapshot), exposes only an export session with copyOut, and is removed when S23 passes. Apart from the EXP-2 COPY statements, jobs and the outbox claim and sweep stay inside Exposed transactions. The relaxed reading of J1 applies to this carrier only."
    adr: ADR-0002
    adr_status: Accepted
    status: active
interface_contracts:
  - id: IC-TENANT-CONNECTION-RESOLVER
    contract: "TenantConnectionResolver.resolve(TenantId) -> TenantDataSource; the only way app code reaches tenant data; today returns the shared pool."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 amendment 2026-10-18 (suspension contract) -> IC-TENANT-CONNECTION-RESOLVER-R2"
  - id: IC-SCOPE-HELPER
    contract: "WithScope (Go) / withScope (Ktor) -> ScopedTx / ScopedTransaction, the only handle tenant repositories accept; errors ScopeAlreadySet, InvalidScope."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 -> IC-SCOPE-HELPER-R2"
  - id: IC-SESSION-AUTHORIZER
    contract: "SessionResolver.resolve(OpaqueToken) -> Principal {user, tenant, role, branches}, read from the database per request; Authorizer.require(principal, permission, target branch?) -> Allowed | Denied."
    adr: ADR-0003
    adr_status: Accepted
    status: "superseded_by: ADR-0003 revision 2026-10-18 -> IC-SESSION-AUTHORIZER-R2"
  - id: IC-SUPPORT-GRANT
    contract: "SupportGrant {id, tenant_id, branch_ids (explicit), scope read | verb:<name>, operator_id, reason, requested_at, approved_by, approved_at, expires_at (default 24 h, max 7 d, from config), revoked_at?}; owner inserts and updates revoked_at only. ADR-0002 Scope gains kind Support {grantId, operatorId}; helper errors NoLiveGrant, ScopeAlreadySet, InvalidScope."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 -> IC-SUPPORT-GRANT-R2"
  - id: IC-PRE-CONTEXT-LOOKUPS
    contract: "DeviceCredentialLookup.find(keyId), SessionLookup.find(tokenHash), EnrolmentCodeLookup.find(codeHash) -> identity {tenant, branch/user/device, status} | NotFound; SECURITY DEFINER functions owned by auth_lookup, pinned search_path, no PUBLIC EXECUTE; the only DB reads before a scope exists."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (second review) -> IC-PRE-CONTEXT-LOOKUPS-R2"
  - id: IC-SCOPE-HELPER-R2
    contract: "WithScope (Go) / withScope (Ktor)(src, Scope = Staff | Device | Support, fn) -> ScopedTx / ScopedTransaction, the only handle tenant repositories accept; errors ScopeAlreadySet, InvalidScope, NoLiveGrant (Support, before any tenant query)."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 (Job kind) -> IC-SCOPE-HELPER-R3"
  - id: IC-SESSION-AUTHORIZER-R2
    contract: "SessionResolver.resolve(OpaqueToken) -> Principal {user, tenant, role, branches}: SessionLookup.find(tokenHash) (PL) then a tenant-scoped read of staff_roles and staff_branches, per request; Authorizer.require(principal, permission, target branch?) -> Allowed | Denied."
    adr: ADR-0003
    adr_status: Accepted
    status: "superseded_by: ADR-0003 revision 2026-10-18 (second review) -> IC-SESSION-AUTHORIZER-R3"
  - id: IC-SUPPORT-GRANT-R2
    contract: "SupportGrant (TD table support_grants) {id, tenant_id, branch_ids (explicit), scope read | verb:<name>, operator_id, reason, requested_at, approved_by, approved_at (within the inserting transaction), expires_at (default 24 h from config; CHECK <= approved_at + 7 days), revoked_at? (one-way)}; owner-only insert and revoke enforced by policy. Scope kind Support {grantId, operatorId} specified in ADR-0002."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 (second review) -> IC-SUPPORT-GRANT-R3"
  - id: IC-SCOPE-HELPER-R3
    contract: "WithScope (Go) / withScope (Ktor)(src, Scope = Job | Staff | Device | Support, fn) -> ScopedTx / ScopedTransaction, the only handle tenant repositories accept; errors ScopeAlreadySet, InvalidScope, NoLiveGrant (Support, before any tenant query)."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 J1 addendum 2026-10-19 -> IC-SCOPE-HELPER-R4"
  - id: IC-PRE-CONTEXT-LOOKUPS-R2
    contract: "ADR-0001 § 1c, SECURITY DEFINER functions owned by auth_lookup, pinned search_path, EXECUTE only for the named roles: LoginLookup.find(identifier), Logins.create/disable (owner, app_rt), Logins.changeOwnVerifier(tokenHash, verifier) (app_rt, after the app re-verifies the current password); SessionLookup.find, Sessions.create, Sessions.end (app_rt), Sessions.endAllForUser (owner, app_rt), Sessions.endAllForTenant (platform_rt); Enrolment.createCode (owner, app_rt), Enrolment.redeem (device_rt); DeviceCredentialLookup.find, Devices.rotateCredential (device_rt), Devices.revokeCredential (owner app_rt, licensing service roles); SupportGrantLookup.find(grantId, operatorId), listByOperator(operatorId) (support_rt). Account recovery is added by the staff-auth ADR."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (third review) -> IC-PRE-CONTEXT-LOOKUPS-R3"
  - id: IC-SESSION-AUTHORIZER-R3
    contract: "SessionResolver.resolve(OpaqueToken) -> Principal {user, tenant, role, branches}: SessionLookup.find(tokenHash) (PL), then a principal read in a Staff scope with an empty branch list (staff_roles, staff_branches), per request; sessions are created and ended only through ADR-0001 § 1c functions; Authorizer.require(principal, permission, target branch?) -> Allowed | Denied."
    adr: ADR-0003
    adr_status: Accepted
    status: active
  - id: IC-SUPPORT-GRANT-R3
    contract: "SupportGrant (PL table support_grants) {id, tenant_id, branch_ids (explicit), scope read | verb:<name>, operator_id, reason, requested_at, approved_by, approved_at (within the inserting transaction), expires_at (default 24 h from config; CHECK <= approved_at + 7 days), revoked_at? (one-way)}; owner-only insert and revoke enforced by policy; SupportGrantLookup.find(grantId, operatorId) and listByOperator(operatorId) before any tenant. Scope kind Support {grantId, operatorId} specified in ADR-0002."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 (third review) -> IC-SUPPORT-GRANT-R4"
  - id: IC-PRE-CONTEXT-LOOKUPS-R3
    contract: "ADR-0001 § 1c, SECURITY DEFINER functions owned by auth_lookup, pinned search_path, EXECUTE only for the named roles: LoginLookup.find(identifier), Logins.create/disable (owner, app_rt), Logins.changeOwnVerifier(tokenHash, verifier) (app_rt, after the app re-verifies the current password); SessionLookup.find, Sessions.create, Sessions.end (app_rt), Sessions.endAllForUser (owner, app_rt), Sessions.endAllForTenant (platform_rt); EnrolmentCodeLookup.find(codeHash) (device_rt, no consumption), Enrolment.createCode (owner, app_rt), Enrolment.redeem (device_rt); DeviceCredentialLookup.find, Devices.rotateCredential (device_rt), Devices.revokeCredential (owner, app_rt), Devices.revokeCredentialForLicensing (licensing service roles, tenant match only); SupportGrantLookup.find(grantId, operatorId), listByOperator(operatorId) (support_rt). Account recovery is added by the staff-auth ADR."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (fourth review) -> IC-PRE-CONTEXT-LOOKUPS-R4"
  - id: IC-SUPPORT-GRANT-R4
    contract: "SupportGrant (PL table support_grants) {id, tenant_id, branch_ids (explicit), scope read | verb:<name>, operator_id, reason, requested_at, approved_by, approved_at (within the inserting transaction), expires_at (default 24 h from config; CHECK <= approved_at + 7 days), revoked_at? (one-way)}; the owner lists (SELECT with app.branch_all = 'on'), inserts and revokes, enforced by policy; support_rt and support_fn read their operator's grants in-tenant; SupportGrantLookup.find(grantId, operatorId) and listByOperator(operatorId) before any tenant. Scope kind Support {grantId, operatorId} specified in ADR-0002."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: IC-PRE-CONTEXT-LOOKUPS-R4
    contract: "ADR-0001 § 1c, SECURITY DEFINER functions owned by auth_lookup, pinned search_path, EXECUTE only for the named roles: LoginLookup.find(identifier), Logins.create/disable (owner, app_rt), Logins.statusOf(user) (inside, tenant match, app_rt), Logins.changeOwnVerifier(tokenHash, verifier) (app_rt, after the app re-verifies the current password); SessionLookup.find, Sessions.create, Sessions.end (app_rt), Sessions.endAllForUser (owner, app_rt), Sessions.endAllForTenant (platform_rt); EnrolmentCodeLookup.find(codeHash) -> {tenant, branch, branchLabel, seat, state} (device_rt, no consumption), Enrolment.createCode (owner, app_rt; stores the branch display label on the code row), Enrolment.redeem (device_rt); DeviceCredentialLookup.find, Devices.rotateCredential (device_rt), Devices.revokeCredential (owner, app_rt), Devices.revokeCredentialForLicensing (licensing service roles, tenant match only); SupportGrantLookup.find(grantId, operatorId), listByOperator(operatorId) (support_rt). auth_lookup never reads TD tables. Account recovery is added by the staff-auth ADR."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 amendment 2026-10-18 (ADR-0005 review) -> IC-PRE-CONTEXT-LOOKUPS-R5"
  - id: IC-TENANT-CONNECTION-RESOLVER-R2
    contract: "TenantConnectionResolver.resolve(TenantId) -> {TenantDataSource, tenantStatus}; the only way app code reaches tenant data; today returns the shared pool; an unknown tenant -> typed error, no fallback pool; a suspended tenant resolves with its status (read per request from CP tenant_status, no cache) and each surface applies the suspension contract (ADR-0001 Decision 4)."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: IC-TENANT-EXPORT
    contract: "EXP-2: per-table COPY ... TO STDOUT as CSV with header, run as the non-bypass role with the tenant context set; ETA payloads byte-for-byte; manifest {file, rows, sha256, exportedAt, schemaVersion} and a data dictionary, zipped; credentials, verifiers, token hashes and device keys excluded; tenant-wide export owner-started as job_rt, person-started export in that person's Staff scope; delivery re-checks status and permission and writes a dated delivery record."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 revision 2026-10-18 -> IC-TENANT-EXPORT-R2"

  - id: IC-PRE-CONTEXT-LOOKUPS-R5
    contract: "ADR-0001 § 1c, SECURITY DEFINER functions owned by auth_lookup, pinned search_path, EXECUTE only for the named roles: LoginLookup.find(identifier), Logins.create/disable (owner, app_rt), Logins.statusOf(user) (inside, tenant match, app_rt), Logins.changeOwnVerifier(tokenHash, verifier) (app_rt, after the app re-verifies the current password); SessionLookup.find, Sessions.create, Sessions.end (app_rt), Sessions.endAllForUser (owner, app_rt), Sessions.endAllForTenant (platform_rt); EnrolmentCodeLookup.find(codeHash) -> {tenant, branch, branchLabel, seat, state} (device_rt, no consumption), Enrolment.createCode (owner, app_rt; stores the branch display label on the code row), Enrolment.redeem (device_rt); DeviceCredentialLookup.find, Devices.rotateCredential (device_rt), Devices.revokeCredential (owner, app_rt), Devices.revokeCredentialForLicensing (licensing service roles, tenant match only); SupportGrantLookup.find(grantId, operatorId), listByOperator(operatorId) (support_rt); SupportGrants.revokeAllForTenant(tenant) (before, platform_rt, suspension step). Inside, job (EXECUTE by job_rt only, app.tenant_id must equal the row's tenant, context tenant only; amendment 2026-10-18 for ADR-0005): Closure.endSessions(), Closure.purgeLogins() (owner's login included), Closure.purgeEnrolmentCodes(), Closure.revokeDevices(), Closure.revokeGrants(), Closure.purgeRemaining() (at purged), Erasure.erasePersonLogin(user). auth_lookup never reads TD tables. Account recovery is added by the staff-auth ADR."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 amendment 2026-10-18 (second ADR-0005 review) -> IC-PRE-CONTEXT-LOOKUPS-R6"
  - id: IC-TENANT-EXPORT-R2
    contract: "EXP-2: per-table COPY ... TO STDOUT as CSV with header, run as the non-bypass role with the tenant context set; ETA payloads byte-for-byte; manifest {file, rows, sha256, exportedAt, schemaVersion} and a data dictionary, zipped; credentials, verifiers, token hashes and device keys excluded; tenant-wide export owner-started as job_rt; archive export after purge_personal Kodelix-started on the owner's verified request as job_rt; person-started and my-data exports in that person's Staff scope. Delivered to the requester only (owner for tenant-wide and archive, the person for person-started and my-data); random file key; file deleted after the export-files period (default 7 days); status and permission re-checked at publish and at download; per-tenant rate cap; dated delivery record. S52 runs before the export story."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> IC-TENANT-EXPORT-R3"
  - id: IC-PRE-CONTEXT-LOOKUPS-R6
    contract: "ADR-0001 § 1c, SECURITY DEFINER functions owned by auth_lookup, pinned search_path, EXECUTE only for the named roles: LoginLookup.find(identifier), Logins.create/disable (owner, app_rt), Logins.statusOf(user) (inside, tenant match, app_rt), Logins.changeOwnVerifier(tokenHash, verifier) (app_rt, after the app re-verifies the current password); SessionLookup.find, Sessions.create, Sessions.end (app_rt), Sessions.endAllForUser (owner, app_rt), Sessions.endAllForTenant (platform_rt); EnrolmentCodeLookup.find(codeHash) -> {tenant, branch, branchLabel, seat, state} (device_rt, no consumption), Enrolment.createCode (owner, app_rt; stores the branch display label on the code row), Enrolment.redeem (device_rt); DeviceCredentialLookup.find, Devices.rotateCredential (device_rt), Devices.revokeCredential (owner, app_rt), Devices.revokeCredentialForLicensing (licensing service roles, tenant match only); SupportGrantLookup.find(grantId, operatorId), listByOperator(operatorId) (support_rt). Amendment 2026-10-18, effective only when ADR-0005 is Accepted: SupportGrants.revokeAllForTenant(tenant) (before, platform_rt, suspension step); inside, job (EXECUTE by job_rt only, app.tenant_id must equal the row's tenant, context tenant only): Closure.endSessions(), Closure.purgeLogins() (owner's login included), Closure.purgeEnrolmentCodes(), Closure.revokeDevices(), Closure.revokeGrants(), Closure.purgeRemaining() (at purged), Erasure.erasePersonLogin(user). auth_lookup never reads TD tables. Account recovery is added by the staff-auth ADR."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: IC-TENANT-EXPORT-R3
    contract: "EXP-2: per-table COPY ... TO STDOUT as CSV with header, run as the non-bypass role with the tenant context set; ETA payloads byte-for-byte; manifest {file, rows, sha256, exportedAt, schemaVersion} and a data dictionary, zipped; credentials, verifiers, token hashes and device keys excluded. Tenant-wide export owner-started as job_rt; archive export after purge_personal as job_rt only after ArchiveRequest.verify (one-time code sent to archive_contact and returned); person-started and my-data exports in that person's Staff scope. Delivered to the requester only: the owner for tenant-wide, the archive contact for archive exports (single-use link bound to the code), the person for person-started and my-data; random file key; file deleted after the export-files period (default 7 days); status and permission re-checked at publish and at download where a login exists; per-tenant rate cap; dated delivery record in the deletion journal. S52 runs before the export story."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: IC-SCOPE-HELPER-R4
    contract: "WithScope (Go) / withScope (Ktor)(src, Scope = Job | Staff | Device | Support, fn) -> ScopedTx / ScopedTransaction, the only handle tenant repositories accept; errors ScopeAlreadySet, InvalidScope, NoLiveGrant (Support, before any tenant query). Ktor track (ADR-0002 J1 addendum 2026-10-19): the helper module also offers copyOut(src, Scope, sql, OutputStream): Long for the EXP-2 export only - same Scope and set-once routine, no Connection, CopyManager or statement exposed, connection evicted on any exception."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0006 re-check revision 2026-10-19 -> IC-SCOPE-HELPER-R5"
  - id: IC-JDBC-COPY-CARRIER-R2
    contract: "EXP-2 export only (ADR-0002 J1 addendum 2026-10-19, approved with ADR-0006): a small plain-JDBC carrier inside the ADR-0002 scope-helper module, until S23 shows a supported route from Exposed suspendTransaction to the JDBC Connection. Same Scope; same set-once routine from the same constants module as the first statement; auto-commit off before it; reads back current_setting('app.tenant_id', true) and refuses if null; refuses a second scope; exposes only copyOut(src, Scope, sql, OutputStream): Long, never a Connection, CopyManager or statement; on any exception the connection is evicted from the pool (close() on the pool proxy does not count). Removed when S23 passes. Jobs do not use it."
    adr: ADR-0006
    adr_status: Proposed
    status: "superseded_by: ADR-0006 re-check revision 2026-10-19 -> IC-JDBC-COPY-CARRIER-R3"
  - id: IC-OUTBOX-SWEEP-R2
    contract: "Jobs direction (details in the jobs/outbox ADR): own transactional outbox in TD under the tenant policy; platform_rt lists tenant ids from CP tenant_status; one job_rt transaction per tenant through withScope on Exposed suspendTransaction (raw SQL via Exposed exec) claims work with FOR UPDATE SKIP LOCKED; the dedup row is written in the effect's transaction; traceparent stored on work rows; a CP pending-work list before tenant counts grow."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: IC-BILLING-VECTORS
    contract: "Device and server billing: integer money in piasters and integer milliseconds, no floating point (F401); billing rules as data where possible; one shared vector suite in contracts/ or tools/ that the server CI runs (and the device CI), with a drift test (S47)."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: IC-SCOPE-HELPER-R5
    contract: "WithScope (Go) / withScope (Ktor)(src, Scope = Job | Staff | Device | Support, fn) -> ScopedTx / ScopedTransaction, the only handle tenant repositories accept; errors ScopeAlreadySet, InvalidScope, NoLiveGrant (Support, before any tenant query). Ktor track (ADR-0002 J1 addendum 2026-10-19, revised after the re-check; effective when ADR-0006 is Accepted): the helper module also offers exportSession(src, Scope = Job | Staff, block: ExportSession.() -> T) with ExportSession.copyOut(sql, OutputStream): Long, for the EXP-2 export only - one REPEATABLE READ transaction per session, scope set once and first, Support and Device refused, no Connection, CopyManager or statement exposed, connection evicted on any exception."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: IC-JDBC-COPY-CARRIER-R3
    contract: "EXP-2 export only (ADR-0002 J1 addendum 2026-10-19, revised after the re-check, approved with ADR-0006): a small plain-JDBC carrier inside the ADR-0002 scope-helper module, until S23 shows a supported route from Exposed suspendTransaction to the JDBC Connection. Job and Staff scopes only (ADR-0005 Decision 4); Support and Device refused. One REPEATABLE READ transaction, auto-commit off, for the whole export; first statement the same set-once routine from the same constants module; reads back current_setting('app.tenant_id', true) and refuses if null; refuses a second scope; every table's copyOut runs in that transaction, so all tables come from one snapshot and the manifest row counts agree. Exposes only exportSession { copyOut(sql, OutputStream): Long }, never a Connection, CopyManager or statement; on any exception the connection is evicted from the pool (close() on the pool proxy does not count). Removed when S23 passes. Apart from the EXP-2 COPY statements, jobs and the outbox claim and sweep stay inside Exposed transactions."
    adr: ADR-0006
    adr_status: Proposed
    status: active
performance_budgets: []

api_decisions: []

forbidden_patterns:
  - id: FP-BYPASSRLS-RUNTIME-ROLE
    pattern: "BYPASSRLS or superuser on any runtime, job or support role; runtime roles owning tables."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-MATVIEW-TENANT-DATA
    pattern: "A materialized view over tenant or branch data readable by a runtime role."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-VIEW-WITHOUT-SECURITY-INVOKER
    pattern: "A view over tenant tables created without security_invoker = true."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-SESSION-LEVEL-SCOPE
    pattern: "set_config(..., false) or plain SET for a scope setting; setting scope outside the helper or twice in one transaction."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: FP-THREADLOCAL-TENANT
    pattern: "Carrying the tenant in a bare ThreadLocal or MDC value; nested tenant transactions (Exposed)."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: FP-SCOPE-FROM-REQUEST
    pattern: "Taking tenant, branch or device ids from a request body, query string or header as scope."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: FP-SCOPE-CLAIMS-IN-TOKEN
    pattern: "Tenant, role or branch claims inside the dashboard session token."
    adr: ADR-0003
    adr_status: Accepted
    status: active
  - id: FP-USING-TRUE-TENANT-TABLE
    pattern: "A USING (true) policy on a table that holds tenant data (allowed only on allow-listed control-plane tables, each listed by a catalogue test)."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 -> FP-USING-TRUE-TENANT-TABLE-R2"
  - id: FP-OPERATOR-ID-FROM-REQUEST
    pattern: "Taking the operator id from a request rather than the authenticated operator session (per-operator database identity required before a second operator)."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-AUDIT-IN-READ-TX-ONLY
    pattern: "A support access record written only inside the reading transaction (lost on client rollback); it must be committed before the read."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-OWNER-IMPERSONATION
    pattern: "The operator signing in as the owner, using the owner's credential, or minting an owner session ('log in as')."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-TENANT-READ-WITHOUT-GRANT
    pattern: "Kodelix reading tenant data without a live owner grant, including break-glass, a superuser read or a per-grant database login."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 -> FP-TENANT-READ-WITHOUT-GRANT-R2"
  - id: FP-CACHED-GRANT-STATE
    pattern: "Caching support-grant state (a cached grant outlives the owner's revoke)."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-PERMISSIVE-POLICY-WITHOUT-ROLE
    pattern: "A permissive policy without a TO role list on a TD, CP or PL table, or a tenant predicate carried only in a permissive policy."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-UNLISTED-DB-ROLE
    pattern: "A database role, or a role membership in pg_read_all_data, pg_write_all_data or the server-file roles, that is not in ADR-0001's role inventory."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-USING-TRUE-TENANT-TABLE-R2
    pattern: "USING (true) or WITH CHECK (true) on any TD table; on CP tables for any role other than platform_rt; on PL tables for any role other than auth_lookup."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-TENANT-READ-WITHOUT-GRANT-R2
    pattern: "A Kodelix person reading tenant data without a live owner grant, including break-glass, a superuser read or a per-grant database login. Service roles acting under their own ADR (licensing service roles, job_rt) are not operator reads."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-USAGE-STATS-BEYOND-COUNTS
    pattern: "Money amounts, names, items, bill contents or free text in the grant-free usage statistics; usage statistics computed across tenants in one query or outside the ADR-0002 helper; money totals without an owner grant or a contract clause."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-PL-ACCESS-OUTSIDE-FUNCTIONS
    pattern: "Reading or writing a PL table across tenants other than through an ADR-0001 § 1c function; any role other than auth_lookup with an all-rows policy on a PL table."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-PERSON-EXPORT-AS-JOB
    pattern: "An export a person started, run as job_rt or under any scope wider than that person's Staff scope."
    adr: ADR-0003
    adr_status: Accepted
    status: active
  - id: FP-DATA-MIGRATION-AS-OWNER
    pattern: "A data migration (backfill) run as migrator or the bootstrap superuser instead of job_rt per tenant through the ADR-0002 helper."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-PRIVILEGED-MIGRATION-UNMARKED
    pattern: "A migration that creates or alters a role, or creates, replaces or re-owns a function owned by auth_lookup, support_fn or audit_writer, that is not marked privileged or is run as deploy_rt."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-HARD-DELETE-TAX-ARCHIVE
    pattern: "Hard-deleting the tax archive (or any sales, receipt or ETA record) before its retain_until, outside a legal-hold release; exporting the owner's data with pg_dump (EXP-1)."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: FP-PURGE-WITHOUT-RECORD
    pattern: "A purge, erasure or export delivery that writes no dated record; a restore that serves traffic before the deletion journal is replayed; automatically wiping a device's local records on closure."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: FP-PRUNE-TOMBSTONE
    pattern: "Deleting a tombstone or any deletion-journal record through a support-journal path (SupportJournal.pruneBefore or any other) or before its own retention; storing the deletion journal inside the restorable database."
    adr: ADR-0005
    adr_status: Accepted
    status: active

  - id: FP-POOLED-CONN-AFTER-COPY-ERROR-R2
    pattern: "Returning a pooled JDBC connection to HikariCP after any exception from a streaming COPY (copyOut); calling close() on the pool's proxy counts as returning it. The connection must be evicted so the physical connection is discarded and never reused (S22b confirms the HikariCP 7.1.0 eviction API)."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-UNLOCKED-GRADLE-BUILD-R2
    pattern: "A Gradle build without committed dependency locks (project and buildscript) and strict verification metadata, with version ranges, or with a dependency, lockfile or verification-metadata change auto-merged by the AI-agent CI without the founder's review."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-JVM-DEFAULT-HEAP-R2
    pattern: "Running the backend JVM container with the default heap sizing: no explicit -Xmx or MaxRAMPercentage, or no Compose memory limit (both sized from S18)."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-QUEUE-WITHOUT-ADR-R2
    pattern: "Adopting a job-queue library (for example db-scheduler) or an external broker before an ADR fixes the ADR-0001 table class of its tables; work rows outside the tenant policy."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-SECOND-OTEL-SDK-R2
    pattern: "A second OpenTelemetry SDK or an SDK version in application code beside the Java agent; claiming no PII in telemetry before the Collector capture test shows that SQL parameter values, URL query strings and request headers do not reach it."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-RAW-JDBC-OUTSIDE-HELPER
    pattern: "Opening a raw JDBC transaction or using a raw java.sql.Connection, CopyManager or statement for tenant data outside the ADR-0002 scope-helper module (the only JDBC path is the helper's export carrier)."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-NEW-SUSPENDED-TRANSACTION
    pattern: "Using Exposed's deprecated newSuspendedTransaction, or a nested tenant transaction, instead of suspendTransaction through withScope (ktor/best-practices.md line 55)."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-ARGON2-JVM
    pattern: "Importing argon2-jvm (LGPL-3.0, F409) for password hashing; use Bouncy Castle or Password4j."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-SIGNING-ORACLE
    pattern: "An endpoint or use case that signs caller-chosen bytes with the licence key or the ETA e-seal key; signing is a purpose-tagged use case only (lic- F222)."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-OTEL-LIBRARY-INSTRUMENTATION-WITH-AGENT
    pattern: "Installing KtorServerTelemetry or another OpenTelemetry library-instrumentation plugin beside the Java agent (it needs its own SDK instance and doubles the spans; ktor/best-practices.md lines 42-43)."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-JDBC-ON-DEFAULT-DISPATCHER
    pattern: "Running blocking JDBC work (Exposed transactions, pgjdbc, copyOut) on Dispatchers.Default or an unbounded dispatcher; use a named two-argument limitedParallelism dispatcher no wider than its pool."
    adr: ADR-0006
    adr_status: Proposed
    status: active
  - id: FP-JOOQ-UNCONFIRMED
    pattern: "Using jOOQ for PostgreSQL before its licence for the open-source edition is confirmed (ti-F241; ADR-0002 J2)."
    adr: ADR-0006
    adr_status: Proposed
    status: active
# 2026-10-19: technology_choices section added for ADR-0006 (backend track, Proposed); append-only like the other sections.
# 2026-10-19 (ADR-0006 review): only TECH-* entries belong here; the IC-* and FP-* entries first placed here are superseded by copies in interface_contracts and forbidden_patterns.
technology_choices:
  - id: TECH-BACKEND-KTOR
    choice: "Backend track Ktor on Kotlin/JVM (stack.backend: ktor, core.track: kotlin, saas-core-kotlin; founder 2026-10-19): Kotlin 2.4.21, kotlinx.coroutines 1.11.0, Ktor 3.6.0 exact, Exposed 1.5.1 with ADR-0002 J1 suspendTransaction, HikariCP 7.1.0, OpenTelemetry Java agent 2.32.0, Bouncy Castle 1.86 for Ed25519 and ETA CAdES-BES (C1). Still to pin: pgjdbc (42.7.14 seen 2026-10-18), an SLF4J 2 binding, Bouncy Castle; JDK 21 or 25 and its distribution open (Q8); Gradle wrapper 9.7.0 (\"9.7\" does not resolve) or 9.8.x per Q7. Mandatory in CI: dependency locking incl. buildscript, strict verification metadata, OSV-Scanner on every PR, base images by digest; no backend image before an image scanner and SBOM generator are pinned (Q6). Explicit heap and Compose memory limit from S18 before the first deploy. Billing: rules as data and one shared vector suite in every combination, one Kotlin module only if the desktop ADR picks Compose Desktop (S46). Switch-to-Go conditions recorded in ADR-0006 Decision 12; Compose Desktop x Go rejected."
    adr: ADR-0006
    adr_status: Proposed
    status: "superseded_by: ADR-0006 review revision 2026-10-19 -> TECH-BACKEND-KTOR-R2"
  - id: IC-JDBC-COPY-CARRIER
    contract: "Until S23 shows a supported route from Exposed suspendTransaction to the JDBC Connection, the EXP-2 COPY export and the job loop use a small plain-JDBC carrier that lives inside the ADR-0002 scope-helper module, takes the same Scope, runs the same set-once scope routine and constants, passes the same helper tests and adds no scope kind or setting; on any exception from a streaming copyOut the connection is closed or evicted, never returned to the pool. S23 and S22b pass before the export story; if principal-engineer reads the carrier as a second helper, ADR-0002 is amended first."
    adr: ADR-0006
    adr_status: Proposed
    status: "superseded_by: ADR-0006 review 2026-10-19 (moved to its section) -> IC-JDBC-COPY-CARRIER-R2"
  - id: IC-OUTBOX-SWEEP
    contract: "Jobs direction (details in the jobs/outbox ADR): own transactional outbox in TD under the tenant policy; platform_rt lists tenant ids from CP tenant_status; one job_rt helper transaction per tenant claims work with FOR UPDATE SKIP LOCKED; the dedup row is written in the effect's transaction; traceparent stored on work rows; a CP pending-work list before tenant counts grow."
    adr: ADR-0006
    adr_status: Proposed
    status: "superseded_by: ADR-0006 review 2026-10-19 (moved to its section) -> IC-OUTBOX-SWEEP-R2"
  - id: FP-POOLED-CONN-AFTER-COPY-ERROR
    pattern: "Returning a pooled JDBC connection to HikariCP after any exception from a streaming COPY (copyOut); the connection must be closed or evicted."
    adr: ADR-0006
    adr_status: Proposed
    status: "superseded_by: ADR-0006 review 2026-10-19 (moved to its section) -> FP-POOLED-CONN-AFTER-COPY-ERROR-R2"
  - id: FP-UNLOCKED-GRADLE-BUILD
    pattern: "A Gradle build without committed dependency locks (project and buildscript) and strict verification metadata, with version ranges, or with a dependency, lockfile or verification-metadata change auto-merged by the AI-agent CI without the founder's review."
    adr: ADR-0006
    adr_status: Proposed
    status: "superseded_by: ADR-0006 review 2026-10-19 (moved to its section) -> FP-UNLOCKED-GRADLE-BUILD-R2"
  - id: FP-JVM-DEFAULT-HEAP
    pattern: "Running the backend JVM container with the default heap sizing: no explicit -Xmx or MaxRAMPercentage, or no Compose memory limit (both sized from S18)."
    adr: ADR-0006
    adr_status: Proposed
    status: "superseded_by: ADR-0006 review 2026-10-19 (moved to its section) -> FP-JVM-DEFAULT-HEAP-R2"
  - id: FP-QUEUE-WITHOUT-ADR
    pattern: "Adopting a job-queue library (for example db-scheduler) or an external broker before an ADR fixes the ADR-0001 table class of its tables; work rows outside the tenant policy."
    adr: ADR-0006
    adr_status: Proposed
    status: "superseded_by: ADR-0006 review 2026-10-19 (moved to its section) -> FP-QUEUE-WITHOUT-ADR-R2"
  - id: FP-SECOND-OTEL-SDK
    pattern: "A second OpenTelemetry SDK or an SDK version in application code beside the Java agent; claiming no PII in telemetry before the Collector capture test shows that SQL parameter values, URL query strings and request headers do not reach it."
    adr: ADR-0006
    adr_status: Proposed
    status: "superseded_by: ADR-0006 review 2026-10-19 (moved to its section) -> FP-SECOND-OTEL-SDK-R2"
  - id: TECH-BACKEND-KTOR-R2
    choice: "Backend track Ktor on Kotlin/JVM (stack.backend: ktor, core.track: kotlin, saas-core-kotlin; founder 2026-10-19): Kotlin 2.4.21, kotlinx.coroutines 1.11.0, Ktor 3.6.0 exact, Exposed 1.5.1 with ADR-0002 J1 suspendTransaction (plus the J1 export-carrier addendum), HikariCP 7.1.0, OpenTelemetry Java agent 2.32.0. Ed25519 with the JDK built-in provider or Bouncy Castle 1.86; the licensing ADR picks one and runs the edge-vector suite. ETA CAdES-BES with Bouncy Castle bcpkix 1.86 (C1) if signing stays on the backend; acceptance pending the ETA ADR. Still to pin: pgjdbc (42.7.14 seen 2026-10-18, with a stack-reference row recording getCopyAPI/copyOut), an SLF4J 2 binding, Bouncy Castle; JDK 21 or 25 and its distribution open (Q8); Gradle wrapper 9.7.0 (\"9.7\" does not resolve) or 9.8.x per Q7. Mandatory in CI: dependency locking incl. buildscript, strict verification metadata, OSV-Scanner on every PR, base images by digest; no backend image before an image scanner and SBOM generator are pinned (Q6). Explicit heap and Compose memory limit from S18 before the first deploy. Blocking JDBC on bounded Dispatchers.IO.limitedParallelism(n, name) dispatchers; one HikariCP pool per LOGIN role, sizes from S18. Billing: rules as data and one shared vector suite in every combination, one Kotlin module only if the desktop ADR picks Compose Desktop (S46). Switch-to-Go conditions recorded in ADR-0006 Decision 12; Compose Desktop x Go rejected."
    adr: ADR-0006
    adr_status: Proposed
    status: active
