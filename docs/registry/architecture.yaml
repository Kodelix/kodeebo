  - id: IC-PASSWORD-HASHER
    contract: "PasswordHasher.hash(secret) -> PhcString + pepperKeyId; verify(secret, PhcString, pepperKeyId) -> Ok | Bad | Ok(needsRehash). Argon2id (Bouncy Castle 1.86 or Password4j), per-user random 128-bit CSPRNG salt, PHC string, parameters at or above OWASP m=19456 KiB t=2 p=1 from S13, on a bounded dispatcher; pepper = Argon2id secret input from PepperProvider.current()/byId(keyId): kept outside the database, in the encrypted server secret file now, from the first paying customer an AWS KMS envelope (KMS wraps the pepper; decrypted once at start-up, held in memory; KMS never computes the hash). New hashes use the current key id; old key id or parameters -> re-hash at the next successful sign-in (Logins.rehash); an old pepper is kept until no row uses its key id; a compromised pepper forces a password reset for every row on its key id."
    adr: ADR-0007
    adr_status: Proposed
    status: "superseded_by: ADR-0007 review fixes 2026-10-19 -> IC-PASSWORD-HASHER-R2"
  - id: IC-STEP-UP
    contract: "StepUp.issue only after a fresh TOTP code or a user-verified passkey assertion in the same session -> single-use grant bound to (session, action, target), short configured lifetime; the action's use case calls StepUp.consume inside its own transaction; missing, used, expired or mismatched grant -> refused + security event. Actions: closure request/cancel, erase person, support grant approve/revoke, role and assignment changes, second-factor and recovery-contact changes, recovery-code regeneration, tenant export, device enrol/revoke, tenant security settings; console: seat and licence issue/approve/move/suspend/revoke and the licensing ADR's list. A user without a second factor cannot run a step-up action."
    adr: ADR-0007
    adr_status: Proposed
    status: "superseded_by: ADR-0007 review fixes 2026-10-19 -> IC-STEP-UP-R2"
  - id: IC-COUNTER-ENROLMENT
