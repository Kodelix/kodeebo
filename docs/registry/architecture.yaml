# 2026-10-19: ADR-0008 re-check fixes applied: 9 entries superseded (TR-TABLE-CLASSES-R7, TR-ROLE-INVENTORY-R9, TR-OWNER-ROLE-R2, TR-STRICT-SUBSET, IC-PRE-CONTEXT-LOOKUPS-R8, IC-COUNTER-ENROLMENT-R4, IC-PIN-VERIFIER-CUSTODY-R2, IC-PIN-ACTIVATION, FP-PEPPER-IN-DATABASE) and 9 replacements added, all effective only when ADR-0008 is Accepted. IC-PRE-CONTEXT-LOOKUPS-R8 and FP-PEPPER-IN-DATABASE belong to ADR-0007 (Accepted) and return to active if ADR-0008 is rejected.

data_ownership: []

tenancy_rules:
  - id: TR-RLS-SHARED-SCHEMA
    rule: "Every table holding tenant data has tenant_id uuid NOT NULL, ENABLE + FORCE ROW LEVEL SECURITY and a permissive policy tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid per command; unique keys and PKs lead with tenant_id; FKs between tenant tables are composite with tenant_id."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 -> TR-RLS-RESTRICTIVE-TENANT"
  - id: TR-TENANT-UNIT
    rule: "Tenant = owner organisation; branch = venue, keyed (tenant_id, id); device = cashier PC, keyed (tenant_id, branch_id, id). Seats, pricing and device binding: docs/research/licensing.md Part 1 and the licensing ADR."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: TR-SCOPE-ONCE-PER-TX
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets app.tenant_id (and branch list, device, plan timeout) with set_config(..., true) exactly once, first, from a server-side source (session lookup or verified device credential)."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 -> TR-SCOPE-ONCE-PER-TX-R2"
  - id: TR-BRANCH-SCOPE
    rule: "Branch-scoped tables carry branch_id with a composite FK to branches and a RESTRICTIVE policy on app.branch_ids / app.branch_all; app.branch_all = 'on' only for a verified owner role; application-layer function permissions through one deny-by-default Authorizer."
    adr: ADR-0003
    adr_status: Accepted
    status: "superseded_by: ADR-0003 revision 2026-10-18 -> TR-BRANCH-SCOPE-R2"
  - id: TR-SUPPORT-GRANT-GATE
    rule: "Kodelix support reads tenant data only as support_rt (NOSUPERUSER, NOBYPASSRLS, owns nothing, SELECT only on tenant tables) whose policies TO support_rt require the tenant context AND a live owner grant (approved, revoked_at IS NULL, expires_at > clock_timestamp()); the grant carries an explicit branch list and never sets app.branch_all; support writes only through SECURITY DEFINER verbs gated by a grant naming the verb; the helper commits the access record before the read."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 -> TR-SUPPORT-GRANT-GATE-R2"
  - id: TR-RLS-RESTRICTIVE-TENANT
    rule: "Every TD, CP and PL table has tenant_id uuid NOT NULL, ENABLE + FORCE ROW LEVEL SECURITY and a RESTRICTIVE FOR ALL policy tenant_isolation: tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid (USING and WITH CHECK); on TD tables it has no TO clause (binds every role); each role gets its own permissive policy TO that role for the commands it needs. Unique keys and PKs lead with tenant_id; FKs between tenant tables are composite with tenant_id."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: TR-TABLE-CLASSES
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; support grants and journal), no USING (true); CP tenant-keyed control plane without personal, sales, tax or licensing data (tenant status, plan, restore watermark), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context lookups (device_credentials, enrolment_codes, sessions), restrictive tenant policy TO every inventory role except auth_lookup, read only through SECURITY DEFINER functions owned by auth_lookup that return identity for one key."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (usage counts) -> TR-TABLE-CLASSES-R3"
  - id: TR-ROLE-INVENTORY
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL), bootstrap superuser (local only, cluster admin), app_rt, device_rt, job_rt, licensing service roles (named by the licensing ADR), platform_rt (CP only), auth_lookup (NOLOGIN, PL lookups), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment; catalogue C4 fails on any other role."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (second review) -> TR-ROLE-INVENTORY-R2"
  - id: TR-SCOPE-ONCE-PER-TX-R2
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Staff (session lookup), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (live grant + operator session: app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read). Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. Only PL lookup functions run before a scope exists."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 (Job kind) -> TR-SCOPE-ONCE-PER-TX-R3"
  - id: TR-BRANCH-SCOPE-R2
    rule: "Branch-scoped tables carry branch_id with a composite FK to branches and a RESTRICTIVE policy branch_scope on app.branch_ids / app.branch_all written TO app_rt, device_rt, support_rt, support_fn; app.branch_all = 'on' only for a verified owner (never a device or a support grant); staff_roles and staff_branches are tenant-wide; application-layer function permissions through one deny-by-default Authorizer."
    adr: ADR-0003
    adr_status: Accepted
    status: "superseded_by: ADR-0003 revision 2026-10-18 (second review) -> TR-BRANCH-SCOPE-R3"
  - id: TR-ROLE-ASSIGNMENT-GUARD
    rule: "app_rt's INSERT, UPDATE and DELETE policies on staff_roles and staff_branches require current_setting('app.branch_all', true) = 'on' (owner only), as database defence in depth behind the Authorizer (research F421)."
    adr: ADR-0003
    adr_status: Accepted
    status: "superseded_by: ADR-0008 (Proposed 2026-10-19; effective when ADR-0008 is Accepted) -> TR-ROLE-ASSIGNMENT-GUARD-R2"
  - id: TR-SUPPORT-GRANT-GATE-R2
    rule: "Kodelix support reads TD data only as support_rt (SELECT only), bound by the restrictive tenant and branch_scope policies, through a permissive policy TO support_rt requiring a live owner grant (approved, revoked_at IS NULL, expires_at > clock_timestamp()); support_grants: app_rt INSERT and UPDATE require app.branch_all = 'on', approved_at within the inserting transaction, CHECK expires_at <= approved_at + interval '7 days', UPDATE on revoked_at only WITH CHECK (revoked_at IS NOT NULL); writes only through support_fn verbs gated by a grant naming the verb; journal written only through audit_writer functions; access record committed before the read; support transactions bounded by transaction_timeout."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 (second review) -> TR-SUPPORT-GRANT-GATE-R3"
  - id: TR-USAGE-COUNTS
    rule: "Kodelix sees per-tenant usage counts without a grant (founder 2026-10-18): bills per business day, sessions, active devices, data size, counts only. job_rt computes them through the ADR-0002 helper, one tenant per transaction in that tenant's scope, and writes only integer counts and dates to a CP table (e.g. tenant_usage_daily) that platform_rt reads. Customer terms must disclose the collection."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: TR-TABLE-CLASSES-R3
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; support grants and journal), no USING (true); CP tenant-keyed control plane without personal data or sales, tax or licensing records (tenant status, plan, restore watermark, usage counts per tenant and business day: derived counts allowed only without money amounts, names, items, bill contents or free text), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context lookups (device_credentials, enrolment_codes, sessions), restrictive tenant policy TO every inventory role except auth_lookup, read only through SECURITY DEFINER functions owned by auth_lookup that return identity for one key."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (second review) -> TR-TABLE-CLASSES-R4"
  - id: TR-SCOPE-ONCE-PER-TX-R3
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction, no cross-tenant query), Staff (session lookup), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (live grant + operator session: app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read). Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. Only PL lookup functions run before a scope exists."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 (second review) -> TR-SCOPE-ONCE-PER-TX-R4"
  - id: TR-TABLE-CLASSES-R4
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; the support access journal), no USING (true); CP tenant-keyed control plane without personal data or sales, tax or licensing records (tenant status, plan, restore watermark, usage counts without money, names, items, bill contents or free text), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context (login_identities, sessions, enrolment_codes, device_credentials, support_grants), restrictive tenant policy TO every inventory role except auth_lookup; access across tenants, reads and writes, only through the ADR-0001 § 1c SECURITY DEFINER functions owned by auth_lookup; in-tenant permissive policies only where an ADR names them."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0007 (Proposed 2026-10-19; class OP and the new PL tables take effect when Accepted) -> TR-TABLE-CLASSES-R5"
  - id: TR-ROLE-INVENTORY-R2
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy), deploy_rt (LOGIN, member of migrator with SET, deploy pipeline only), bootstrap superuser (local only, cluster admin), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38 single-purpose cross-tenant roles: future amendment with the licensing ADR)."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (third review) -> TR-ROLE-INVENTORY-R3"
  - id: TR-SCOPE-ONCE-PER-TX-R4
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction), Staff (session lookup; the empty branch list is the ADR-0003 principal read), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (grant loaded before any tenant through SupportGrantLookup.find(grantId, operatorId); sets app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read). Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. The ADR-0001 § 1c PL functions are the only DB access, reads or writes, outside the helper."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 (third review) -> TR-SCOPE-ONCE-PER-TX-R5"
  - id: TR-BRANCH-SCOPE-R3
    rule: "Branch-scoped tables carry branch_id with a composite FK to branches and a RESTRICTIVE policy branch_scope on app.branch_ids / app.branch_all written TO app_rt, device_rt, support_rt, support_fn; app.branch_all = 'on' only for a verified owner (never a device or a support grant); staff_roles and staff_branches are tenant-wide; exports a person starts run as app_rt under that person's Staff scope, never as job_rt (ASVS 8.3.3); application-layer function permissions through one deny-by-default Authorizer."
    adr: ADR-0003
    adr_status: Accepted
    status: "superseded_by: ADR-0003 revision 2026-10-18 (fourth review) -> TR-BRANCH-SCOPE-R4"
  - id: TR-SUPPORT-GRANT-GATE-R3
    rule: "Kodelix support reads TD data only as support_rt (SELECT only), bound by the restrictive tenant and branch_scope policies, through a permissive policy TO support_rt requiring a live owner grant with scope 'read' (approved, revoked_at IS NULL, expires_at > clock_timestamp()) and the session's app.branch_ids contained in the grant's branch_ids; support_grants is PL: loaded before any tenant only through SupportGrantLookup, owner INSERT/UPDATE in-tenant require app.branch_all = 'on', approved_at within the inserting transaction, CHECK expires_at <= approved_at + interval '7 days', UPDATE on revoked_at only WITH CHECK (revoked_at IS NOT NULL); writes only through support_fn verbs gated by a grant naming the verb (same branch check); journal appended only through audit_writer functions, which read their own tenant's chain head under a per-tenant transaction-level advisory lock; access record committed before the read; support transactions bounded by transaction_timeout."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 (third review) -> TR-SUPPORT-GRANT-GATE-R4"
  - id: TR-ROLE-INVENTORY-R3
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; run by the founder with the credential from Bitwarden; each marked privileged; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR)."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (fourth review) -> TR-ROLE-INVENTORY-R4"
  - id: TR-SCOPE-ONCE-PER-TX-R5
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction), Staff (session lookup; the empty branch list is the ADR-0003 principal read), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (grant loaded before any tenant through SupportGrantLookup.find(grantId, operatorId); sets app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read; outcome appended as the last statement of the scoped transaction). Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. The ADR-0001 § 1c functions are the only access to TD and PL rows outside the helper; also outside it and never on TD or PL rows: platform_rt on CP tables, DDL by deploy_rt and privileged migrations by the bootstrap superuser, physical backup by backup_rt."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 (fourth review) -> TR-SCOPE-ONCE-PER-TX-R6"
  - id: TR-SUPPORT-GRANT-GATE-R4
    rule: "Kodelix support reads TD data only as support_rt (SELECT only), bound by the restrictive tenant and branch_scope policies, through a permissive policy TO support_rt requiring a live owner grant with scope 'read' (approved, revoked_at IS NULL, expires_at > clock_timestamp()) and the session's app.branch_ids contained in the grant's branch_ids; support_grants is PL: loaded before any tenant only through SupportGrantLookup; in-tenant SELECT policies for app_rt as owner (app.branch_all = 'on'; lists and finds grants to revoke), support_rt and support_fn (operator_id = app.operator_id); owner INSERT/UPDATE require app.branch_all = 'on', approved_at within the inserting transaction, CHECK expires_at <= approved_at + interval '7 days', UPDATE on revoked_at only WITH CHECK (revoked_at IS NOT NULL); writes only through support_fn verbs gated by a grant naming the verb (same branch check); journal appended only through audit_writer functions, which read their own tenant's chain head under a per-tenant transaction-level advisory lock; access record committed before the read; outcome appended as the last statement; support transactions bounded by transaction_timeout."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: TR-BRANCH-SCOPE-R4
    rule: "Branch-scoped tables carry branch_id with a composite FK to branches and a RESTRICTIVE policy branch_scope on app.branch_ids / app.branch_all written TO app_rt, device_rt, support_rt, support_fn; app.branch_all = 'on' only for a verified owner (never a device or a support grant); staff_roles and staff_branches are tenant-wide; exports a person starts run as app_rt under that person's Staff scope, never as job_rt (ASVS 8.3.3); a background export re-checks the requester's status (Logins.statusOf) and re-reads role and branches when it starts, and is refused if the user is disabled or lost the permission or branch; a plain logout does not cancel it; application-layer function permissions through one deny-by-default Authorizer."
    adr: ADR-0003
    adr_status: Accepted
    status: active
  - id: TR-ROLE-INVENTORY-R4
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; run by the founder with the credential from Bitwarden; each marked privileged; the deploy pipeline stops for the founder to run them on the database host; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR; none runs until it adds their scope kind), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR)."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 amendment 2026-10-18 (third ADR-0005 round) -> TR-ROLE-INVENTORY-R5"
  - id: TR-SCOPE-ONCE-PER-TX-R6
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction), Staff (session lookup; the empty branch list is the ADR-0003 principal read), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (grant loaded before any tenant through SupportGrantLookup.find(grantId, operatorId); sets app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read; outcome appended as the last statement of the scoped transaction). No licensing scope kind yet: the licensing ADR adds it by amending ADR-0002, with M27/M38; until then no licensing service role runs. Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. The ADR-0001 § 1c functions are the only access to TD and PL rows outside the helper; also outside it and never on TD or PL rows: platform_rt on CP tables, DDL by deploy_rt and privileged migrations by the bootstrap superuser, physical backup by backup_rt."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 J1 addendum 2026-10-19 -> TR-SCOPE-ONCE-PER-TX-R7"
  - id: TR-SUSPENSION-CONTRACT
    rule: "For a suspended (unpaid) tenant (ADR-0001 Decision 4, founder 2026-10-18): already-sold device uploads are always accepted with a tenant_suspended notice; leases are not renewed, so devices stop new sales at lease end and the backlog is still accepted; no enrolment (createCode, redeem refuse); dashboard owner only, for export and payment (endAllForTenant at suspension; Sessions.create refuses non-owners; LoginLookup returns tenant status); existing support grants revoked, none approved; no purge before a closure state; usage counts continue; tenant status read per request from CP tenant_status with no cache; reinstatement restores access and suspension deletes nothing."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 amendment 2026-10-18 (ADR-0005 review) -> TR-SUSPENSION-CONTRACT-R2"
  - id: TR-CLOSURE-STATES
    rule: "Tenant closure is the staged state machine active -> suspended -> closure_requested -> export_window -> purge_personal -> archive_retained(retain_until) -> purged; owner only with step-up, cooling-off and every owner contact notified; purge_personal only after the export is downloaded or the window ends, never for a suspended tenant; each step idempotent, run as job_rt via the Job kind, and recorded with date and time."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 revision 2026-10-18 -> TR-CLOSURE-STATES-R2"
  - id: TR-TAX-ARCHIVE
    rule: "Sales, receipts, ETA payloads and cancelled originals are kept in append-only archive tables (class TD) with a per-tenant retain_until of five years after the tax period; after purge_personal staff appear only as an opaque id with no mapping to a name; readable only for the owner's export and a legal hold; purged with a dated record when retain_until passes."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 revision 2026-10-18 -> TR-TAX-ARCHIVE-R2"
  - id: TR-DELETION-REPLAY
    rule: "Backups expire inside a window shorter than 60 days; every tenant deletion, person erasure and device revocation writes a tombstone to a deletion journal outside the restorable database (home set by the storage ADR, D5-C); the restore runbook replays every tombstone before the restored database serves traffic. Retention values stay open in ADR-0005 and are set in the feature spec."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 revision 2026-10-18 -> TR-DELETION-REPLAY-R2"

  - id: TR-SUSPENSION-CONTRACT-R2
    rule: "For a suspended (unpaid) tenant (ADR-0001 Decision 4, founder 2026-10-18; amended 2026-10-18): already-sold device uploads are always accepted with a tenant_suspended notice; leases are not renewed, so devices stop new sales at lease end and the backlog is still accepted; no enrolment (createCode, redeem refuse); dashboard owner only, for export, payment and a closure request (endAllForTenant at suspension; Sessions.create refuses non-owners; LoginLookup returns tenant status); existing support grants revoked by SupportGrants.revokeAllForTenant (platform_rt), none approved; no closure purge (purge_personal, archive) before a closure state, while routine retention (expired export files, ended sessions, logs) continues; usage counts continue; after 90 days of suspension (ADR-0005 retention table) Kodelix may start closure, with notices to the owner contacts at suspension and at days 30, 60 and 80; tenant status read per request from CP tenant_status with no cache; reinstatement restores access and suspension deletes nothing."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 amendment 2026-10-18 (second ADR-0005 review) -> TR-SUSPENSION-CONTRACT-R3"
  - id: TR-CLOSURE-STATES-R2
    rule: "Tenant closure is the staged state machine active -> [suspended, optional] -> closure_requested -> export_window -> purge_personal -> archive_retained(retain_until) -> purged. Started by the owner with step-up (every owner contact notified) or by Kodelix (platform_rt) after the Kodelix-closure threshold of suspension (default 90 days) with notices at suspension and days 30, 60, 80; the owner can cancel with step-up before purge_personal starts (back to active, or suspended if it was). Leases stop renewing at closure_requested; cooling-off (default 14 days) must exceed the device lease (CI-checked). purge_personal waits until every device's lease has ended and its backlog has drained (at most until the export window ends; a lost device does not hold it longer) and until the export is downloaded or the window ends; never while suspended. purge_personal runs as job_rt via the Job kind, one tenant per transaction: deletes staff and customer personal data not needed for tax through job_rt DELETE policies, de-identifies staff in the archive, runs the ADR-0001 § 1c Closure functions (sessions, logins including the owner's, enrolment codes, devices, grants) and prunes the support journal per retention. purged removes the archive and archive_contact, every remaining PL row (Closure.purgeRemaining), the support journal (final anchor off-host) and usage counts per retention; the CP tenant_status row stays as purged, IDs only. Every transition idempotent, resumable and recorded with date and time."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> TR-CLOSURE-STATES-R3"
  - id: TR-TAX-ARCHIVE-R2
    rule: "Sales, receipts, ETA payloads and cancelled originals are written to append-only archive tables (class TD) from the first sale, with a per-tenant retain_until of five years after the tax period; runtime roles have no UPDATE or DELETE on them, and the only delete path is a job_rt DELETE policy requiring retain_until < clock_timestamp() and no legal hold. After purge_personal staff appear only as an opaque id with no mapping to a name; de-identification covers staff only: tax-required buyer identifiers stay inside the byte-exact signed ETA payloads (threat model R-6). A sale arriving after purge_personal is accepted into the archive with staff identifiers replaced on arrival. After purge_personal the owner has no login; archive access is a Kodelix-run EXP-2 export on the owner's verified request, using one owner contact kept in archive_contact (TD), deleted at purged. Erasing one staff member de-identifies their sales, never deletes them."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> TR-TAX-ARCHIVE-R3"
  - id: TR-DELETION-REPLAY-R2
    rule: "Backups expire inside the backup window (default 30 days, below the 60-day device retention); a scheduled check compares the oldest backup's age with the window and alerts. Every tenant deletion, person erasure, device revocation and legal-hold change writes a tombstone to a deletion journal outside the restorable database (home set by the storage ADR, D5-C), kept 5 years by default (longer than the backup window, CI-checked); the restore runbook replays every tombstone before the restored database serves traffic and destroys the side instance."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> TR-DELETION-REPLAY-R3"
  - id: TR-LEGAL-HOLD
    rule: "Legal hold is a Kodelix operator flag with a reason on CP tenant_status, set and released only by platform_rt; each set and release is recorded in the deletion journal; while set, the archive purge (archive_retained -> purged) does not run and job_rt's archive DELETE policy refuses."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> TR-LEGAL-HOLD-R2"
  - id: TR-SUPPORT-JOURNAL-PRUNE
    rule: "The support grant and access journal is never updated; its only DELETE path is SupportJournal.pruneBefore(cutoff), a SECURITY DEFINER function owned by audit_writer (privileged migration), EXECUTE by job_rt only, inside the tenant context: under the per-tenant advisory lock it deletes oldest-first only rows older than the retention cutoff (default 2 years) and in the same transaction writes a chain anchor (hash of the last pruned row, count, cutoff) that becomes the chain's new start and is shipped to the off-host log; verification starts from the newest anchor; at purged the whole journal is pruned once its retention ends, leaving a final anchor off-host."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 amendment 2026-10-18 (second ADR-0005 review) -> TR-SUPPORT-JOURNAL-PRUNE-R2"
  - id: TR-RETENTION-DEFAULTS
    rule: "One retention table, every period configuration with a typed default; founder defaults 2026-10-18, which the feature spec may refine: closure cooling-off 14 days (must exceed the device lease); export window 30 days; generated export files 7 days, then deleted; backup window 30 days (below the 60-day device retention); ended sessions 90 days; support access journal 2 years; technical logs 30 days, with no personal data; security events 1 year; usage counts 3 years; deletion journal 5 years; Kodelix-started closure after 90 days of suspension. Fixed by other rules: tax archive 5 years after the tax period; device keeps 60 days; staff access requests answered within 6 working days. Routine retention runs while a tenant is suspended; each purge job logs every run; no period is a literal in code."
    adr: ADR-0005
    adr_status: Accepted
    status: "superseded_by: ADR-0005 second review 2026-10-18 -> TR-RETENTION-DEFAULTS-R2"
  - id: TR-SUSPENSION-CONTRACT-R3
    rule: "For a suspended (unpaid) tenant (ADR-0001 Decision 4, founder 2026-10-18): already-sold device uploads are always accepted with a tenant_suspended notice; leases are not renewed, so devices stop new sales at lease end and the backlog is still accepted; no enrolment (createCode, redeem refuse); dashboard owner only, for export and payment; existing support grants revoked, none approved; no purge before a closure state; usage counts continue; tenant status read per request from CP tenant_status with no cache; reinstatement restores access and suspension deletes nothing. Amendment 2026-10-18, effective only when ADR-0005 is Accepted: the dashboard also allows a closure request; grants are revoked by SupportGrants.revokeAllForTenant (platform_rt); only closure purges wait, routine retention (expired export files, ended sessions, logs) continues; after 90 days of suspension Kodelix may start closure (platform_rt finds the tenant on CP; notices at suspension and days 30, 60, 80 sent by a job_rt job in that tenant's scope); a tenant that enters closure from suspended keeps this contract through closure_requested and export_window, and cancel returns it to suspended (closure_origin)."
