api_decisions: []

forbidden_patterns:
  - id: FP-BYPASSRLS-RUNTIME-ROLE
    pattern: "BYPASSRLS or superuser on any runtime, job or support role; runtime roles owning tables."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-MATVIEW-TENANT-DATA
    pattern: "A materialized view over tenant or branch data readable by a runtime role."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-VIEW-WITHOUT-SECURITY-INVOKER
    pattern: "A view over tenant tables created without security_invoker = true."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-SESSION-LEVEL-SCOPE
    pattern: "set_config(..., false) or plain SET for a scope setting; setting scope outside the helper or twice in one transaction."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: FP-THREADLOCAL-TENANT
    pattern: "Carrying the tenant in a bare ThreadLocal or MDC value; nested tenant transactions (Exposed)."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: FP-SCOPE-FROM-REQUEST
    pattern: "Taking tenant, branch or device ids from a request body, query string or header as scope."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: FP-SCOPE-CLAIMS-IN-TOKEN
    pattern: "Tenant, role or branch claims inside the dashboard session token."
    adr: ADR-0003
    adr_status: Accepted
    status: active
  - id: FP-USING-TRUE-TENANT-TABLE
    pattern: "A USING (true) policy on a table that holds tenant data (allowed only on allow-listed control-plane tables, each listed by a catalogue test)."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 -> FP-USING-TRUE-TENANT-TABLE-R2"
  - id: FP-OPERATOR-ID-FROM-REQUEST
    pattern: "Taking the operator id from a request rather than the authenticated operator session (per-operator database identity required before a second operator)."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-AUDIT-IN-READ-TX-ONLY
    pattern: "A support access record written only inside the reading transaction (lost on client rollback); it must be committed before the read."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-OWNER-IMPERSONATION
    pattern: "The operator signing in as the owner, using the owner's credential, or minting an owner session ('log in as')."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-TENANT-READ-WITHOUT-GRANT
    pattern: "Kodelix reading tenant data without a live owner grant, including break-glass, a superuser read or a per-grant database login."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 -> FP-TENANT-READ-WITHOUT-GRANT-R2"
  - id: FP-CACHED-GRANT-STATE
    pattern: "Caching support-grant state (a cached grant outlives the owner's revoke)."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-PERMISSIVE-POLICY-WITHOUT-ROLE
    pattern: "A permissive policy without a TO role list on a TD, CP or PL table, or a tenant predicate carried only in a permissive policy."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-UNLISTED-DB-ROLE
    pattern: "A database role, or a role membership in pg_read_all_data, pg_write_all_data or the server-file roles, that is not in ADR-0001's role inventory."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-USING-TRUE-TENANT-TABLE-R2
    pattern: "USING (true) or WITH CHECK (true) on any TD table; on CP tables for any role other than platform_rt; on PL tables for any role other than auth_lookup."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-TENANT-READ-WITHOUT-GRANT-R2
    pattern: "A Kodelix person reading tenant data without a live owner grant, including break-glass, a superuser read or a per-grant database login. Service roles acting under their own ADR (licensing service roles, job_rt) are not operator reads."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-USAGE-STATS-BEYOND-COUNTS
    pattern: "Money amounts, names, items, bill contents or free text in the grant-free usage statistics; usage statistics computed across tenants in one query or outside the ADR-0002 helper; money totals without an owner grant or a contract clause."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-PL-ACCESS-OUTSIDE-FUNCTIONS
    pattern: "Reading or writing a PL table across tenants other than through an ADR-0001 § 1c function; any role other than auth_lookup with an all-rows policy on a PL table."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-PERSON-EXPORT-AS-JOB
    pattern: "An export a person started, run as job_rt or under any scope wider than that person's Staff scope."
    adr: ADR-0003
    adr_status: Accepted
    status: active
  - id: FP-DATA-MIGRATION-AS-OWNER
    pattern: "A data migration (backfill) run as migrator or the bootstrap superuser instead of job_rt per tenant through the ADR-0002 helper."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-PRIVILEGED-MIGRATION-UNMARKED
    pattern: "A migration that creates or alters a role, or creates, replaces or re-owns a function owned by auth_lookup, support_fn or audit_writer, that is not marked privileged or is run as deploy_rt."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-HARD-DELETE-TAX-ARCHIVE
    pattern: "Hard-deleting the tax archive (or any sales, receipt or ETA record) before its retain_until, outside a legal-hold release; exporting the owner's data with pg_dump (EXP-1)."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: FP-PURGE-WITHOUT-RECORD
    pattern: "A purge, erasure or export delivery that writes no dated record; a restore that serves traffic before the deletion journal is replayed; automatically wiping a device's local records on closure."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: FP-PRUNE-TOMBSTONE
    pattern: "Deleting a tombstone or any deletion-journal record through a support-journal path (SupportJournal.pruneBefore or any other) or before its own retention; storing the deletion journal inside the restorable database."
    adr: ADR-0005
    adr_status: Accepted
    status: active

  - id: FP-POOLED-CONN-AFTER-COPY-ERROR-R2
    pattern: "Returning a pooled JDBC connection to HikariCP after any exception from a streaming COPY (copyOut); calling close() on the pool's proxy counts as returning it. The connection must be evicted so the physical connection is discarded and never reused (S22b confirms the HikariCP 7.1.0 eviction API)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-UNLOCKED-GRADLE-BUILD-R2
    pattern: "A Gradle build without committed dependency locks (project and buildscript) and strict verification metadata, with version ranges, or with a dependency, lockfile or verification-metadata change auto-merged by the AI-agent CI without the founder's review."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-JVM-DEFAULT-HEAP-R2
    pattern: "Running the backend JVM container with the default heap sizing: no explicit -Xmx or MaxRAMPercentage, or no Compose memory limit (both sized from S18)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-QUEUE-WITHOUT-ADR-R2
    pattern: "Adopting a job-queue library (for example db-scheduler) or an external broker before an ADR fixes the ADR-0001 table class of its tables; work rows outside the tenant policy."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-SECOND-OTEL-SDK-R2
    pattern: "A second OpenTelemetry SDK or an SDK version in application code beside the Java agent; claiming no PII in telemetry before the Collector capture test shows that SQL parameter values, URL query strings and request headers do not reach it."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-RAW-JDBC-OUTSIDE-HELPER
    pattern: "Opening a raw JDBC transaction or using a raw java.sql.Connection, CopyManager or statement for tenant data outside the ADR-0002 scope-helper module (the only JDBC path is the helper's export carrier)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-NEW-SUSPENDED-TRANSACTION
    pattern: "Using Exposed's deprecated newSuspendedTransaction, or a nested tenant transaction, instead of suspendTransaction through withScope (ktor/best-practices.md line 55)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-ARGON2-JVM
    pattern: "Importing argon2-jvm (LGPL-3.0, F409) for password hashing; use Bouncy Castle or Password4j."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-SIGNING-ORACLE
    pattern: "An endpoint or use case that signs caller-chosen bytes with the licence key or the ETA e-seal key; signing is a purpose-tagged use case only (lic- F222)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-OTEL-LIBRARY-INSTRUMENTATION-WITH-AGENT
    pattern: "Installing KtorServerTelemetry or another OpenTelemetry library-instrumentation plugin beside the Java agent (it needs its own SDK instance and doubles the spans; ktor/best-practices.md lines 42-43)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-JDBC-ON-DEFAULT-DISPATCHER
    pattern: "Running blocking JDBC work (Exposed transactions, pgjdbc, copyOut) on Dispatchers.Default or an unbounded dispatcher; use a named two-argument limitedParallelism dispatcher no wider than its pool."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-JOOQ-UNCONFIRMED
    pattern: "Using jOOQ for PostgreSQL before its licence for the open-source edition is confirmed (ti-F241; ADR-0002 J2)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-SMS-OTP
    pattern: "Any sign-in, recovery or step-up code sent by SMS or voice (ASVS 6.6.1 at L3; founder 2026-10-19)."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-RESET-LINK-FROM-HOST
    pattern: "Building a password-reset link or code URL from the request's Host header instead of the configured base URL."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-PIN-VERIFIER-OFF-DEVICE
    pattern: "A counter PIN, its verifier or its lockout state leaving the encrypted device store: in a synced fact, the server database, a log or a backup outside the store."
    adr: ADR-0007
    adr_status: Accepted
    status: "superseded_by: ADR-0008 (Proposed 2026-10-19; effective when ADR-0008 is Accepted) -> FP-PIN-VERIFIER-OFF-DEVICE-R2"
  - id: FP-PEPPER-IN-DATABASE
    pattern: "Storing the password pepper (or the TOTP key-encryption key, or the KMS-unwrapped pepper) in the database, a log, a URL or a client bundle; calling KMS to compute a password hash."
    adr: ADR-0007
    adr_status: Accepted
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> FP-PEPPER-IN-DATABASE-R2"
  - id: FP-SYNCED-PASSKEY-ON-CONSOLE
    pattern: "Accepting a backup-eligible (BE=1, synced) passkey, a passkey without user verification, or a dashboard-RP passkey on the operator console."
    adr: ADR-0007
    adr_status: Proposed
    status: "superseded_by: ADR-0007 review fixes 2026-10-19 -> FP-SYNCED-PASSKEY-ON-CONSOLE-R2"
  - id: FP-TOKEN-IN-WEB-STORAGE
    pattern: "Keeping a session token or any credential in localStorage or sessionStorage, or in a cookie without __Host-, Secure, HttpOnly and SameSite=Strict."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-SPONSOR-CHOOSES-PIN
    pattern: "A manager, owner or Kodelix choosing, typing or seeing another person's lasting PIN or password; resets issue a random single-use temporary secret only (ASVS 6.4.6)."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-SYNCED-PASSKEY-ON-CONSOLE-R2
    pattern: "Accepting a passkey without user verification, or a dashboard-RP passkey, on the operator console; accepting a backup-eligible (BE=1, synced) passkey on the console once the two FIDO2 keys are registered. Interim exception, accepted by name by Kamel Mohamed, founder, 2026-10-19 (ASVS 6.3.3 L3 / NIST AAL3 deviation; review at the first paying customer): one synced passkey in the founder's Bitwarden (2FA on), UV required, with the console recovery codes stored offline apart from it."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-CONSOLE-CREDENTIAL-OUTSIDE-SCRIPT
    pattern: "Changing an operator credential outside the console other than through the audited console lock-out script run as the bootstrap superuser (SSH over Tailscale, local peer login; control-journal entry, off-host log line, security event, runbook); the script never touches tenant credentials."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-PIN-VERIFIER-OFF-DEVICE-R2
    pattern: "effective when ADR-0008 is Accepted (replaces the device-only rule): a counter PIN or its plaintext anywhere outside the device; a PIN verifier stored unencrypted on the server, in a backup, a log, a trace, an authority_snapshots row or a synced fact other than the verifier upload; a verifier delivered to a device outside the person's assigned branches; a verifier upload accepted without a single-use enrolment or reset fact; per-device lockout state sent anywhere but the failure report at contact."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> FP-PIN-VERIFIER-OFF-DEVICE-R3"
  - id: FP-SERVER-PIN-VERIFY
    pattern: "effective when ADR-0008 is Accepted: the server verifying a counter PIN or comparing a presented PIN hash, or caching decrypted verifiers; KMS called per verifier."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> FP-SERVER-PIN-VERIFY-R2"
  - id: FP-OWNER-ONLY-KEY-IN-CUSTOM-ROLE
    pattern: "effective when ADR-0008 is Accepted: storing an owner-only permission key in a custom role, or editing the owner role beyond its label."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: FP-SELF-APPROVAL
    pattern: "effective when ADR-0008 is Accepted: an override approved by the requester; an approval covering more than one action (elevated session)."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: FP-ABSENT-LIMIT-UNLIMITED
    pattern: "effective when ADR-0008 is Accepted: treating an absent limit as unlimited outside the owner role; an approver limit below the do-limit in the same role."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: FP-TRAIL-WRITE-OUTSIDE-FUNCTIONS
    pattern: "effective when ADR-0008 is Accepted: writing, updating or deleting activity_trail rows other than through the audit_writer ActivityTrail functions; typed text, names or contact data in a trail record; rejecting a device money fact because its actor's authority changed (flag it instead)."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: FP-PIN-VERIFIER-OFF-DEVICE-R3
    pattern: "effective when ADR-0008 is Accepted (replaces the device-only rule): a counter PIN or its plaintext anywhere outside the device; a PIN verifier stored unencrypted on the server, in a backup, a log, a trace, an authority_snapshots row or a synced fact other than the verifier upload; a verifier delivered to a device outside the person's assigned branches; a verifier upload accepted without a single-use fact consumed in the database; an unconfirmed (device-minted) verifier delivered beyond its minting device for a person holding a privileged key, or for anyone before confirmation; a verifier in the authority snapshot; per-device lockout state sent anywhere but the failure report at contact."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: FP-SERVER-PIN-VERIFY-R2
    pattern: "effective when ADR-0008 is Accepted: the server verifying a lasting counter PIN or comparing a presented PIN hash, or caching decrypted verifiers; KMS called per verifier. The one stated exception is the dashboard-issued one-time activation code (IC-PIN-ACTIVATION), checked by the server once and never a lasting PIN."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: FP-PEPPER-IN-DATABASE-R2
    pattern: "Storing the password pepper (or the TOTP key-encryption key, or the KMS-unwrapped pepper) in the database, a log, a URL or a client bundle; calling KMS to compute a password hash. Extended by ADR-0008 (effective when ADR-0008 is Accepted): also the PIN-verifier master key or an unwrapped per-tenant data key in the database, a backup, a log, a URL, the repository or a client bundle."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: FP-IP-ONLY-BLOCK
    pattern: "Banning or blocking sign-in, recovery or any account action on a client IP address alone (venues share CGNAT addresses); an address-keyed delay may slow, never alone block, a known identifier; a 'not me' report locks the account's password path, never an address (staff-auth threat model M2, M22)."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-COMPARE-AND-TAP-APPROVAL
    pattern: "Effective when the founder accepts the 2026-10-20 amendment: approving an approve-on-phone enrolment (or any out-of-band request) by comparing a code shown on both screens and tapping Approve, without the code having been typed or scanned on the approving device (NIST SP 800-63B-4 sec. 3.1.3.1)."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-SLOT-DEVICE-FROM-REQUEST
    pattern: "Effective when the founder accepts the 2026-10-20 amendment: taking a pending verifier slot's device (pin_verifiers.minting_device_id or pin_upload_facts.device_id) from a request field instead of app.device_id; letting one device write, replace or clear another device's slot."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: FP-SECRET-IN-ENV
    pattern: "Effective when ADR-0009 is Accepted: a secret (database credential, server key, signing key, founder admin or deploy key) in an environment variable, env file, Compose environment value, image layer, build arg, repository file, log line, CI transcript, a VPS-provider snapshot or backup, or anything the AI agent can read; a secret file not owned by its one consuming container's UID with mode 0400, or two consumers sharing one UID."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: FP-DEPLOY-ENTRY-ARGUMENTS
    pattern: "Effective when ADR-0009 is Accepted: a deploy entry that accepts an argument, reads SSH_ORIGINAL_COMMAND, gives a shell or PTY, runs through a sudo rule with ALL, SETENV or a wildcard, reads a client-sent file in place, extracts an archive as root, runs without the exclusive lock, or returns raw docker/psql/application output; a deploy script, wrapper, Compose file or nginx configuration the pipeline can rewrite."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: FP-NOVALIDATE-DECISION
    pattern: "Effective when ADR-0009 is Accepted: deciding a deploy on ssh-keygen -Y check-novalidate, on a digest without the founder's signature, on fields parsed from an unverified manifest copy, without the replay gate (next release number, previous-manifest hash, not_after), or writing the gate state before the run ends ok."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: FP-AGENT-PRIVILEGED-GROUP
    pattern: "Effective when ADR-0009 is Accepted: the AI agent's OS account on the founder machine, after the account move, in the docker, wheel or sudo group or reaching the Docker socket; containers for Testcontainers and spikes run on a rootless runtime instead; Claude Code policy for the agent account set anywhere the agent can edit instead of the root-owned, readable /etc/claude-code/managed-settings.json. Until the move the rule 'the deploy agent never sees a secret' is procedural on the founder machine (the VPS side holds by construction, FP-AGENT-VPS-ACCESS)."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: FP-SCANNER-UNCONFINED
    pattern: "Effective when ADR-0009 is Accepted: running an image or dependency scanner (Trivy, OSV-Scanner) on the VPS, on the founder machine's host outside the locked-down scanner container, with network in the Trivy scan step, with the home directory, SSH keys, Bitwarden, Tailscale or the Docker socket mounted, installed by curl | sh, a Docker Hub tag or a GitHub Action, or with --db-repository pointing at a mirror we do not operate."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: FP-FLYWAY-ROLE-BY-CALLBACK
    pattern: "Effective when ADR-0009 is Accepted: setting the migration role through Flyway initSql (deprecated) or a SET ROLE callback (Flyway restores the captured login role, research F516-F517) instead of the deploy_rt role default; running a privileged migration (a role change, or a function created, replaced or re-owned for any C5 definer owner: today auth_lookup, support_fn, audit_writer, pin_writer) in the pipeline or by any route other than the privileged procedure; a privileged migration missing from privileged-migrations.txt."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: FP-AGENT-VPS-ACCESS
    pattern: "Effective when ADR-0009 is Accepted: any SSH key, account, sudo entry, inbox, pull source or file on the VPS that belongs to or is written by the AI agent; the agent building, transferring or deploying a release; a release image built from the agent's caches or by the agent's CI; the ceremony running a script from the repository or a USB copy whose hash was not checked against the founder's off-machine value; build code running while the signing USB is inserted; the VPS provider account or the Tailscale admin account signed in from the workstation."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: FP-JOB-POLL-WITHOUT-SCOPE
    pattern: "Effective when ADR-0012 is Accepted: reading or claiming job_outbox, job_schedule or job_dedup outside a withScope(Job, tenant) transaction (a global poll), any platform_rt grant or policy on those tables, or computing job metrics with a cross-tenant query (it is silently filtered to 0 rows)."
    adr: ADR-0012
    adr_status: Proposed
    status: active
  - id: FP-SESSION-ADVISORY-LOCK
    pattern: "Effective when ADR-0012 is Accepted: a session-level advisory lock (pg_advisory_lock, pg_try_advisory_lock) in job code; it survives rollback and pooled-connection reuse. Serialisation uses the ADR-0008 two-key transaction-level scheme with a registered class id."
    adr: ADR-0012
    adr_status: Proposed
    status: active
  - id: FP-PROVIDER-CALL-IN-TX
    pattern: "Effective when ADR-0012 is Accepted: calling an external provider (email, push, webhook, any outbound HTTP) inside a database transaction; external effects follow IC-EXTERNAL-EFFECT."
    adr: ADR-0012
    adr_status: Proposed
    status: active
  - id: FP-POOL-CLOSE-BEFORE-RUNNER
    pattern: "Effective when ADR-0012 is Accepted: closing a Hikari pool in ApplicationStopping or anywhere before the JobRunner has stopped; an in-use connection is closed and the rollback fails."
    adr: ADR-0012
    adr_status: Proposed
    status: active
  - id: FP-EXPOSED-RETRY-IN-JOBS
    pattern: "Effective when ADR-0012 is Accepted: a job_rt or platform_rt Exposed Database without DatabaseConfig { defaultMaxAttempts = 1 }, or a job transaction with maxAttempts > 1; Exposed's default re-runs a failed block (3 runs observed, timeout tripled)."
    adr: ADR-0012
    adr_status: Proposed
    status: active
  - id: FP-LISTEN-NOTIFY
    pattern: "Effective when ADR-0012 is Accepted: LISTEN/NOTIFY in the backend until a revisit trigger in ADR-0012 Decision 11 reopens Decision 1; polling is the floor even then."
    adr: ADR-0012
    adr_status: Proposed
    status: active
  - id: FP-LAYER1-DEPENDS-ON-PRODUCT
    pattern: "Effective when ADR-0010 is Accepted: a Layer 1 module (net.kodelix.core.*) depending on, importing or naming a Layer 2 or Layer 3 module or a Kodeebo concept (station, bill, cashier, counter, venue, shift, End Day) in its public API; a Layer 1 retention, closure or export orchestrator calling product tables or classes directly instead of the participant port."
    adr: ADR-0010
    adr_status: Proposed
    status: active
  - id: FP-FK-LAYER1-TO-PRODUCT
    pattern: "Effective when ADR-0010 is Accepted: a foreign key from a Layer 1 table to a Layer 2 or Layer 3 table, or any cross-module FK against the Gradle dependency direction."
    adr: ADR-0010
    adr_status: Proposed
    status: active
  - id: FP-EXPOSED-CROSS-MODULE-REFERENCE
    pattern: "Effective when ADR-0010 is Accepted: a public Exposed Table object, or an Exposed reference() to another module table; rows across modules are referenced by id value with the FK in SQL."
    adr: ADR-0010
    adr_status: Proposed
    status: active
  - id: FP-ROLE-IN-MIGRATION
    pattern: "Effective when ADR-0010 is Accepted: creating or altering a role in a Flyway migration, or a Layer 1 migration granting to a role outside ADR-0001 1b as amended; roles come only from the bootstrap roles script (core or product part) after an ADR-0001 amendment."
    adr: ADR-0010
    adr_status: Proposed
    status: "superseded_by: ADR-0010 r3 (2026-10-21) -> FP-ROLE-IN-MIGRATION-R2"
  - id: FP-ROLE-IN-MIGRATION-R2
    pattern: "Effective when ADR-0010 is Accepted: creating or altering a role in a non-privileged migration (one not on privileged-migrations.txt as <module>:<version>), or a Layer 1 migration granting to a role outside ADR-0001 1b as amended. Roles come from the bootstrap roles script (initial; core part in tenancy, product part in the product) or, for a role added later, from a privileged migration applied by the founder as the bootstrap superuser (ADR-0001 1b, ADR-0009 4a), each after an ADR-0001 amendment; the privileged migration applies attributes, memberships and defaults unconditionally and a CI test compares pg_roles, pg_auth_members and pg_db_role_setting between a database bootstrapped from the current script and one from the previous version."
    adr: ADR-0010
    adr_status: Proposed
    status: active
  - id: FP-RAW-LINK-TOKEN-AT-REST
    pattern: "Effective when ADR-0013 is Accepted: a raw single-use link token (recovery reset, factor-removal cancel) in any table, job payload, dead row, log line, span or alert; only its hash and expiry are stored, minted in the send's transaction A."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: FP-UNGUARDED-OUTBOUND-HTTP
    pattern: "Effective when ADR-0013 is Accepted: an HTTP request to a user-, tenant- or client-influenced URL that does not go through egress GuardedHttp, including through a library's own HTTP client (the web-push library's client is excluded); an architecture test fails it."
    adr: ADR-0013
    adr_status: Proposed
    status: active
  - id: FP-APPROVE-FROM-NOTIFICATION
    pattern: "Effective when ADR-0013 is Accepted: approving, declining or confirming anything from a push or email notification (action buttons, a reply, or a link that acts without the signed-in dashboard and step-up), or putting a remote-approval wait on a counter path."
    adr: ADR-0013
    adr_status: Proposed
    status: active
# 2026-10-19: technology_choices section added for ADR-0006 (backend track, Proposed); append-only like the other sections.
# 2026-10-19 (ADR-0006 review): only TECH-* entries belong here; the IC-* and FP-* entries first placed here are superseded by copies in interface_contracts and forbidden_patterns.
technology_choices:
  - id: TECH-BACKEND-KTOR
    choice: "Backend track Ktor on Kotlin/JVM (stack.backend: ktor, core.track: kotlin, saas-core-kotlin; founder 2026-10-19): Kotlin 2.4.21, kotlinx.coroutines 1.11.0, Ktor 3.6.0 exact, Exposed 1.5.1 with ADR-0002 J1 suspendTransaction, HikariCP 7.1.0, OpenTelemetry Java agent 2.32.0, Bouncy Castle 1.86 for Ed25519 and ETA CAdES-BES (C1). Still to pin: pgjdbc (42.7.14 seen 2026-10-18), an SLF4J 2 binding, Bouncy Castle; JDK 21 or 25 and its distribution open (Q8); Gradle wrapper 9.7.0 (\"9.7\" does not resolve) or 9.8.x per Q7. Mandatory in CI: dependency locking incl. buildscript, strict verification metadata, OSV-Scanner on every PR, base images by digest; no backend image before an image scanner and SBOM generator are pinned (Q6). Explicit heap and Compose memory limit from S18 before the first deploy. Billing: rules as data and one shared vector suite in every combination, one Kotlin module only if the desktop ADR picks Compose Desktop (S46). Switch-to-Go conditions recorded in ADR-0006 Decision 12; Compose Desktop x Go rejected."
