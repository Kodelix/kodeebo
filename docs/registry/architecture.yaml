    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> IC-PRE-CONTEXT-LOOKUPS-R9"
  - id: IC-PASSWORD-HASHER-R2
    contract: "PasswordHasher.hash(secret) -> PhcString + pepperKeyId; verify(secret, PhcString, pepperKeyId) -> Ok | Bad | Ok(needsRehash). Argon2id (Bouncy Castle 1.86 or Password4j), per-user random 128-bit CSPRNG salt, PHC string, parameters at or above OWASP m=19456 KiB t=2 p=1 from S13, on Dispatchers.Default.limitedParallelism(n, \"argon2\"); pepper = Argon2id secret input from PepperProvider.current()/byId(keyId): kept outside the database, in the encrypted server secret file now, from the first paying customer an AWS KMS envelope (KMS wraps the pepper; decrypted once at start-up, held in memory; KMS never computes the hash; ASVS 13.3.3 deviation accepted by name). New hashes use the current key id; old key id or parameters -> re-hash at the next successful sign-in (Logins.rehash); an old pepper is kept until no row uses its key id or until its configured deadline, when remaining rows are marked must_reset (Logins.markMustReset) and their verifier cleared; a compromised pepper marks every row on its key id must_reset at once; gauge password_rows{pepper_key_id}. Recovery codes: salted Argon2id PHC per code; reset tokens >= 128 bits stored as SHA-256; TOTP secrets AEAD-encrypted under a key with its own id, re-encrypted by SecondFactors.reencrypt."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: IC-STEP-UP-R2
    contract: "StepUp.issue only after a fresh TOTP code or a user-verified passkey assertion (fresh = the TOTP step or WebAuthn challenge was created after the step-up request; the challenge carries action and target; a recovery code never counts); the step-up rotates the session token (Sessions.rotate, ASVS 7.2.4) and the grant is bound to (new token hash, action, target), single use, short configured lifetime; the action's use case calls StepUp.consume inside its own transaction; missing, used, expired or mismatched grant -> refused + security event. Dashboard actions (owner only until the ADR-0003 amendment): closure request/cancel, erase person, support grant approve/revoke, role and assignment changes, second-factor and recovery-contact changes, recovery-code regeneration, tenant export, device enrol/revoke, tenant security settings, issue a temporary password, disable or re-enable a login, require a PIN reset, start another person's factor reset. Console actions: suspend or reinstate a tenant, Sessions.endAllForTenant, SupportGrants.revokeAllForTenant, plan or limit change, start a Kodelix closure, request a support grant, seat and licence issue/approve/move/suspend/revoke, and the licensing ADR's list (M36, M15). A dashboard user without a second factor cannot run a step-up action. The 2FA rule for privileged roles covers dashboard logins only; a counter-only person approves overrides with their PIN."
    adr: ADR-0007
    adr_status: Accepted
    status: "superseded_by: M21/M22 amendment 2026-10-20 (Proposed) -> IC-STEP-UP-R3"
  - id: IC-COUNTER-ENROLMENT-R2
    contract: "Per-device enrolment, device online. Password path: the counter calls the dashboard sign-in API (app_rt) with username, password and TOTP or one recovery code (no passkey on the counter); success returns a single-use enrolment assertion bound to the device credential (Enrolment.issueAssertion), never a session; the device consumes it over device_rt (Enrolment.consumeAssertion). Sponsored path: a sponsor signed in on that device, confirmed online (Device scope), holding staff.enrol_device, assigned to that branch, whose permission set is a strict superset of the target's (owner above every role; owner only until the ADR-0003 amendment) picks the person; the device shows a random one-time TemporaryPin once, which must be changed at first use and expires on the lease clock (monotonic plus persisted high-water mark), not the raw monotonic clock; a cashier needs no email or dashboard password. EnrolmentFact {person, device, path, sponsor?, at} is synced and never carries a PIN or verifier. PinVerifier: Argon2id, per-user random salt, start m=64 MiB t=3 p=1 fitted by S22/S23 (PBKDF2-SHA256 600k fallback), only inside the encrypted device store whose key plays the pepper's role; floors 6 / 8 as owner-visible settings, a raised floor forces a new PIN at next sign-in; lockout delay from 5, locked at 10 on the lease clock, override-dialog failures count (ASVS 6.1.1 deviation accepted by name); temporary PINs and idle lock on the lease clock."
    adr: ADR-0007
    adr_status: Accepted
    status: "superseded_by: ADR-0008 (Proposed 2026-10-19; effective when ADR-0008 is Accepted) -> IC-COUNTER-ENROLMENT-R3"
  - id: IC-SESSION-AUTHORIZER-R4
    contract: "SessionResolver.resolve(OpaqueToken) -> Principal: SessionLookup.find(tokenHash) (PL), then a principal read in a Staff scope with an empty branch list (staff_roles, roles, role_permissions, staff_branches), per request, no cache; sessions are created and ended only through ADR-0001 § 1c functions. effective when ADR-0008 is Accepted: Principal = {user, tenant, roles: Set<RoleId>, isOwner, permissions: Map<PermissionKey, Limits>, branches: All | List<BranchId>}; branches = All exactly when isOwner; Limits = {amount?, percent?, minutes?}, absent = no authority except isOwner; a person's permissions are the union of their roles, each limit the largest granted. Authorizer.require(principal, key, target branch?, amount?) -> Allowed | Denied, deny by default."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: IC-PERMISSION-CATALOGUE
    contract: "effective when ADR-0008 is Accepted: permission keys are defined in code and mirrored in the class-G table permission_catalogue (key, limit_kinds, approvable, owner_only, privileged, tier), written only by a reviewed migration; role_permissions.key references it. Tier-1 keys per ADR-0008 § 1, including report.x and report.z (split; report.z approvable as approve.report_z) and day.end (approvable as approve.day_end; refused while any bill, session or shift is open for every role, and that refusal is never approvable); staff.enrol_device, staff.reset_pin, staff.suspend_local; reserved Tier-2 keys bill.price_override, payment.refund, session.backdate (off in every template). privileged = any staff.* key, approve.*, review.decide, config.edit, catalogue.edit, activity_log.view, report.export and every owner-only key: a dashboard login holding one must have a second factor (ADR-0007). Templates owner (immutable), manager, cashier per ADR-0008 § 2; limits unset until install (unset = no authority)."
    adr: ADR-0008
    adr_status: Accepted
    status: "superseded_by: staff-auth threat-model amendment 2026-10-19 -> IC-PERMISSION-CATALOGUE-R2"
  - id: IC-OVERRIDE
    contract: "effective when ADR-0008 is Accepted: one-shot approval on the counter: the approver selects themselves and enters their own PIN; the device checks from its authority snapshot that the approver is active, assigned to the branch, holds approve.<action>, the amount is within their limit and they are not the requester; the action proceeds once. OverrideFact {overrideId, requester, approver, action, subjectIds, amount?, limitUsed?, reasonId, authorityVersion, deviceSeq, claimedAt, monotonic, outcome} is written in the same local transaction as the action; refused and locked attempts too. At sync FactAuthority.judge flags, never rejects: approver_authority_changed, approver_missing, limit_exceeded, self_approval, branch_not_assigned, staff_unknown, config_version_stale; flagged facts go to the owner review queue. Fallback O4: the approver acts under their own sign-in."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> IC-OVERRIDE-R2"
  - id: IC-ACTIVITY-TRAIL
    contract: "effective when ADR-0008 is Accepted: activity_trail (TD, branch_scope where the event has a branch), append-only, written only through SECURITY DEFINER functions owned by audit_writer: ActivityTrail.appendServer(event), acceptDeviceBatch(deviceId, entries, claimedHead) -> ackHead, verifyChains(), pruneBefore(cutoff) (oldest first, chain anchor). Device events arrive as audit facts in the sync outbox in the same local transaction as the business change; hash chain per device and per tenant for server events; acknowledged heads stored per batch; latest head anchored off-host. Record: ids and enums only (audit id, tenant, branch, device, actor staff id, action, outcome, UTC claim and receipt times, sequence, prev hash, hash, event ids, amounts, reason id). Readers: owner all; activity_log.view assigned branches; Kodelix only under an owner grant. Authority changes and review decisions also go to the control journal. Kept 5 years."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> IC-ACTIVITY-TRAIL-R2"
  - id: IC-COUNTER-ENROLMENT-R3
    contract: "effective when ADR-0008 is Accepted (amends ADR-0007): enrol once, valid on every device of the person's assigned branches. Password path: the counter calls the dashboard sign-in API (app_rt) with username, password and TOTP or one recovery code (no passkey on the counter); success returns a single-use enrolment assertion bound to the device credential (Enrolment.issueAssertion), never a session; the device consumes it over device_rt (Enrolment.consumeAssertion); the device refuses a PIN equal to the password just entered or contained in it, compared in memory only, never stored or sent. Sponsored path: a sponsor signed in on that device, confirmed online (Device scope), holding staff.enrol_device, assigned to that branch, whose permission set is a strict superset of the target's (owner above every role), picks the person; the device shows a random one-time TemporaryPin once, changed at first use, expiring on the lease clock. The device computes the Argon2id verifier (per-user salt, PHC, parameters fitted to the weakest supported PC by S40 = S22/S23, PBKDF2-SHA256 600k fallback, clamped on the device both ways) and uploads it; floors 6 / 8 as owner-visible settings, a raised floor forces a new PIN; lockout per device (delay from 5, lock at <= 10, override-dialog failures count) on the lease clock, failures reported at contact and summed per person into a lock on every device through the feed (aggregate budget a named deviation)."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> IC-COUNTER-ENROLMENT-R4"
  - id: IC-PIN-VERIFIER-CUSTODY
    contract: "effective when ADR-0008 is Accepted: PinVerifiers.accept(personId, phc, enrolmentFactId) -> VerifierVersion | Refused(no_enrolment_fact | stale_version), over device_rt, only against a single-use enrolment or reset fact; the server stores the verifier AEAD-encrypted under a per-tenant data key with AAD = tenant || person || verifierVersion and a verifier_key_id; per-tenant data keys are wrapped by a master key outside the database (encrypted secret file now, AWS KMS envelope at the first paying customer, decrypted once at start-up; 13.3.1 and 13.3.3 deviations accepted by name); rotation re-wraps or re-encrypts without any PIN; closing a tenant destroys its data key. The server never verifies a PIN or compares a hash and never caches decrypted verifiers. The staff feed delivers a verifier only to active, lease-valid devices of the person's assigned branches and removes it on disable, transfer, erasure, reset-required and a raised floor; erasure deletes the server ciphertext (backups lose it within the backup window, tombstone replay re-deletes). A key-and-database compromise is remediated by a PIN reset for every affected person, never by key rotation alone."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> IC-PIN-VERIFIER-CUSTODY-R2"
  - id: IC-OVERRIDE-R2
    contract: "effective when ADR-0008 is Accepted: one-shot approval on the counter: the approver selects themselves and enters their own PIN; the device checks from its authority snapshot that the approver is active, assigned to the branch, holds approve.<action>, the amount is within their limit and they are not the requester; the action proceeds once. OverrideFact {overrideId, requester, approver, action, subjectIds, amount?, limitUsed?, reasonId, authorityVersion, deviceSeq, claimedAt, monotonic, outcome} is written in the same local transaction as the action; refused and locked attempts too. At sync FactAuthority.judge flags, never rejects: approver_authority_changed, approver_missing, limit_exceeded, self_approval, branch_not_assigned, staff_unknown, config_version_stale, config_version_unknown; flagged facts go to the owner review queue. Fallback O4: the approver acts under their own sign-in. approver_authority_changed is set only when a change the device had not received took effect before the claimed time; no override runs in Restricted mode until Q-restricted is decided."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: IC-ACTIVITY-TRAIL-R2
    contract: "effective when ADR-0008 is Accepted: activity_trail (TD, branch_scope where the event has a branch), append-only, written only through SECURITY DEFINER functions owned by audit_writer: ActivityTrail.appendServer(event), acceptDeviceBatch(deviceId, entries, claimedHead) -> ackHead, verifyChains(), pruneBefore(cutoff) (oldest first, chain anchor). Device events arrive as audit facts in the sync outbox in the same local transaction as the business change; hash chain per device and per tenant for server events; acknowledged heads stored per batch; latest head anchored off-host. Record: ids and enums only (audit id, tenant, branch, device, actor staff id, action, outcome, UTC claim and receipt times, sequence, prev hash, hash, event ids, amounts, reason id). Readers: owner all; activity_log.view assigned branches; Kodelix only under an owner grant. Authority changes and review decisions also go to the control journal. Kept 5 years. Additions effective when ADR-0008 is Accepted: appendServer takes the per-tenant trail append lock pg_advisory_xact_lock(<trail class id>, <tenant key>); pruneBefore (EXECUTE job_rt only) refuses a cutoff later than clock_timestamp() minus the trail period from the retention table and a period below a compiled floor of 5 years; the table is marked tax and follows the tax archive (kept through archive_retained, deleted at purged); tenant-level events (no branch) are readable by the owner only; every server Authorizer decision on a privileged key is logged (ASVS 16.3.2 L3; other allowed decisions a recorded deviation); the restore gap is the storage / sync ADR's."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: IC-COUNTER-ENROLMENT-R4
    contract: "effective when ADR-0008 is Accepted (amends ADR-0007): enrol once, valid on every device of the person's assigned branches. Password path: the counter calls the dashboard sign-in API (app_rt) with username, password and TOTP or one recovery code (no passkey on the counter); success returns a single-use enrolment assertion bound to the device credential (Enrolment.issueAssertion), never a session; the device consumes it over device_rt (Enrolment.consumeAssertion); the device refuses a PIN equal to the password just entered or contained in it, compared in memory only, never stored or sent. Sponsored path: a sponsor signed in on that device, confirmed online (Device scope), holding staff.enrol_device, assigned to that branch, whose permission set is a strict superset of the target's (owner above every role), picks the person; the device shows a random one-time TemporaryPin once, changed at first use, expiring on the lease clock. The device computes the Argon2id verifier (per-user salt, PHC, parameters fitted to the weakest supported PC by S40 = S22/S23, PBKDF2-SHA256 600k fallback, clamped on the device both ways) and uploads it; floors 6 / 8 as owner-visible settings, a raised floor forces a new PIN; lockout per device (delay from 5, lock at <= 10, override-dialog failures count) on the lease clock, failures reported at contact and summed per person into a lock on every device through the feed (aggregate budget a named deviation). Revised effective when ADR-0008 is Accepted: a verifier from a device-minted fact (sponsor, counter_reset, self_change, parameter rehash) is unconfirmed and delivered only to its minting device until a server-checked fact confirms it (the person's password-path sign-in on any counter, or the owner's dashboard confirmation); for a person holding a privileged key only a confirmed verifier leaves the minting device; a dashboard-issued activation code (IC-PIN-ACTIVATION) also confirms. The per-person lock threshold has a compiled ceiling of 10, a reported success clears the sum, an owner's lock is cleared by a dashboard reset required plus a password-path enrolment, and the widened 6.1.1 lockout is accepted by name. A received verifier with parameters outside the device's floor or ceiling is not installed."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> IC-COUNTER-ENROLMENT-R5"
  - id: IC-PIN-VERIFIER-CUSTODY-R2
    contract: "effective when ADR-0008 is Accepted: PinVerifiers.accept(personId, phc, fact: {kind in password_assertion | dashboard_reset | activation_code | sponsor | counter_reset | self_change, factId}, baseVersion) -> VerifierVersion(confirmed | unconfirmed) | Refused(no_fact | fact_used | stale_version | params_out_of_range), over device_rt; single use in the database (a trigger consumes the pin_upload_facts row; compare-and-set on verifier_version). password_assertion, dashboard_reset and activation_code are server-checked (confirmed); the device-minted kinds are unconfirmed and delivered only to the minting device until PinVerifiers.confirm (password sign-in or owner dashboard). Stored AEAD-encrypted under a per-tenant data key (AAD = tenant || person || verifierVersion, verifier_key_id) wrapped by a master key outside the database (secret file now, AWS KMS envelope at the first paying customer; never in the database, a backup, a log or the repository); rotation without any PIN; at purge_personal the tenant key and every verifier row are deleted and backup copies age out inside the backup window. The server never verifies a lasting PIN, never caches decrypted verifiers and no API returns a verifier or its ciphertext; the only server-checked PIN-like secret is the one-time activation code. Erasure: PinVerifiers.erasePerson deletes ciphertext, upload facts and activation codes. A key-and-database compromise is remediated by a PIN reset for every affected person, never by key rotation alone."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> IC-PIN-VERIFIER-CUSTODY-R3"
  - id: IC-PIN-ACTIVATION
    contract: "effective when ADR-0008 is Accepted: dashboard-issued temporary PIN for remote onboarding. PinActivation.issue(personId) (owner, step-up) only for a person whose roles hold no privileged key as defined by permission_catalogue.privileged (checked at issue and at use), assigned to a branch; the server generates the code with a CSPRNG (configured length, compiled floor 8 characters, unambiguous alphanumeric alphabet), shows it once, stores only a salted Argon2id PHC, single use, expires after a configured time (default 24 h), a new code voids the old. PinActivation.redeem(personId, code, deviceCredential) online only, on a lease-valid device of one of the person's branches; the server checks the code (the one stated exception to 'the server never verifies a PIN'); attempts per code counted, voided after a configured number (compiled ceiling 10); success consumes it and returns a single-use activation_code fact, which the person uses to set their own PIN before any other action; that verifier is confirmed and travels fleet-wide. Trail entry and owner notice on issue, use, expiry and voiding. ASVS 6.4.1, 6.4.6, 6.5.2."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> IC-PIN-ACTIVATION-R2"
  - id: IC-PRE-CONTEXT-LOOKUPS-R9
    contract: "ADR-0001 § 1c, SECURITY DEFINER functions owned by auth_lookup, pinned search_path, EXECUTE only for the named roles: LoginLookup.find(identifier), Logins.create/disable (owner, app_rt), Logins.statusOf(user) (inside, tenant match, app_rt), Logins.changeOwnVerifier(tokenHash, verifier) (app_rt, after the app re-verifies the current password); SessionLookup.find, Sessions.create, Sessions.end (app_rt), Sessions.endAllForUser (owner, app_rt), Sessions.endAllForTenant (platform_rt); EnrolmentCodeLookup.find(codeHash) -> {tenant, branch, branchLabel, seat, state} (device_rt, no consumption), Enrolment.createCode (owner, app_rt; stores the branch display label on the code row), Enrolment.redeem (device_rt); DeviceCredentialLookup.find, Devices.rotateCredential (device_rt), Devices.revokeCredential (owner, app_rt), Devices.revokeCredentialForLicensing (licensing service roles, tenant match only); SupportGrantLookup.find(grantId, operatorId), listByOperator(operatorId) (support_rt); SupportGrants.revokeAllForTenant(tenant) (before, platform_rt, suspension step); inside, job (EXECUTE by job_rt only, app.tenant_id must equal the row's tenant, context tenant only): Closure.endSessions(), Closure.purgeLogins() (owner's login included), Closure.purgeEnrolmentCodes(), Closure.revokeDevices(), Closure.revokeGrants(), Closure.purgeRemaining() (at purged), Erasure.erasePersonLogin(user). auth_lookup never reads TD tables. Effective when ADR-0007 is Accepted (ADR-0007 Key Interfaces is the full list): Sessions.create(user, tenant, tokenHash, aal, absoluteExpiresAt, idleExpiresAt) replaces the old signature; Sessions.touch, rotate, listOwn, endOwn, endOthers (before, app_rt, bound to the caller's session); Contacts.startVerify/confirm (login_contacts); Recovery.create(identifier, tokenHash, expiresAt) (no-op for a disabled login or a non-owner of a suspended tenant; reads the verified address from login_contacts; writes auth_notices), Recovery.redeem -> resetHandle; Logins.resetVerifier(resetHandle, verifier, pepperKeyId) consumes the handle, ends every session, voids recovery requests and step-up grants in one transaction; Logins.rehash (compare-and-set), Logins.issueTemporary (inside, owner until the ADR-0003 amendment), Logins.markMustReset(pepperKeyId) (inside, job); Logins.disable also voids recovery requests and step-up grants; SecondFactors.forLogin, findByCredentialId, recoveryCodesFor, consumeRecoveryCode(user, codeId), acceptTotpStep, updatePasskeyCounter, enrol/remove (before, app_rt), startReset (inside, owner, step-up), applyPendingRemovals and reencrypt (inside, job), cancelRemoval (before, app_rt); Challenges.create/consume for register and step-up (unbound sign-in challenges stay in process memory); StepUp.issue (before, app_rt, after Sessions.rotate), StepUp.consume (inside, tenant match, app_rt); AuthNotices.claim (inside, job: the notice job reads owner contacts in tenant scope); Enrolment.issueAssertion (before, app_rt, after a full sign-in check, no session) and Enrolment.consumeAssertion(assertionHash, deviceKeyId) (before, device_rt, single use); Erasure.erasePersonLogin and Closure.purgeLogins also cover login_contacts, second_factors, recovery_requests, enrolment_assertions (erasure also step_up_grants); Closure.endSessions also step_up_grants and webauthn_challenges. No SMS path; device_rt gets no password or second-factor lookup. Amended by ADR-0008 (effective when ADR-0008 is Accepted): Logins.statusOf also EXECUTE by job_rt; Logins.disable and Erasure.erasePersonLogin take the last-owner lock (after any trail append) and refuse the last active owner; Logins.issueTemporary and Logins.disable refuse an owner target unless app.branch_all = 'on'; for these checks only, auth_lookup may SELECT staff_roles and roles.is_owner inside the tenant context."
    adr: ADR-0008
    adr_status: Accepted
    status: "superseded_by: staff-auth threat-model amendment 2026-10-19 -> IC-PRE-CONTEXT-LOOKUPS-R10"
  - id: IC-COUNTER-ENROLMENT-R5
    contract: "effective when ADR-0008 is Accepted (amends ADR-0007): enrol once, valid on every device of the person's assigned branches. Password path: the counter calls the dashboard sign-in API (app_rt) with username, password and TOTP or one recovery code (no passkey on the counter); success returns a single-use enrolment assertion bound to the device credential (Enrolment.issueAssertion), never a session; the device consumes it over device_rt (Enrolment.consumeAssertion); the device refuses a PIN equal to the password just entered or contained in it, compared in memory only, never stored or sent. Sponsored path: a sponsor signed in on that device, confirmed online (Device scope), holding staff.enrol_device, assigned to that branch, whose permission set is a strict superset of the target's (owner above every role), picks the person; the device shows a random one-time TemporaryPin once, changed at first use, expiring on the lease clock. The device computes the Argon2id verifier (per-user salt, PHC, parameters fitted to the weakest supported PC by S40 = S22/S23, PBKDF2-SHA256 600k fallback, clamped on the device both ways) and uploads it; floors 6 / 8 as owner-visible settings, a raised floor forces a new PIN; lockout per device (delay from 5, lock at <= 10, override-dialog failures count) on the lease clock, failures reported at contact and summed per person into a lock on every device through the feed (aggregate budget a named deviation). Revised effective when ADR-0008 is Accepted: a verifier from a device-minted fact (sponsor, counter_reset, self_change, parameter rehash) is unconfirmed and delivered only to its minting device until it is confirmed; for a person holding a privileged key only a confirmed verifier leaves the minting device; a dashboard-issued activation code (IC-PIN-ACTIVATION) also confirms. The per-person lock threshold has a compiled ceiling of 10, a reported success clears the sum, an owner's lock is cleared by a dashboard reset required plus a password-path enrolment, and the widened 6.1.1 lockout is accepted by name. A received verifier with parameters outside the device's floor or ceiling is not installed. A pending verifier is confirmed only by the person setting a PIN on the password path (a new password_assertion upload, which replaces it) or by the owner's dashboard confirmation (step-up, showing person, device, fact kind and time, after checking with the person); a password-path sign-in that sets no PIN confirms nothing. While it is pending, other devices keep the last confirmed verifier; a dashboard reset required retires an old PIN everywhere. An activation code may also replace an existing PIN fleet-wide (owner-started remote reset)."
