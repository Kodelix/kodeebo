  - id: IC-PERMISSION-CATALOGUE-R2
    contract: "effective when ADR-0008 is Accepted: permission keys are defined in code and mirrored in the class-G table permission_catalogue (key, limit_kinds, approvable, owner_only, privileged, tier), written only by a reviewed migration; role_permissions.key references it. Tier-1 keys per ADR-0008 § 1, including report.x and report.z (split; report.z approvable as approve.report_z) and day.end (approvable as approve.day_end; refused while any bill, session or shift is open for every role, and that refusal is never approvable); staff.enrol_device, staff.reset_pin, staff.suspend_local; reserved Tier-2 keys bill.price_override, payment.refund, session.backdate (off in every template). privileged = any staff.* key, approve.*, review.decide, config.edit, catalogue.edit, activity_log.view, report.export and every owner-only key: a dashboard login holding one must have a second factor (ADR-0007). Templates owner (immutable), manager, cashier per ADR-0008 § 2; limits unset until install (unset = no authority). Amended 2026-10-19 by the staff-auth threat model (founder): a new owner-only key staff.confirm_verifier confirms a pending counter-minted verifier (PinVerifiers.confirm); staff.reset_pin keeps 'require a PIN reset' (dashboard_reset), checked in the database with the strict-subset rule."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: IC-PRE-CONTEXT-LOOKUPS-R10
    contract: "ADR-0001 § 1c, SECURITY DEFINER functions owned by auth_lookup, pinned search_path, EXECUTE only for the named roles: LoginLookup.find(identifier), Logins.create/disable (owner, app_rt), Logins.statusOf(user) (inside, tenant match, app_rt), Logins.changeOwnVerifier(tokenHash, verifier) (app_rt, after the app re-verifies the current password); SessionLookup.find, Sessions.create, Sessions.end (app_rt), Sessions.endAllForUser (owner, app_rt), Sessions.endAllForTenant (platform_rt); EnrolmentCodeLookup.find(codeHash) -> {tenant, branch, branchLabel, seat, state} (device_rt, no consumption), Enrolment.createCode (owner, app_rt; stores the branch display label on the code row), Enrolment.redeem (device_rt); DeviceCredentialLookup.find, Devices.rotateCredential (device_rt), Devices.revokeCredential (owner, app_rt), Devices.revokeCredentialForLicensing (licensing service roles, tenant match only); SupportGrantLookup.find(grantId, operatorId), listByOperator(operatorId) (support_rt); SupportGrants.revokeAllForTenant(tenant) (before, platform_rt, suspension step); inside, job (EXECUTE by job_rt only, app.tenant_id must equal the row's tenant, context tenant only): Closure.endSessions(), Closure.purgeLogins() (owner's login included), Closure.purgeEnrolmentCodes(), Closure.revokeDevices(), Closure.revokeGrants(), Closure.purgeRemaining() (at purged), Erasure.erasePersonLogin(user). auth_lookup never reads TD tables. Effective when ADR-0007 is Accepted (ADR-0007 Key Interfaces is the full list): Sessions.create(user, tenant, tokenHash, aal, absoluteExpiresAt, idleExpiresAt) replaces the old signature; Sessions.touch, rotate, listOwn, endOwn, endOthers (before, app_rt, bound to the caller's session); Contacts.startVerify/confirm (login_contacts); Recovery.create(identifier, tokenHash, expiresAt) (no-op for a disabled login or a non-owner of a suspended tenant; reads the verified address from login_contacts; writes auth_notices), Recovery.redeem -> resetHandle; Logins.resetVerifier(resetHandle, verifier, pepperKeyId) consumes the handle, ends every session, voids recovery requests and step-up grants in one transaction; Logins.rehash (compare-and-set), Logins.issueTemporary (inside, owner until the ADR-0003 amendment), Logins.markMustReset(pepperKeyId) (inside, job); Logins.disable also voids recovery requests and step-up grants; SecondFactors.forLogin, findByCredentialId, recoveryCodesFor, consumeRecoveryCode(user, codeId), acceptTotpStep, updatePasskeyCounter, enrol/remove (before, app_rt), startReset (inside, owner, step-up), applyPendingRemovals and reencrypt (inside, job), cancelRemoval (before, app_rt); Challenges.create/consume for register and step-up (unbound sign-in challenges stay in process memory); StepUp.issue (before, app_rt, after Sessions.rotate), StepUp.consume (inside, tenant match, app_rt); AuthNotices.claim (inside, job: the notice job reads owner contacts in tenant scope); Enrolment.issueAssertion (before, app_rt, after a full sign-in check, no session) and Enrolment.consumeAssertion(assertionHash, deviceKeyId) (before, device_rt, single use); Erasure.erasePersonLogin and Closure.purgeLogins also cover login_contacts, second_factors, recovery_requests, enrolment_assertions (erasure also step_up_grants); Closure.endSessions also step_up_grants and webauthn_challenges. No SMS path; device_rt gets no password or second-factor lookup. Amended by ADR-0008 (effective when ADR-0008 is Accepted): Logins.statusOf also EXECUTE by job_rt; Logins.disable and Erasure.erasePersonLogin take the last-owner lock (after any trail append) and refuse the last active owner; Logins.issueTemporary and Logins.disable refuse an owner target unless app.branch_all = 'on'; for these checks only, auth_lookup may SELECT staff_roles and roles.is_owner inside the tenant context. Amended 2026-10-19 by the staff-auth threat model (founder): Enrolment.consumeAssertion also returns a single-use receipt (>= 128 bits CSPRNG, SHA-256 in enrolment_assertions.receipt_hash) bound to tenant, the login user, device key and a short expiry; new Enrolment.consumeReceipt(receiptHash, userId, deviceKeyId) (inside, tenant match, device_rt, called by the pin_upload_facts trigger, which resolves the uploading person to their login on the TD side) consumes it once; the first use of a temporary password (Logins.issueTemporary) writes an auth_notices row for the owner (M55); no key in the database; a restore voids unconsumed receipts."
