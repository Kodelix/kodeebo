raises if app.device_id is set; activation_code facts are in neither role's WITH CHECK and are inserted only by PinActivation.redeem, a pin_writer function; the approve-on-phone switch is the release flag approve_on_phone_enabled in the G table release_flags (reviewed migration only); lock generations come from a monotonic per-person counter and are never reused; triggers and functions are SECURITY DEFINER owned by NOLOGIN pin_writer; the kind is checked against the assertion's issuing path (kind_mismatch) and password_assertion is refused for privileged people once approve-on-phone is enabled; a credential epoch in pin_person_state (bumped by reset required, a raised floor, any confirmed change, re-creation after erasure) is carried by device-minted facts and a moved epoch refuses them (stale_epoch); composite FK (tenant_id, minting_device_id) -> devices; compare-and-set per slot for device-minted kinds with one per-person verifier_version sequence; one device never writes, replaces or clears another's slot; feed = confirmed verifier plus the device's own slot; tombstones per slot (causes + superseded, device_revoked); a confirmed upload deletes every slot in its transaction; owner confirmation (non-privileged only) is the pin_writer function PinVerifiers.confirm(personId, deviceId, expectedVersion), which swaps the slot to confirmed, tombstones the others and bumps the epoch (app_rt: EXECUTE on confirm and listPending only, no UPDATE grant); PinVerifiers.dropDeviceSlots runs with each device revoke; a counter reset clears a lock only on its own device via pin_lock_clears (tenant, person, device, lock_seq); erasure tombstones every slotted device; a raised floor tombstones every slot; slot changes join the M17 control journal. Accepted residual: device_rt with SQL access can change app.device_id in its own transaction (Kamel Mohamed, 2026-10-20)."
