    adr: ADR-0007
    adr_status: Proposed
    status: "superseded_by: ADR-0007 review fixes 2026-10-19 -> IC-COUNTER-ENROLMENT-R2"
  - id: IC-PRE-CONTEXT-LOOKUPS-R8
