    status: "superseded_by: ADR-0008 (Proposed 2026-10-19; effective when ADR-0008 is Accepted) -> TR-RETENTION-DEFAULTS-R4"
  - id: TR-SUPPORT-JOURNAL-PRUNE-R3
    rule: "The support grant and access journal is a TD table inside the database, a separate store from the deletion journal (founder 2026-10-18; departs from research § 4.2 item 3 because retention, location and deletion rules differ). It is never updated; its only DELETE path is SupportJournal.pruneBefore(cutoff), a SECURITY DEFINER function owned by audit_writer (privileged migration), EXECUTE by job_rt only, inside the tenant context: under the per-tenant advisory lock it refuses a cutoff later than clock_timestamp() minus the support-journal period read from the class-G retention table (default 2 years), refuses when that period is shorter than a floor compiled into the function body (365 days, founder 2026-10-18), deletes oldest-first only rows older than the cutoff, and in the same transaction writes a chain anchor (hash of the last pruned row, count, cutoff) that becomes the chain's new start and is shipped to the off-host log; it never touches a tombstone. At purged the whole journal is pruned once its retention ends, leaving a final anchor off-host. A restore can roll the journal back to the backup point; the off-host log records the gap. Effective only when ADR-0005 is Accepted."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: TR-TAX-ARCHIVE-R4
    rule: "Sales, receipts, ETA payloads and cancelled originals are written to append-only archive tables (class TD) from the first sale, carrying only an opaque staff id; runtime roles have no UPDATE or DELETE on archive rows, and the only delete path is a job_rt DELETE policy requiring retain_until < clock_timestamp() and no legal hold, run only from archive_retained, so an active tenant's archive is never purged. retain_until (end of the last tax period with a sale + five years) is held in one row per tenant in the TD table archive_retention, never on archive rows; it is written only by a job_rt function, recomputed on a late sale, and only moves later (a trigger on archive_retention refuses any decrease; a tax-period change never lowers it). De-identification covers staff and deletes the id-to-name link, never updating an archive row; tax-required buyer identifiers stay inside the byte-exact signed ETA payloads (threat model R-6). A late sale is inserted with the opaque id and any name field dropped. After purge_personal the owner has no login; archive access is a Kodelix-run EXP-2 export after a one-time code is returned: platform_rt opens the CP archive_requests row (IDs and status only); a job_rt job in the tenant's scope generates the code (CSPRNG), sends it to archive_contact (TD) and writes only its hash to that row, so no operator role sees the code; the verification is recorded in the deletion journal; the file goes only to the archive contact. This path is not ADR-0004 support access. Erasing one staff member keeps their sales with the opaque id."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-CLOSURE-STATES-R4
    rule: "Tenant closure is the staged state machine active -> [suspended, optional] -> closure_requested -> export_window -> purge_personal -> archive_retained(retain_until) -> purged. Started by the owner with step-up (every owner contact notified) or by Kodelix after the Kodelix-closure threshold of suspension (default 90 days): platform_rt moves the tenant on CP, a job_rt job in the tenant's scope sends the notices at suspension and days 30, 60, 80. closure_origin (active | suspended) is recorded on CP tenant_status: from either origin no enrolment and no lease renewal; origin active keeps normal access until purge_personal, including owner-approved support grants (founder 2026-10-18), all revoked there; origin suspended keeps the suspension contract; the owner can cancel with step-up before purge_personal starts, returning to closure_origin. Cooling-off (default 15 days) must exceed the lease cap compiled into the app (14 days), CI-checked against that constant; the licensing ADR keeps any emergency unlock within this rule. purge_personal waits until every device's lease has ended and its backlog has drained (at most until the export window ends) and until the export is downloaded or the window ends; never while suspended. purge_personal runs as job_rt via the Job kind, one tenant per transaction: deletes the TD tables marked personal (every TD table carries a personal | tax | other marker, CI-checked), de-identifies staff by deleting the id-to-name mapping, runs the ADR-0001 § 1c Closure functions and prunes the support journal per retention. purged removes the archive and archive_contact, every remaining PL row, the support journal (final anchor off-host) and usage counts per retention; the CP tenant_status row stays as purged, IDs only. Every transition idempotent, resumable and recorded with date and time in the deletion journal."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-DELETION-REPLAY-R4
    rule: "Backups expire inside the backup window (default 30 days, below the 60-day device retention); a scheduled check alerts when the oldest backup is older than the window. The deletion journal is a separate store from the support journal: outside the restorable database (home set by the storage ADR, D5-C), kept 5 years (longer than the backup window, CI-checked); it holds tombstones (tenant, person, device), closure transitions and cancels, legal-hold set and release, archive purges, export deliveries and archive-request verifications. Security events (1 year) hold refused step-ups, refused closure or erasure attempts, export rate-cap hits and failed sign-ins with the identifier masked. The restore runbook replays every tombstone before the restored database serves traffic and destroys the side instance. Control journal (one definition): the append-only store outside the restorable database (D5-C) holding the control facts a device cannot resend (enrolment, approval, revocation, rotation, owner review decisions, the licence issuance log) and the deletion-journal records; the support journal and the security event log are not part of it."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-DEVICE-ERASURE
    rule: "An erased person's personal fields on a cashier device: the erase person sync command is applied at the device's next contact and confirmed; a revoked or retired device, or one whose tenant reached purge_personal, deletes staff personal fields at its next contact; no device deletes them at lease end (staff must still sign in to close open sessions); a lost device that never syncs keeps them encrypted at rest in the device store (residual R-7, accepted by Kamel Mohamed, founder, 2026-10-18). The sync ADR adds both commands to the sync protocol."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-SCOPE-ONCE-PER-TX-R7
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction), Staff (session lookup; the empty branch list is the ADR-0003 principal read), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (grant loaded before any tenant through SupportGrantLookup.find(grantId, operatorId); sets app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read; outcome appended as the last statement of the scoped transaction). No licensing scope kind yet: the licensing ADR adds it by amending ADR-0002, with M27/M38; until then no licensing service role runs. Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. The ADR-0001 § 1c functions are the only access to TD and PL rows outside the helper; also outside it and never on TD or PL rows: platform_rt on CP tables, DDL by deploy_rt and privileged migrations by the bootstrap superuser, physical backup by backup_rt. Ktor track (ADR-0002 J1 addendum 2026-10-19, effective when ADR-0006 is Accepted): one stated exception, the EXP-2 export carrier inside the helper module - a plain-JDBC transaction with auto-commit off whose first statement is the same set-once scope routine; it refuses a null app.tenant_id read-back and a second scope, exposes only copyOut, and is removed when S23 passes. Jobs stay inside Exposed transactions."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0006 re-check revision 2026-10-19 -> TR-SCOPE-ONCE-PER-TX-R8"
  - id: TR-SCOPE-ONCE-PER-TX-R8
    rule: "All tenant-scoped DB work runs in a transaction opened by the one scope helper, which sets its settings with set_config(..., true) exactly once, first, from a server-side source; kinds Job (job_rt: app.tenant_id only, one tenant per transaction), Staff (session lookup; the empty branch list is the ADR-0003 principal read), Device (verified credential: app.branch_id AND app.branch_ids = [same branch], never app.branch_all), Support (grant loaded before any tenant through SupportGrantLookup.find(grantId, operatorId); sets app.tenant_id, app.branch_ids from the grant, app.operator_id, transaction_timeout; access record committed in its own transaction before the read; outcome appended as the last statement of the scoped transaction). No licensing scope kind yet: the licensing ADR adds it by amending ADR-0002, with M27/M38; until then no licensing service role runs. Settings: app.tenant_id, app.branch_ids, app.branch_all, app.device_id, app.branch_id, app.operator_id only. The ADR-0001 § 1c functions are the only access to TD and PL rows outside the helper; also outside it and never on TD or PL rows: platform_rt on CP tables, DDL by deploy_rt and privileged migrations by the bootstrap superuser, physical backup by backup_rt. Ktor track (ADR-0002 J1 addendum 2026-10-19, revised after the re-check; effective when ADR-0006 is Accepted): one stated exception, the EXP-2 export carrier inside the helper module - Job and Staff scopes only (Support and Device refused); one REPEATABLE READ transaction with auto-commit off for the whole export, whose first statement is the same set-once scope routine; it refuses a null app.tenant_id read-back and a second scope, runs every table's copyOut in that transaction (one snapshot), exposes only an export session with copyOut, and is removed when S23 passes. Apart from the EXP-2 COPY statements, jobs and the outbox claim and sweep stay inside Exposed transactions. The relaxed reading of J1 applies to this carrier only."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: TR-TABLE-CLASSES-R5
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; the support access journal), no USING (true); CP tenant-keyed control plane without personal data or sales, tax or licensing records (tenant status, plan, restore watermark, usage counts without money, names, items, bill contents or free text), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context (login_identities, sessions, enrolment_codes, device_credentials, support_grants; effective when ADR-0007 is Accepted also second_factors, recovery_requests, step_up_grants), restrictive tenant policy TO every inventory role except auth_lookup; access across tenants, reads and writes, only through the ADR-0001 § 1c SECURITY DEFINER functions owned by auth_lookup; in-tenant permissive policies only where an ADR names them. Effective when ADR-0007 is Accepted: OP operator realm (operators, operator_credentials, operator_sessions, operator_step_up), no tenant_id and no tenant data, granted to console_rt only; no other role has any grant on an OP table and console_rt has none on TD, CP or PL."
    adr: ADR-0007
    adr_status: Proposed
    status: "superseded_by: ADR-0007 review fixes 2026-10-19 -> TR-TABLE-CLASSES-R6"
  - id: TR-ROLE-INVENTORY-R6
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy; one stated exception: writes data in class G tables (retention table, plan catalogue, tax rates; never tenant data) only inside a reviewed migration that deploy_rt runs through SET ROLE migrator), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; run by the founder with the credential from Bitwarden; each marked privileged; the deploy pipeline stops for the founder to run them on the database host; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR; none runs until it adds their scope kind), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only); effective when ADR-0007 is Accepted also console_rt (LOGIN, operator console, class OP tables only, no grant on TD, CP or PL; reads tenant data only through ADR-0004 support_rt). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR)."
    adr: ADR-0007
    adr_status: Proposed
    status: "superseded_by: ADR-0007 re-check fixes 2026-10-19 -> TR-ROLE-INVENTORY-R7"
  - id: TR-ROLE-INVENTORY-R7
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy; one stated exception: writes data in class G tables (retention table, plan catalogue, tax rates; never tenant data) only inside a reviewed migration that deploy_rt runs through SET ROLE migrator), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; effective when ADR-0007 is Accepted also the audited console lock-out script on OP tables only, never tenant credentials; run by the founder with the credential from Bitwarden, over SSH through Tailscale then local peer login; each marked privileged; the deploy pipeline stops for the founder to run them on the database host; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR; none runs until it adds their scope kind), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only); effective when ADR-0007 is Accepted also console_rt (LOGIN, operator console, grants on OP only; the console process also holds support_rt, the licensing logins and platform_rt, each called only with a live OP session). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR)."
    adr: ADR-0007
    adr_status: Accepted
    status: "superseded_by: ADR-0008 (Proposed 2026-10-19; effective when ADR-0008 is Accepted) -> TR-ROLE-INVENTORY-R8"
  - id: TR-TABLE-CLASSES-R6
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; the support access journal), no USING (true); CP tenant-keyed control plane without personal data or sales, tax or licensing records (tenant status, plan, restore watermark, usage counts without money, names, items, bill contents or free text), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context (login_identities, sessions, enrolment_codes, device_credentials, support_grants; effective when ADR-0007 is Accepted also login_contacts, second_factors, recovery_requests, step_up_grants, webauthn_challenges, auth_notices, enrolment_assertions), restrictive tenant policy TO every inventory role except auth_lookup; access across tenants, reads and writes, only through the ADR-0001 § 1c SECURITY DEFINER functions owned by auth_lookup; in-tenant permissive policies only where an ADR names them. Effective when ADR-0007 is Accepted: OP operator realm (operators, operator_credentials, operator_sessions, operator_step_up, operator_recovery_codes), no tenant_id, no RLS, no tenant data, granted to console_rt only; console_rt has grants on OP only (catalogue-checked both ways). Throttle and rate-limit state and unbound sign-in challenges are not tables: in-process state of the single backend instance (ADR-0007 § 3)."
    adr: ADR-0007
    adr_status: Accepted
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> TR-TABLE-CLASSES-R7"
  - id: TR-ROLE-ASSIGNMENT-GUARD-R2
    rule: "app_rt's INSERT, UPDATE and DELETE policies on roles, role_permissions, staff_roles and staff_branches require current_setting('app.branch_all', true) = 'on' (owner only), as database defence in depth behind the Authorizer (research F421; effective when ADR-0008 is Accepted: roles and role_permissions added). staff_roles is (tenant_id, staff_id, role_id) with a composite FK to roles. Every write is a step-up action (ADR-0007)."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: TR-OWNER-ROLE
    rule: "effective when ADR-0008 is Accepted: exactly one owner role per tenant (roles.is_owner = true), written by the provisioning job; its permission set is the whole permission catalogue including keys added later, evaluated from is_owner (no role_permissions rows); a BEFORE UPDATE OR DELETE trigger refuses any change but the label (F322); holding it is what sets app.branch_all = 'on'. At least one active owner always remains: a CONSTRAINT TRIGGER ... DEFERRABLE INITIALLY DEFERRED on staff_roles and staff status takes pg_advisory_xact_lock keyed on the tenant before counting (F320, F321; transaction-level for PgBouncer, F325). Owner-only keys (roles.manage, staff.assign, staff.erase, support.grant, export.tenant, device.enrol/revoke, tenant settings) cannot be stored in a custom role (save-time check and trigger against permission_catalogue.owner_only)."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> TR-OWNER-ROLE-R2"
  - id: TR-AUTHORITY-SNAPSHOT
    rule: "effective when ADR-0008 is Accepted: a per-tenant authority_version is incremented in the same transaction as any change to roles, role_permissions, staff_roles, staff_branches, staff status, tenant ceilings or PIN floors; the config feed (sync ADR) delivers an immutable per-branch authority snapshot (active staff, role ids, effective permissions and limits, staff_version, and per ADR-0008 § 10 the PIN verifiers of that branch's people); every device fact that used authority carries authority_version; the server keeps delivered snapshots (authority_snapshots, TD, ids only, never verifiers) for at least the longest lease plus the feed retry window and judges facts against the held version and current authority, flagging, never rejecting a money fact. Owner setting override_offline_max_age (S2) default off."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> TR-AUTHORITY-SNAPSHOT-R2"
  - id: TR-RETENTION-DEFAULTS-R4
    rule: "One retention table, class G (runtime roles read only), every period configuration with a typed default, changed only through a reviewed migration that deploy_rt runs through SET ROLE migrator (ADR-0001 § 1b exception); a change takes effect at the next purge without a code change. Founder defaults 2026-10-18, which the feature spec may refine: closure cooling-off 15 days (must exceed the lease cap compiled into the app, 14 days; the licensing ADR keeps emergency unlock within it); export window 30 days; generated export files 7 days, then deleted; backup window 30 days (below the 60-day device retention); ended sessions 90 days; support access journal 2 years (compiled prune floor 365 days); technical logs 30 days, with no personal data; security events 1 year; usage counts 3 years; deletion journal 5 years (must exceed the backup window); Kodelix-started closure after 90 days of suspension. Fixed by other rules: tax archive 5 years after the tax period; device keeps 60 days; staff access requests answered within 6 working days. CI checks both invariants. Routine retention runs while a tenant is suspended; each purge job logs every run; no period is a literal in code. Added by ADR-0008 (founder 2026-10-19; effective when ADR-0008 is Accepted): staff activity trail 5 years (oldest-first prune with chain anchor); control-journal kinds added by ADR-0007 and ADR-0008 (password reset, must_reset, factor add or remove, recovery-code use, login disable, role and authority changes, console lock-out runs) 1 year, which must exceed the backup window plus margin (CI-checked)."
    adr: ADR-0008
    adr_status: Accepted
    status: "superseded_by: staff-auth threat-model amendment 2026-10-19 -> TR-RETENTION-DEFAULTS-R5"
  - id: TR-ROLE-INVENTORY-R8
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy; one stated exception: writes data in class G tables (retention table, plan catalogue, tax rates, permission catalogue; never tenant data) only inside a reviewed migration that deploy_rt runs through SET ROLE migrator), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; also the audited console lock-out script on OP tables only, never tenant credentials; run by the founder with the credential from Bitwarden, over SSH through Tailscale then local peer login; each marked privileged; the deploy pipeline stops for the founder to run them on the database host; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR; none runs until it adds their scope kind), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN; support journal functions, and effective when ADR-0008 is Accepted also the ActivityTrail functions of ADR-0008), backup_rt (REPLICATION only), console_rt (LOGIN, operator console, grants on OP only; the console process also holds support_rt, the licensing logins and platform_rt, each called only with a live OP session). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR)."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> TR-ROLE-INVENTORY-R9"
  - id: TR-TABLE-CLASSES-R7
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; the support access journal), no USING (true); CP tenant-keyed control plane without personal data or sales, tax or licensing records (tenant status, plan, restore watermark, usage counts without money, names, items, bill contents or free text), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context (login_identities, sessions, enrolment_codes, device_credentials, support_grants; effective when ADR-0007 is Accepted also login_contacts, second_factors, recovery_requests, step_up_grants, webauthn_challenges, auth_notices, enrolment_assertions), restrictive tenant policy TO every inventory role except auth_lookup; access across tenants, reads and writes, only through the ADR-0001 § 1c SECURITY DEFINER functions owned by auth_lookup; in-tenant permissive policies only where an ADR names them. Effective when ADR-0007 is Accepted: OP operator realm (operators, operator_credentials, operator_sessions, operator_step_up, operator_recovery_codes), no tenant_id, no RLS, no tenant data, granted to console_rt only; console_rt has grants on OP only (catalogue-checked both ways). Throttle and rate-limit state and unbound sign-in challenges are not tables: in-process state of the single backend instance (ADR-0007 § 3). effective when ADR-0008 is Accepted: TD also holds roles, role_permissions, activity_trail (marked tax), authority_snapshots, pin_verifiers, pin_upload_facts, pin_activation_codes and tenant_data_keys; G also holds permission_catalogue (written only by a reviewed migration). The pin and key tables are on the export exclusion list."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> TR-TABLE-CLASSES-R8"
  - id: TR-ROLE-INVENTORY-R9
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy; one stated exception: writes data in class G tables (retention table, plan catalogue, tax rates, permission catalogue; never tenant data) only inside a reviewed migration that deploy_rt runs through SET ROLE migrator), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; also the audited console lock-out script on OP tables only, never tenant credentials; run by the founder with the credential from Bitwarden, over SSH through Tailscale then local peer login; each marked privileged; the deploy pipeline stops for the founder to run them on the database host; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR; none runs until it adds their scope kind), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN; support journal functions, and effective when ADR-0008 is Accepted also the ActivityTrail functions of ADR-0008), backup_rt (REPLICATION only), console_rt (LOGIN, operator console, grants on OP only; the console process also holds support_rt, the licensing logins and platform_rt, each called only with a live OP session). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR). Grants effective when ADR-0008 is Accepted: device_rt writes pin_verifiers only through a trigger that consumes a matching pin_upload_facts row, calls PinActivation.redeem, LockoutReport and ActivityTrail.acceptDeviceBatch; job_rt runs ActivityTrail.verifyChains, ActivityTrail.pruneBefore and key rotation/rewrap; app_rt and job_rt have EXECUTE on ActivityTrail.appendServer; app_rt has no SELECT on pin_verifiers or tenant_data_keys."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> TR-ROLE-INVENTORY-R10"
  - id: TR-OWNER-ROLE-R2
    rule: "effective when ADR-0008 is Accepted: exactly one owner role per tenant (roles.is_owner = true; partial unique index on roles (tenant_id) WHERE is_owner; app_rt has no INSERT or UPDATE privilege on is_owner), written by the provisioning job; its permission set is the whole permission catalogue including keys added later, evaluated from is_owner; a BEFORE UPDATE OR DELETE trigger refuses any change but the label (F322); holding it sets app.branch_all = 'on'. At least one active owner (owner role + staff status active + enabled dashboard login) always remains: the guard runs on staff_roles delete or update (cascades included), staff status update or delete, and the § 1c functions Logins.disable and Erasure.erasePersonLogin; on the tables it is a CONSTRAINT TRIGGER ... DEFERRABLE INITIALLY DEFERRED counting after pg_advisory_xact_lock(<last-owner class id>, <tenant key>) (two-key, transaction-level; lock order journal, trail, last-owner); the trigger runs as the queuing role (PostgreSQL 18) and is tested as app_rt and job_rt under FORCE RLS. Closure exception: a delete passes only when the current role is job_rt and CP tenant_status is purge_personal or later (ADR-0005 Decision 1). Owner-only keys cannot be stored in a custom role."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> TR-OWNER-ROLE-R3"
  - id: TR-STRICT-SUBSET
    rule: "effective when ADR-0008 is Accepted: where a non-owner acts on another person (staff.manage: disable, enable, temporary password; staff.reset_pin: counter temporary PIN, require a PIN reset; staff.enrol_device; staff.suspend_local), the target's permission set (keys and limits) must be a strict subset of the actor's and the target assigned to a branch the actor holds; an owner is never the target of a non-owner. Checked in the Authorizer; Logins.issueTemporary and Logins.disable also refuse an owner target unless app.branch_all = 'on'."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> TR-STRICT-SUBSET-R2"
  - id: TR-AUTHORITY-SNAPSHOT-R2
    rule: "effective when ADR-0008 is Accepted: a per-tenant authority_version is incremented in the same transaction as any change to roles, role_permissions, staff_roles, staff_branches, staff status, tenant ceilings, PIN floors, or a person lock or unlock; the config feed delivers an immutable per-branch authority snapshot (active staff, status, role ids, effective permissions and limits, person locks, staff_version) that never carries verifiers (verifiers travel in the staff feed keyed by (person, verifier_version) with removals as tombstones). A fact is judged against the snapshot of its branch with the greatest version <= its authority_version that the server delivered to that device, and against authority in force at its claimed time (lease clock); a version never delivered to that device is flagged config_version_unknown. Delivered snapshots (authority_snapshots, TD, ids only) are kept for the longest lease plus the feed retry window (retention row). S2 override_offline_max_age (default off) is measured on the lease clock. No override runs in Restricted mode until Q-restricted is decided."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: TR-TABLE-CLASSES-R8
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; the support access journal), no USING (true); CP tenant-keyed control plane without personal data or sales, tax or licensing records (tenant status, plan, restore watermark, usage counts without money, names, items, bill contents or free text), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context (login_identities, sessions, enrolment_codes, device_credentials, support_grants; effective when ADR-0007 is Accepted also login_contacts, second_factors, recovery_requests, step_up_grants, webauthn_challenges, auth_notices, enrolment_assertions), restrictive tenant policy TO every inventory role except auth_lookup; access across tenants, reads and writes, only through the ADR-0001 § 1c SECURITY DEFINER functions owned by auth_lookup; in-tenant permissive policies only where an ADR names them. Effective when ADR-0007 is Accepted: OP operator realm (operators, operator_credentials, operator_sessions, operator_step_up, operator_recovery_codes), no tenant_id, no RLS, no tenant data, granted to console_rt only; console_rt has grants on OP only (catalogue-checked both ways). Throttle and rate-limit state and unbound sign-in challenges are not tables: in-process state of the single backend instance (ADR-0007 § 3). effective when ADR-0008 is Accepted: TD also holds roles, role_permissions, activity_trail (marked tax), authority_snapshots, pin_verifiers, pin_upload_facts, pin_activation_codes and tenant_data_keys; G also holds permission_catalogue (written only by a reviewed migration). The pin and key tables are on the export exclusion list. One stated exception to 'auth_lookup never reads TD tables' (effective when ADR-0008 is Accepted): auth_lookup may SELECT staff_roles and roles.is_owner inside the tenant context, for the owner checks of Logins.disable, Logins.issueTemporary and Erasure.erasePersonLogin only."
    adr: ADR-0008
    adr_status: Accepted
    status: "superseded_by: M21/M22 amendment 2026-10-20 (Proposed) -> TR-TABLE-CLASSES-R9"
  - id: TR-ROLE-INVENTORY-R10
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy; one stated exception: writes data in class G tables (retention table, plan catalogue, tax rates, permission catalogue; never tenant data) only inside a reviewed migration that deploy_rt runs through SET ROLE migrator), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; also the audited console lock-out script on OP tables only, never tenant credentials; run by the founder with the credential from Bitwarden, over SSH through Tailscale then local peer login; each marked privileged; the deploy pipeline stops for the founder to run them on the database host; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR; none runs until it adds their scope kind), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN; support journal functions, and effective when ADR-0008 is Accepted also the ActivityTrail functions of ADR-0008), backup_rt (REPLICATION only), console_rt (LOGIN, operator console, grants on OP only; the console process also holds support_rt, the licensing logins and platform_rt, each called only with a live OP session). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR). Grants effective when ADR-0008 is Accepted: device_rt writes pin_verifiers only through a trigger that consumes a matching pin_upload_facts row, calls PinActivation.redeem, LockoutReport and ActivityTrail.acceptDeviceBatch; job_rt runs ActivityTrail.verifyChains, ActivityTrail.pruneBefore and key rotation/rewrap; app_rt and job_rt have EXECUTE on ActivityTrail.appendServer; app_rt has no SELECT on pin_verifiers or tenant_data_keys. Further grants effective when ADR-0008 is Accepted: job_rt has EXECUTE on Logins.statusOf; app_rt has INSERT on pin_activation_codes and on pin_upload_facts (kind dashboard_reset only) and UPDATE of pin_verifiers.confirmed through PinVerifiers.confirm only; device_rt inserts only the device-minted upload-fact kinds (sponsor, counter_reset, self_change); activation_code facts are written only by PinActivation.redeem; password_assertion facts by the sync endpoint in the transaction where Enrolment.consumeAssertion returns (an application check)."
    adr: ADR-0008
    adr_status: Accepted
    status: "superseded_by: M21/M22 amendment 2026-10-20 (Proposed) -> TR-ROLE-INVENTORY-R11"
  - id: TR-OWNER-ROLE-R3
    rule: "effective when ADR-0008 is Accepted: exactly one owner role per tenant (roles.is_owner = true; partial unique index on roles (tenant_id) WHERE is_owner; app_rt has no INSERT or UPDATE privilege on is_owner), written by the provisioning job; its permission set is the whole permission catalogue including keys added later, evaluated from is_owner; a BEFORE UPDATE OR DELETE trigger refuses any change but the label (F322); holding it sets app.branch_all = 'on'. At least one active owner (owner role + staff status active + enabled dashboard login) always remains: the guard runs on staff_roles delete or update (cascades included), staff status update or delete, and the § 1c functions Logins.disable and Erasure.erasePersonLogin; on the tables it is a CONSTRAINT TRIGGER ... DEFERRABLE INITIALLY DEFERRED counting after pg_advisory_xact_lock(<last-owner class id>, <tenant key>) (two-key, transaction-level; lock order journal, trail, last-owner); the trigger runs as the queuing role (PostgreSQL 18) and is tested as app_rt and job_rt under FORCE RLS. Closure exception: a delete passes only when the current role is job_rt and CP tenant_status is purge_personal or later (ADR-0005 Decision 1). Owner-only keys cannot be stored in a custom role. The § 1c owner checks read staff_roles and roles.is_owner through auth_lookup's narrow read (TR-TABLE-CLASSES-R8); the TD trigger learns a login's enabled state through Logins.statusOf (EXECUTE also for job_rt); Logins.disable and Erasure.erasePersonLogin take the last-owner lock after any trail append in the same transaction."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: TR-STRICT-SUBSET-R2
    rule: "effective when ADR-0008 is Accepted: where a non-owner acts on another person (staff.manage: disable, enable, temporary password; staff.reset_pin: counter temporary PIN, require a PIN reset; staff.enrol_device; staff.suspend_local), the target's permission set (keys and limits) must be a strict subset of the actor's and the target assigned to a branch the actor holds; an owner is never the target of a non-owner. Checked in the Authorizer; Logins.issueTemporary and Logins.disable also refuse an owner target unless app.branch_all = 'on'. The § 1c owner-target check reads the owner role through auth_lookup's narrow read (TR-TABLE-CLASSES-R8)."
    adr: ADR-0008
    adr_status: Accepted
    status: "superseded_by: staff-auth threat-model amendment 2026-10-19 -> TR-STRICT-SUBSET-R3"
  - id: TR-STRICT-SUBSET-R3
    rule: "effective when ADR-0008 is Accepted: where a non-owner acts on another person (staff.manage: disable, enable, temporary password; staff.reset_pin: counter temporary PIN, require a PIN reset; staff.enrol_device; staff.suspend_local), the target's permission set (keys and limits) must be a strict subset of the actor's and the target assigned to a branch the actor holds; an owner is never the target of a non-owner. Checked in the Authorizer; Logins.issueTemporary and Logins.disable also refuse an owner target unless app.branch_all = 'on'. The § 1c owner-target check reads the owner role through auth_lookup's narrow read (TR-TABLE-CLASSES-R8). Amended 2026-10-19 by the staff-auth threat model (founder): also enforced in PostgreSQL for every non-owner write that acts on another person (temporary password, disable or enable, dashboard_reset fact, sponsored enrolment); an owner actor (app.branch_all = 'on') passes; mechanism chosen in the migration plan by postgres-specialist before the first staff-management story (a wider auth_lookup read would be an ADR-0001 amendment). The server judges local suspend and lift facts by this rule at sync; such a fact is always recorded, the database refuses only applying its effect beyond the device when the check fails, and a failing one is flagged for owner review and a failing lift is not applied beyond its device."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: TR-RETENTION-DEFAULTS-R5
    rule: "One retention table, class G (runtime roles read only), every period configuration with a typed default, changed only through a reviewed migration that deploy_rt runs through SET ROLE migrator (ADR-0001 § 1b exception); a change takes effect at the next purge without a code change. Founder defaults 2026-10-18, which the feature spec may refine: closure cooling-off 15 days (must exceed the lease cap compiled into the app, 14 days; the licensing ADR keeps emergency unlock within it); export window 30 days; generated export files 7 days, then deleted; backup window 30 days (below the 60-day device retention); ended sessions 90 days; support access journal 2 years (compiled prune floor 365 days); technical logs 30 days, with no personal data; security events 1 year; usage counts 3 years; deletion journal 5 years (must exceed the backup window); Kodelix-started closure after 90 days of suspension. Fixed by other rules: tax archive 5 years after the tax period; device keeps 60 days; staff access requests answered within 6 working days. CI checks both invariants. Routine retention runs while a tenant is suspended; each purge job logs every run; no period is a literal in code. Added by ADR-0008 (founder 2026-10-19; effective when ADR-0008 is Accepted): staff activity trail 5 years (oldest-first prune with chain anchor); control-journal kinds added by ADR-0007 and ADR-0008 (password reset, must_reset, factor add or remove, recovery-code use, login disable, role and authority changes, console lock-out runs) 1 year, which must exceed the backup window plus margin (CI-checked). Amended 2026-10-19 by the staff-auth threat model (founder): short-lived auth rows (webauthn_challenges, step_up_grants, recovery_requests, enrolment_assertions and receipts, used or expired pin_activation_codes, consumed pin_upload_facts) 30 days after use or expiry; auth_notices 90 days after sending; PIN lockout reports 1 year; operator_sessions 90 days after ending, operator_step_up 30 days; a departed operator's records 1 year after leaving (credentials removed that day); breach register 5 years; owner prompted about a disabled dashboard login idle 12 months, never deleted automatically. Control-journal kinds also cover PIN verifier changes, activation-code issue and use, and person lock and unlock (1 year). Every new table carries a personal, tax or other marker (ADR-0005 amendment, M53)."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: TR-TABLE-CLASSES-R9
    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; the support access journal), no USING (true); CP tenant-keyed control plane without personal data or sales, tax or licensing records (tenant status, plan, restore watermark, usage counts without money, names, items, bill contents or free text), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context (login_identities, sessions, enrolment_codes, device_credentials, support_grants; effective when ADR-0007 is Accepted also login_contacts, second_factors, recovery_requests, step_up_grants, webauthn_challenges, auth_notices, enrolment_assertions), restrictive tenant policy TO every inventory role except auth_lookup; access across tenants, reads and writes, only through the ADR-0001 § 1c SECURITY DEFINER functions owned by auth_lookup; in-tenant permissive policies only where an ADR names them. Effective when ADR-0007 is Accepted: OP operator realm (operators, operator_credentials, operator_sessions, operator_step_up, operator_recovery_codes), no tenant_id, no RLS, no tenant data, granted to console_rt only; console_rt has grants on OP only (catalogue-checked both ways). Throttle and rate-limit state and unbound sign-in challenges are not tables: in-process state of the single backend instance (ADR-0007 § 3). effective when ADR-0008 is Accepted: TD also holds roles, role_permissions, activity_trail (marked tax), authority_snapshots, pin_verifiers, pin_upload_facts, pin_activation_codes and tenant_data_keys; G also holds permission_catalogue (written only by a reviewed migration). The pin and key tables are on the export exclusion list. One stated exception to 'auth_lookup never reads TD tables' (effective when ADR-0008 is Accepted): auth_lookup may SELECT staff_roles and roles.is_owner inside the tenant context, for the owner checks of Logins.disable, Logins.issueTemporary and Erasure.erasePersonLogin only. Amended 2026-10-20 (effective when the founder accepts the 2026-10-20 amendment:) PL also holds login_failure_state (one row per known login and signal hash, NULL for anonymous: consecutive failures, ceiling block, not-me block, last_notice_at, expiry only while unblocked), written only through the ADR-0001 sec. 1c FailureState functions (M22.4); this per-known-login state is the stated exception to throttle state not being a table. TD also holds pin_person_state, pin_lock_clears, enrolment_requests and enrolment_device_failures. G also holds release_flags (flag, enabled), on the C3 allow-list, written only by migrator in a reviewed migration (first flag approve_on_phone_enabled)."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: TR-ROLE-INVENTORY-R11
    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy; one stated exception: writes data in class G tables (retention table, plan catalogue, tax rates, permission catalogue; never tenant data) only inside a reviewed migration that deploy_rt runs through SET ROLE migrator), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; also the audited console lock-out script on OP tables only, never tenant credentials; run by the founder with the credential from Bitwarden, over SSH through Tailscale then local peer login; each marked privileged; the deploy pipeline stops for the founder to run them on the database host; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR; none runs until it adds their scope kind), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN; support journal functions, and effective when ADR-0008 is Accepted also the ActivityTrail functions of ADR-0008), backup_rt (REPLICATION only), console_rt (LOGIN, operator console, grants on OP only; the console process also holds support_rt, the licensing logins and platform_rt, each called only with a live OP session). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR). Grants effective when ADR-0008 is Accepted: device_rt writes pin_verifiers only through a trigger that consumes a matching pin_upload_facts row, calls PinActivation.redeem, LockoutReport and ActivityTrail.acceptDeviceBatch; job_rt runs ActivityTrail.verifyChains, ActivityTrail.pruneBefore and key rotation/rewrap; app_rt and job_rt have EXECUTE on ActivityTrail.appendServer; app_rt has no SELECT on pin_verifiers or tenant_data_keys. Further grants effective when ADR-0008 is Accepted: job_rt has EXECUTE on Logins.statusOf; app_rt has INSERT on pin_activation_codes and on pin_upload_facts (kind dashboard_reset only) and UPDATE of pin_verifiers.confirmed through PinVerifiers.confirm only; device_rt inserts only the device-minted upload-fact kinds (sponsor, counter_reset, self_change); activation_code facts are written only by PinActivation.redeem; password_assertion facts by the sync endpoint in the transaction where Enrolment.consumeAssertion returns (an application check). Amended 2026-10-20 (effective when the founder accepts the 2026-10-20 amendment): plus pin_writer (NOLOGIN, owns no table, owns the TD-side SECURITY DEFINER triggers and functions on pin_verifiers, pin_upload_facts, pin_person_state, pin_lock_clears, enrolment_requests and enrolment_device_failures; permissive policies TO pin_writer on those tables and SELECT on devices, staff, staff_roles, roles, role_permissions, staff_branches; not a table owner and no BYPASSRLS, so the restrictive tenant policy binds it); C4 inventory, C5 allowed definer owners and privileged-migration mark, C2 exact grants."
    adr: ADR-0008
    adr_status: Accepted
    status: active
  - id: TR-DEPLOY-RT-CREDENTIAL
    rule: "Effective when ADR-0009 is Accepted (amends ADR-0001 § 1b, which said 'credential in the CI secret store'): the deploy_rt credential is a plain host file on the VPS outside the repository, owned by the one-shot migration job's own UID, mode 0400, mounted only by the root-owned deploy script as a Compose file secret at /run/secrets/deploy_rt; never in an environment value, a log, a CI transcript, the repository, or a provider snapshot or backup, and never reachable by the AI agent. deploy_rt carries the per-role default role = 'migrator' (ALTER ROLE deploy_rt SET role = 'migrator'), set by the founder-run bootstrap roles script outside Flyway beside GRANT migrator TO deploy_rt WITH INHERIT FALSE, SET TRUE; privileged migrations still stop the pipeline."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: TR-CATALOGUE-RT
    rule: "Effective when ADR-0009 is Accepted (amends ADR-0001's closed role inventory): catalogue_rt is LOGIN, NOSUPERUSER, NOBYPASSRLS, owns nothing, has no table grants and reads only the system catalogue views the C1-C8 catalogue queries need (S58 confirms no grant beyond default catalogue access); it runs the post-deploy and the scheduled TI M50 catalogue checks from a root-owned script and systemd timer on the VPS; its credential is a plain host file owned by the check container's own UID, mode 0400. deploy_rt is not used for the check because its role default makes every session migrator, the owner of every table."
    adr: ADR-0009
    adr_status: Accepted
    status: active
  - id: TR-JOB-TABLES
    rule: "Effective when ADR-0012 is Accepted (amends ADR-0001's catalogue list with C9): the work tables job_outbox, job_schedule and job_dedup are class TD (tenant_id NOT NULL, ENABLE + FORCE RLS, restrictive tenant_isolation with no TO), owned by migrator, each recorded in the class list in its own migration. Grants equal policies (ADR-0001 C2): job_outbox app_rt and device_rt SELECT+INSERT (the SELECT only for ON CONFLICT DO NOTHING), job_rt SELECT+INSERT+UPDATE+DELETE; job_schedule job_rt SELECT+INSERT+UPDATE+DELETE; job_dedup job_rt SELECT+INSERT+DELETE; no other role (platform_rt none). job_outbox and job_schedule carry the class-list marker 'claimed'; catalogue check C9 (CI and the catalogue_rt timer) fails any claimed table without job_rt permissive SELECT and UPDATE policies (a missing UPDATE policy makes FOR UPDATE return 0 rows with no error), proved by planted tables. Ids are UUIDv7 from the injected IdGenerator; payloads hold ids and enums only."
    adr: ADR-0012
    adr_status: Proposed
    status: "superseded_by: ADR-0012 (threat-model amendment 2026-10-21) -> TR-JOB-TABLES-R2"
  - id: TR-JOB-RETENTION
    rule: "Effective when ADR-0012 is Accepted: the class-G retention table gains job_done_rows (default 7 days) and job_dead_rows (default 90 days), founder 2026-10-21, changed only by a reviewed migration (TR-RETENTION-DEFAULTS-R5); pruning is a recurring job_rt kind per tenant, batched through the done_at index; the done-row period is the idempotency window (after it an enqueue with the same key runs again, so causes whose key can recur use job_dedup); the ADR-0005 purge deletes a purged tenant's job_* rows."
    adr: ADR-0012
    adr_status: Proposed
    status: "superseded_by: ADR-0012 (threat-model amendment 2026-10-21) -> TR-JOB-RETENTION-R2"
  - id: TR-JOB-TABLES-R2
    rule: "Effective when ADR-0012 is Accepted (amends ADR-0001's catalogue list with C9; threat-model amendment 2026-10-21): the work tables job_outbox, job_schedule and job_dedup are class TD (tenant_id NOT NULL, ENABLE + FORCE RLS, restrictive tenant_isolation with no TO), owned by migrator, each recorded in the class list in its own migration; personal-data marker other (ADR-0005). Grants equal policies (ADR-0001 C2): job_outbox app_rt and device_rt SELECT+INSERT (the SELECT only for ON CONFLICT DO NOTHING), job_rt SELECT+INSERT+UPDATE+DELETE; job_schedule job_rt SELECT+INSERT+UPDATE+DELETE; job_dedup job_rt SELECT+INSERT+DELETE; no other role (platform_rt none). The producer INSERT WITH CHECK (or column privileges) fixes status pending, attempts 0, NULL lease/done/error columns and run_at within the kind's window, and for device_rt producer_subject = app.device_id; a trigger makes tenant_id, kind, payload, idempotency_key and the producer stamp immutable. job_outbox and job_schedule carry the class-list marker 'claimed'; catalogue check C9 (CI and the catalogue_rt timer) fails any claimed table without job_rt permissive SELECT and UPDATE policies with the canonical predicate, proved by planted tables. Ids are UUIDv7; lease_token is per claim."
    adr: ADR-0012
    adr_status: Proposed
    status: active
  - id: TR-JOB-RETENTION-R2
    rule: "Effective when ADR-0012 is Accepted (threat-model amendment 2026-10-21): the class-G retention table gains job_done_rows 7 days, job_dead_rows 90 days (purpose: failure investigation and, once the requeue path is decided, replay), job_dedup_rows 30 days and a maximum pending age of 90 days after which a row goes dead as expired (closure and purge steps exempt), founder defaults 2026-10-21, changed only by a reviewed migration (TR-RETENTION-DEFAULTS-R5). Pruning is a recurring job_rt kind per tenant, batched through the done_at index; the done-row period is the idempotency window. Person erasure (ADR-0005 M55) deletes every job_outbox and job_dedup row whose kind-declared person-id field names the erased person, in any status; the ADR-0005 purge deletes a purged tenant's job_* rows; EXP-2 excludes the three tables."
    adr: ADR-0012
    adr_status: Proposed
    status: "superseded_by: ADR-0012 (CTO delta re-check revision 2026-10-21) -> TR-JOB-RETENTION-R3"
  - id: TR-JOB-RETENTION-R3
    rule: "Effective when ADR-0012 is Accepted (CTO delta re-check revision 2026-10-21): the class-G retention table gains job_done_rows 7 days, job_dead_rows 90 days (purpose: failure investigation and, once the requeue path is decided, replay), job_dedup_rows 30 days and a maximum pending age of 90 days after which a row goes dead as expired; closure steps, purges and person-erasure steps are exempt from that expiry; founder defaults 2026-10-21, changed only by a reviewed migration (TR-RETENTION-DEFAULTS-R5). Pruning is a recurring job_rt kind per tenant, batched through the done_at index; the done-row period is the idempotency window. Person erasure (ADR-0005 M55) deletes every job_outbox and job_dedup row whose kind-declared person-id field names the erased person, in any status, its own claimed row included (completion recorded as the deletion-journal tombstone); the ADR-0005 purge deletes a purged tenant's job_* rows; EXP-2 excludes the three tables."
    adr: ADR-0012
    adr_status: Proposed
    status: active
  - id: TR-BRANCH-ROW-IN-TENANCY
    rule: "Effective when ADR-0010 is Accepted (founder 2026-10-21): the bare row branches (tenant_id, id, status) and its lifecycle belong to the tenancy module (Layer 1), because Layer 1 tables such as devices, seats and support grants carry a composite FK to it (TR-TENANT-UNIT, TR-BRANCH-SCOPE-R4); Venue Configuration (Layer 2) keeps every branch attribute (name, logo, phone numbers, opening hours, settings) in its own tables keyed (tenant_id, branch_id) with a FK to tenancy branches. Branch is the core generic word for a tenant unit."
    adr: ADR-0010
    adr_status: Proposed
    status: active
interface_contracts:
  - id: IC-TENANT-CONNECTION-RESOLVER
    contract: "TenantConnectionResolver.resolve(TenantId) -> TenantDataSource; the only way app code reaches tenant data; today returns the shared pool."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 amendment 2026-10-18 (suspension contract) -> IC-TENANT-CONNECTION-RESOLVER-R2"
  - id: IC-SCOPE-HELPER
    contract: "WithScope (Go) / withScope (Ktor) -> ScopedTx / ScopedTransaction, the only handle tenant repositories accept; errors ScopeAlreadySet, InvalidScope."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 -> IC-SCOPE-HELPER-R2"
  - id: IC-SESSION-AUTHORIZER
    contract: "SessionResolver.resolve(OpaqueToken) -> Principal {user, tenant, role, branches}, read from the database per request; Authorizer.require(principal, permission, target branch?) -> Allowed | Denied."
    adr: ADR-0003
    adr_status: Accepted
    status: "superseded_by: ADR-0003 revision 2026-10-18 -> IC-SESSION-AUTHORIZER-R2"
  - id: IC-SUPPORT-GRANT
    contract: "SupportGrant {id, tenant_id, branch_ids (explicit), scope read | verb:<name>, operator_id, reason, requested_at, approved_by, approved_at, expires_at (default 24 h, max 7 d, from config), revoked_at?}; owner inserts and updates revoked_at only. ADR-0002 Scope gains kind Support {grantId, operatorId}; helper errors NoLiveGrant, ScopeAlreadySet, InvalidScope."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 -> IC-SUPPORT-GRANT-R2"
  - id: IC-PRE-CONTEXT-LOOKUPS
    contract: "DeviceCredentialLookup.find(keyId), SessionLookup.find(tokenHash), EnrolmentCodeLookup.find(codeHash) -> identity {tenant, branch/user/device, status} | NotFound; SECURITY DEFINER functions owned by auth_lookup, pinned search_path, no PUBLIC EXECUTE; the only DB reads before a scope exists."
    adr: ADR-0001
    adr_status: Accepted
    status: "superseded_by: ADR-0001 revision 2026-10-18 (second review) -> IC-PRE-CONTEXT-LOOKUPS-R2"
  - id: IC-SCOPE-HELPER-R2
    contract: "WithScope (Go) / withScope (Ktor)(src, Scope = Staff | Device | Support, fn) -> ScopedTx / ScopedTransaction, the only handle tenant repositories accept; errors ScopeAlreadySet, InvalidScope, NoLiveGrant (Support, before any tenant query)."
    adr: ADR-0002
    adr_status: Accepted
    status: "superseded_by: ADR-0002 revision 2026-10-18 (Job kind) -> IC-SCOPE-HELPER-R3"
  - id: IC-SESSION-AUTHORIZER-R2
    contract: "SessionResolver.resolve(OpaqueToken) -> Principal {user, tenant, role, branches}: SessionLookup.find(tokenHash) (PL) then a tenant-scoped read of staff_roles and staff_branches, per request; Authorizer.require(principal, permission, target branch?) -> Allowed | Denied."
