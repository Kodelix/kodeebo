  - id: IC-COUNTER-ENROLMENT-R6
    contract: "effective when ADR-0008 is Accepted (amends ADR-0007): enrol once, valid on every device of the person's assigned branches. Password path: the counter calls the dashboard sign-in API (app_rt) with username, password and TOTP or one recovery code (no passkey on the counter); success returns a single-use enrolment assertion bound to the device credential (Enrolment.issueAssertion), never a session; the device consumes it over device_rt (Enrolment.consumeAssertion); the device refuses a PIN equal to the password just entered or contained in it, compared in memory only, never stored or sent. Sponsored path: a sponsor signed in on that device, confirmed online (Device scope), holding staff.enrol_device, assigned to that branch, whose permission set is a strict superset of the target's (owner above every role), picks the person; the device shows a random one-time TemporaryPin once, changed at first use, expiring on the lease clock. The device computes the Argon2id verifier (per-user salt, PHC, parameters fitted to the weakest supported PC by S40 = S22/S23, PBKDF2-SHA256 600k fallback, clamped on the device both ways) and uploads it; floors 6 / 8 as owner-visible settings, a raised floor forces a new PIN; lockout per device (delay from 5, lock at <= 10, override-dialog failures count) on the lease clock, failures reported at contact and summed per person into a lock on every device through the feed (aggregate budget a named deviation). Revised effective when ADR-0008 is Accepted: a verifier from a device-minted fact (sponsor, counter_reset, self_change, parameter rehash) is unconfirmed and delivered only to its minting device until it is confirmed; for a person holding a privileged key only a confirmed verifier leaves the minting device; a dashboard-issued activation code (IC-PIN-ACTIVATION) also confirms. The per-person lock threshold has a compiled ceiling of 10, a reported success clears the sum, an owner's lock is cleared by a dashboard reset required plus a password-path enrolment, and the widened 6.1.1 lockout is accepted by name. A received verifier with parameters outside the device's floor or ceiling is not installed. A pending verifier is confirmed only by the person setting a PIN on the password path (a new password_assertion upload, which replaces it) or by the owner's dashboard confirmation (step-up, showing person, device, fact kind and time, after checking with the person); a password-path sign-in that sets no PIN confirms nothing. While it is pending, other devices keep the last confirmed verifier; a dashboard reset required retires an old PIN everywhere. An activation code may also replace an existing PIN fleet-wide (owner-started remote reset). Amended 2026-10-19 by the staff-auth threat model (founder): the owner's dashboard confirmation applies only to a person holding no privileged key (a privileged person's pending verifier is replaced only by their own password-path PIN); the person is notified of each pending verifier and confirmation. A reported success clears only the failures the same device reported; single-device person locks are flagged for owner review; lockout reports are rate-limited per device; an owner or approver lock alerts the owner. Each password-path enrolment writes an owner notice and counts as a new-device sign-in; the counter zeroises the password. The first use of a temporary PIN notifies the owner. A device refuses a verifier_version lower than the highest it acknowledged and raises a security event."
    adr: ADR-0008
    adr_status: Accepted
    status: "superseded_by: M21/M22 amendment 2026-10-20 (Proposed) -> IC-COUNTER-ENROLMENT-R7"
  - id: IC-PIN-VERIFIER-CUSTODY-R4
    contract: "effective when ADR-0008 is Accepted: PinVerifiers.accept(personId, phc, fact: {kind in password_assertion | dashboard_reset | activation_code | sponsor | counter_reset | self_change, factId}, baseVersion) -> VerifierVersion(confirmed | unconfirmed) | Refused(no_fact | fact_used | stale_version | params_out_of_range), over device_rt; single use in the database (a trigger consumes the pin_upload_facts row; compare-and-set on verifier_version). password_assertion, dashboard_reset and activation_code are server-checked (confirmed); the device-minted kinds are unconfirmed and delivered only to the minting device until confirmed; PinVerifiers.confirm(personId, verifierVersion, by: owner_dashboard). Stored AEAD-encrypted under a per-tenant data key (AAD = tenant || person || verifierVersion, verifier_key_id) wrapped by a master key outside the database (secret file now, AWS KMS envelope at the first paying customer; never in the database, a backup, a log or the repository); rotation without any PIN; at purge_personal the tenant key and every verifier row are deleted and backup copies age out inside the backup window. The server never verifies a lasting PIN, never caches decrypted verifiers and no API returns a verifier or its ciphertext; the only server-checked PIN-like secret is the one-time activation code. Erasure: PinVerifiers.erasePerson deletes ciphertext, upload facts and activation codes. A key-and-database compromise is remediated by a PIN reset for every affected person, never by key rotation alone. A pending verifier is confirmed only by the person setting a PIN on the password path (a new password_assertion upload, which replaces it) or by the owner's dashboard confirmation (step-up, showing person, device, fact kind and time, after checking with the person); a password-path sign-in that sets no PIN confirms nothing. While it is pending, other devices keep the last confirmed verifier; a dashboard reset required retires an old PIN everywhere. The upload trigger takes confirmed from the consumed fact's kind, never from the request; activation_code facts come only from PinActivation.redeem, dashboard_reset only from app_rt with step-up, password_assertion from the sync endpoint with Enrolment.consumeAssertion (application check); device_rt inserts only device-minted kinds. Amended 2026-10-19 by the staff-auth threat model (founder): PinVerifiers.confirm requires the owner-only key staff.confirm_verifier, step-up and a database guard (app.branch_all = 'on' on the UPDATE of confirmed) and is refused for a person holding a privileged key; confirmations are rate-capped per tenant with an owner alert. A dashboard_reset insert is checked in the database for staff.reset_pin and the strict-subset rule. A password_assertion fact is accepted only when the trigger consumes a matching receipt through Enrolment.consumeReceipt (replaces the application check; device_rt may insert this kind with a receipt). For an activation_code fact the trigger re-checks that the person holds no privileged key. After a restore, unconsumed codes, upload facts and receipts are voided and verifier changes are replayed from the control journal."
    adr: ADR-0008
    adr_status: Accepted
    status: "superseded_by: M21/M22 amendment 2026-10-20 (Proposed) -> IC-PIN-VERIFIER-CUSTODY-R5"
