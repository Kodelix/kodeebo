# 2026-10-19: ADR-0007 revised after its independent review (FAIL, text fixes): TR-TABLE-CLASSES-R5, IC-PRE-CONTEXT-LOOKUPS-R7, IC-PASSWORD-HASHER, IC-STEP-UP, IC-COUNTER-ENROLMENT, FP-SYNCED-PASSKEY-ON-CONSOLE superseded by R6/R8/R2 entries; FP-CONSOLE-CREDENTIAL-OUTSIDE-SCRIPT added. If ADR-0007 is rejected, the three Accepted entries it superseded (TR-TABLE-CLASSES-R4, TR-ROLE-INVENTORY-R5, IC-PRE-CONTEXT-LOOKUPS-R6) return to status active.
# 2026-10-19: ADR-0007 re-check (CONCERNS) applied: TR-ROLE-INVENTORY-R6 superseded by R7 (bootstrap superuser purpose: console lock-out script; console process logins).
# 2026-10-19: ADR-0007 Accepted by the founder; adr_status set to Accepted on every active ADR-0007 entry (superseded ADR-0007 entries left as they were); the ADR-0001 amendment it carries (class OP, console_rt, bootstrap superuser lock-out purpose, § 1c rows, C6) is in effect.
# 2026-10-19: ADR-0008 roles, permissions and activity trail written (Proposed): 6 entries superseded (TR-ROLE-ASSIGNMENT-GUARD, TR-RETENTION-DEFAULTS-R3, TR-ROLE-INVENTORY-R7, IC-SESSION-AUTHORIZER-R3, IC-COUNTER-ENROLMENT-R2, FP-PIN-VERIFIER-OFF-DEVICE) and 11 added, every ADR-0008 part effective only when ADR-0008 is Accepted; if ADR-0008 is rejected, those six return to status active.
# 2026-10-19 correction: that ADR-0008 write added 17 entries (6 replacing the superseded ones, 11 new), not 11.
