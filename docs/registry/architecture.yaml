  - id: IC-SIGNIN-FAILURE-CEILING
    contract: "At NIST's 100-consecutive-failure ceiling the identifier's dashboard password path is blocked until a reset (forgotten password or owner-issued temporary password); passkey and recovery-code sign-in stay open; the owner is notified. Anonymous attempts count toward the identifier's ceiling; attempts carrying a known-device signal count toward a separate ceiling (at most 100) per login and signal, which blocks only that signal; a re-block after reset is tested. The known-device signal is a __Host- Secure HttpOnly SameSite=Strict cookie with an opaque >= 128-bit CSPRNG value stored as SHA-256, bound to one login, set at a full sign-in, revoked by a password reset and by Sessions.endOthers, and in the crypto inventory. The per-address delay never alone blocks a known identifier. The remaining dashboard malicious-lockout risk is an ASVS 6.1.1 deviation accepted by Kamel Mohamed, founder, 2026-10-19 (staff-auth threat model M2)."
    adr: ADR-0007
    adr_status: Accepted
    status: "superseded_by: M21/M22 amendment 2026-10-20 (Proposed) -> IC-SIGNIN-FAILURE-CEILING-R2"
  - id: IC-NOTICE-GATED-FACTOR-CHANGE
    contract: "A lost-factor reset (SecondFactors.startReset) and a delayed factor removal (SecondFactors.applyPendingRemovals) apply only after the email provider has accepted every notice they require; the delay counts from that acceptance; without acceptance within a configured bound the change pauses and the operator is alerted (ids only) (staff-auth threat model M31)."
    adr: ADR-0007
    adr_status: Accepted
    status: "active (superseded_by: ADR-0013, effective on acceptance -> IC-NOTICE-GATED-FACTOR-CHANGE-R2)"
