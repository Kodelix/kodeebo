gins.resetVerifier(resetHandle, verifier, pepperKeyId) consumes the handle, ends every session, voids recovery requests and step-up grants in one transaction; Logins.rehash (compare-and-set), Logins.issueTemporary (inside, owner until the ADR-0003 amendment), Logins.markMustReset(pepperKeyId) (inside, job); Logins.disable also voids recovery requests and step-up grants; SecondFactors.forLogin, findByCredentialId, recoveryCodesFor, consumeRecoveryCode(user, codeId), acceptTotpStep, updatePasskeyCounter, enrol/remove (before, app_rt), startReset (inside, owner, step-up), applyPendingRemovals and reencrypt (inside, job), cancelRemoval (before, app_rt); Challenges.create/consume for register and step-up (unbound sign-in challenges stay in process memory); StepUp.issue (before, app_rt, after Sessions.rotate), StepUp.consume (inside, tenant match, app_rt); AuthNotices.claim (inside, job: the notice job reads owner contacts in tenant scope); Enrolment.issueAssertion (before, app_rt, after a full sign-in check, no session) and Enrolment.consumeAssertion(assertionHash, deviceKeyId) (before, device_rt, single use); Erasure.erasePersonLogin and Closure.purgeLogins also cover login_contacts, second_factors, recovery_requests, enrolment_assertions (erasure also step_up_grants); Closure.endSessions also step_up_grants and webauthn_challenges. No SMS path; device_rt gets no password or second-factor lookup."
