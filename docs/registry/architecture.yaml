    rule: "Database roles are exactly: migrator (NOLOGIN owner, DDL only, no permissive policy; one stated exception: writes data in class G tables (retention table, plan catalogue, tax rates; never tenant data) only inside a reviewed migration that deploy_rt runs through SET ROLE migrator), deploy_rt (LOGIN, member of migrator with SET; runs every migration not marked privileged), bootstrap superuser (local only; cluster admin, extensions, upgrades, restore, and the rare privileged migrations that create or alter roles or create, replace or re-own a function of auth_lookup, support_fn or audit_writer; effective when ADR-0007 is Accepted also the audited console lock-out script on OP tables only, never tenant credentials; run by the founder with the credential from Bitwarden, over SSH through Tailscale then local peer login; each marked privileged; the deploy pipeline stops for the founder to run them on the database host; its login pages), app_rt, device_rt, job_rt (one tenant per transaction via the Job kind; also runs backfills; tenant list read by the scheduler as platform_rt from CP tenant_status), licensing service roles (named by the licensing ADR; none runs until it adds their scope kind), platform_rt (CP only), auth_lookup (NOLOGIN, § 1c functions), support_rt, support_fn (NOLOGIN), audit_writer (NOLOGIN), backup_rt (REPLICATION only); effective when ADR-0007 is Accepted also console_rt (LOGIN, operator console, grants on OP only; the console process also holds support_rt, the licensing logins and platform_rt, each called only with a live OP session). All but the bootstrap superuser are NOSUPERUSER, NOBYPASSRLS and own nothing; a new role needs an ADR amendment (licensing M27/M38: future amendment with the licensing ADR)."
    adr: ADR-0007
    adr_status: Accepted
    status: "superseded_by: ADR-0008 (Proposed 2026-10-19; effective when ADR-0008 is Accepted) -> TR-ROLE-INVENTORY-R8"
