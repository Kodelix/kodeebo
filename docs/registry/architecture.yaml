    rule: "effective when ADR-0008 is Accepted: exactly one owner role per tenant (roles.is_owner = true; partial unique index on roles (tenant_id) WHERE is_owner; app_rt has no INSERT or UPDATE privilege on is_owner), written by the provisioning job; its permission set is the whole permission catalogue including keys added later, evaluated from is_owner; a BEFORE UPDATE OR DELETE trigger refuses any change but the label (F322); holding it sets app.branch_all = 'on'. At least one active owner (owner role + staff status active + enabled dashboard login) always remains: the guard runs on staff_roles delete or update (cascades included), staff status update or delete, and the § 1c functions Logins.disable and Erasure.erasePersonLogin; on the tables it is a CONSTRAINT TRIGGER ... DEFERRABLE INITIALLY DEFERRED counting after pg_advisory_xact_lock(<last-owner class id>, <tenant key>) (two-key, transaction-level; lock order journal, trail, last-owner); the trigger runs as the queuing role (PostgreSQL 18) and is tested as app_rt and job_rt under FORCE RLS. Closure exception: a delete passes only when the current role is job_rt and CP tenant_status is purge_personal or later (ADR-0005 Decision 1). Owner-only keys cannot be stored in a custom role."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> TR-OWNER-ROLE-R3"
  - id: TR-STRICT-SUBSET
    rule: "effective when ADR-0008 is Accepted: where a non-owner acts on another person (staff.manage: disable, enable, temporary password; staff.reset_pin: counter temporary PIN, require a PIN reset; staff.enrol_device; staff.suspend_local), the target's permission set (keys and limits) must be a strict subset of the actor's and the target assigned to a branch the actor holds; an owner is never the target of a non-owner. Checked in the Authorizer; Logins.issueTemporary and Logins.disable also refuse an owner target unless app.branch_all = 'on'."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> TR-STRICT-SUBSET-R2"
  - id: TR-AUTHORITY-SNAPSHOT-R2
    rule: "effective when ADR-0008 is Accepted: a per-tenant authority_version is incremented in the same transaction as any change to roles, role_permissions, staff_roles, staff_branches, staff status, tenant ceilings, PIN floors, or a person lock or unlock; the config feed delivers an immutable per-branch authority snapshot (active staff, status, role ids, effective permissions and limits, person locks, staff_version) that never carries verifiers (verifiers travel in the staff feed keyed by (person, verifier_version) with removals as tombstones). A fact is judged against the snapshot of its branch with the greatest version <= its authority_version that the server delivered to that device, and against authority in force at its claimed time (lease clock); a version never delivered to that device is flagged config_version_unknown. Delivered snapshots (authority_snapshots, TD, ids only) are kept for the longest lease plus the feed retry window (retention row). S2 override_offline_max_age (default off) is measured on the lease clock. No override runs in Restricted mode until Q-restricted is decided."
    adr: ADR-0008
    adr_status: Proposed
    status: active
