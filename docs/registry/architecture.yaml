    rule: "Every table is in one class recorded with the migrations: TD tenant data (incl. licensing seats, seat_licences, devices, seat_moves, approvals, lease_log per licensing M35; the support access journal), no USING (true); CP tenant-keyed control plane without personal data or sales, tax or licensing records (tenant status, plan, restore watermark, usage counts without money, names, items, bill contents or free text), restrictive tenant policy TO every inventory role except platform_rt, which alone has USING (true); G global, no tenant_id, on the allow-list, no RLS; PL pre-context (login_identities, sessions, enrolment_codes, device_credentials, support_grants; effective when ADR-0007 is Accepted also login_contacts, second_factors, recovery_requests, step_up_grants, webauthn_challenges, auth_notices, enrolment_assertions), restrictive tenant policy TO every inventory role except auth_lookup; access across tenants, reads and writes, only through the ADR-0001 § 1c SECURITY DEFINER functions owned by auth_lookup; in-tenant permissive policies only where an ADR names them. Effective when ADR-0007 is Accepted: OP operator realm (operators, operator_credentials, operator_sessions, operator_step_up, operator_recovery_codes), no tenant_id, no RLS, no tenant data, granted to console_rt only; console_rt has grants on OP only (catalogue-checked both ways). Throttle and rate-limit state and unbound sign-in challenges are not tables: in-process state of the single backend instance (ADR-0007 § 3). effective when ADR-0008 is Accepted: TD also holds roles, role_permissions, activity_trail (marked tax), authority_snapshots, pin_verifiers, pin_upload_facts, pin_activation_codes and tenant_data_keys; G also holds permission_catalogue (written only by a reviewed migration). The pin and key tables are on the export exclusion list. One stated exception to 'auth_lookup never reads TD tables' (effective when ADR-0008 is Accepted): auth_lookup may SELECT staff_roles and roles.is_owner inside the tenant context, for the owner checks of Logins.disable, Logins.issueTemporary and Erasure.erasePersonLogin only."
    adr: ADR-0008
    adr_status: Proposed
    status: active
