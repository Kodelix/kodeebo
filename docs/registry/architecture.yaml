us a password-path enrolment, and the widened 6.1.1 lockout is accepted by name. A received verifier with parameters outside the device's floor or ceiling is not installed. A pending verifier is confirmed only by the person setting a PIN on the password path (a new password_assertion upload, which replaces it) or by the owner's dashboard confirmation (step-up, showing person, device, fact kind and time, after checking with the person); a password-path sign-in that sets no PIN confirms nothing. While it is pending, other devices keep the last confirmed verifier; a dashboard reset required retires an old PIN everywhere. An activation code may also replace an existing PIN fleet-wide (owner-started remote reset)."
