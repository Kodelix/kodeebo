    status: active
  - id: IC-PIN-VERIFIER-CUSTODY-R3
    contract: "effective when ADR-0008 is Accepted: PinVerifiers.accept(personId, phc, fact: {kind in password_assertion | dashboard_reset | activation_code | sponsor | counter_reset | self_change, factId}, baseVersion) -> VerifierVersion(confirmed | unconfirmed) | Refused(no_fact | fact_used | stale_version | params_out_of_range), over device_rt; single use in the database (a trigger consumes the pin_upload_facts row; compare-and-set on verifier_version). password_assertion, dashboard_reset and activation_code are server-checked (confirmed); the device-minted kinds are unconfirmed and delivered only to the minting device until confirmed; PinVerifiers.confirm(personId, verifierVersion, by: owner_dashboard). Stored AEAD-encrypted under a per-tenant data key (AAD = tenant || person || verifierVersion, verifier_key_id) wrapped by a master key outside the database (secret file now, AWS KMS envelope at the first paying customer; never in the database, a backup, a log or the repository); rotation without any PIN; at purge_personal the tenant key and every verifier row are deleted and backup copies age out inside the backup window. The server never verifies a lasting PIN, never caches decrypted verifiers and no API returns a verifier or its ciphertext; the only server-checked PIN-like secret is the one-time activation code. Erasure: PinVerifiers.erasePerson deletes ciphertext, upload facts and activation codes. A key-and-database compromise is remediated by a PIN reset for every affected person, never by key rotation alone. A pending verifier is confirmed only by the person setting a PIN on the password path (a new password_assertion upload, which replaces it) or by the owner's dashboard confirmation (step-up, showing person, device, fact kind and time, after checking with the person); a password-path sign-in that sets no PIN confirms nothing. While it is pending, other devices keep the last confirmed verifier; a dashboard reset required retires an old PIN everywhere. The upload trigger takes confirmed from the consumed fact's kind, never from the request; activation_code facts come only from PinActivation.redeem, dashboard_reset only from app_rt with step-up, password_assertion from the sync endpoint with Enrolment.consumeAssertion (application check); device_rt inserts only device-minted kinds."
    adr: ADR-0008
    adr_status: Proposed
    status: active
  - id: IC-PIN-ACTIVATION-R2
    contract: "effective when ADR-0008 is Accepted: dashboard-issued temporary PIN for remote onboarding. PinActivation.issue(personId) (owner-only key staff.activation_code, step-up) only for a person whose roles hold no privileged key as defined by permission_catalogue.privileged (checked at issue and at use), assigned to a branch; the server generates the code with a CSPRNG (configured length, compiled floor 8 characters, unambiguous alphanumeric alphabet), shows it once, stores only a salted Argon2id PHC, single use, expires after a configured time (default 24 h, compiled ceiling 72 h), a new code voids the old. PinActivation.redeem(personId, code, deviceCredential) online only, on a lease-valid device of one of the person's branches; the server checks the code (the one stated exception to 'the server never verifies a PIN'); attempts per code counted, voided after a configured number (compiled ceiling 10); success consumes it and returns a single-use activation_code fact, which the person uses to set their own PIN before any other action; that verifier is confirmed and travels fleet-wide. Trail entry and owner notice on issue, use, expiry and voiding. ASVS 6.4.1, 6.4.6, 6.5.2. For a person who already has a PIN, a redeemed code replaces their verifier fleet-wide (owner-started remote reset; the person sets the PIN, ASVS 6.4.6). Threat-model input: the redeeming counter could substitute its own verifier; confirmed and fleet-wide, but only for a non-privileged person, and visible when the person's PIN fails elsewhere."
    adr: ADR-0008
    adr_status: Proposed
    status: active
performance_budgets: []

api_decisions: []

forbidden_patterns:
  - id: FP-BYPASSRLS-RUNTIME-ROLE
    pattern: "BYPASSRLS or superuser on any runtime, job or support role; runtime roles owning tables."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-MATVIEW-TENANT-DATA
    pattern: "A materialized view over tenant or branch data readable by a runtime role."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-VIEW-WITHOUT-SECURITY-INVOKER
    pattern: "A view over tenant tables created without security_invoker = true."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-SESSION-LEVEL-SCOPE
    pattern: "set_config(..., false) or plain SET for a scope setting; setting scope outside the helper or twice in one transaction."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: FP-THREADLOCAL-TENANT
    pattern: "Carrying the tenant in a bare ThreadLocal or MDC value; nested tenant transactions (Exposed)."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: FP-SCOPE-FROM-REQUEST
    pattern: "Taking tenant, branch or device ids from a request body, query string or header as scope."
    adr: ADR-0002
    adr_status: Accepted
    status: active
  - id: FP-SCOPE-CLAIMS-IN-TOKEN
    pattern: "Tenant, role or branch claims inside the dashboard session token."
    adr: ADR-0003
    adr_status: Accepted
    status: active
  - id: FP-USING-TRUE-TENANT-TABLE
    pattern: "A USING (true) policy on a table that holds tenant data (allowed only on allow-listed control-plane tables, each listed by a catalogue test)."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 -> FP-USING-TRUE-TENANT-TABLE-R2"
  - id: FP-OPERATOR-ID-FROM-REQUEST
    pattern: "Taking the operator id from a request rather than the authenticated operator session (per-operator database identity required before a second operator)."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-AUDIT-IN-READ-TX-ONLY
    pattern: "A support access record written only inside the reading transaction (lost on client rollback); it must be committed before the read."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-OWNER-IMPERSONATION
    pattern: "The operator signing in as the owner, using the owner's credential, or minting an owner session ('log in as')."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-TENANT-READ-WITHOUT-GRANT
    pattern: "Kodelix reading tenant data without a live owner grant, including break-glass, a superuser read or a per-grant database login."
    adr: ADR-0004
    adr_status: Accepted
    status: "superseded_by: ADR-0004 revision 2026-10-18 -> FP-TENANT-READ-WITHOUT-GRANT-R2"
  - id: FP-CACHED-GRANT-STATE
    pattern: "Caching support-grant state (a cached grant outlives the owner's revoke)."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-PERMISSIVE-POLICY-WITHOUT-ROLE
    pattern: "A permissive policy without a TO role list on a TD, CP or PL table, or a tenant predicate carried only in a permissive policy."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-UNLISTED-DB-ROLE
    pattern: "A database role, or a role membership in pg_read_all_data, pg_write_all_data or the server-file roles, that is not in ADR-0001's role inventory."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-USING-TRUE-TENANT-TABLE-R2
    pattern: "USING (true) or WITH CHECK (true) on any TD table; on CP tables for any role other than platform_rt; on PL tables for any role other than auth_lookup."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-TENANT-READ-WITHOUT-GRANT-R2
    pattern: "A Kodelix person reading tenant data without a live owner grant, including break-glass, a superuser read or a per-grant database login. Service roles acting under their own ADR (licensing service roles, job_rt) are not operator reads."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-USAGE-STATS-BEYOND-COUNTS
    pattern: "Money amounts, names, items, bill contents or free text in the grant-free usage statistics; usage statistics computed across tenants in one query or outside the ADR-0002 helper; money totals without an owner grant or a contract clause."
    adr: ADR-0004
    adr_status: Accepted
    status: active
  - id: FP-PL-ACCESS-OUTSIDE-FUNCTIONS
    pattern: "Reading or writing a PL table across tenants other than through an ADR-0001 § 1c function; any role other than auth_lookup with an all-rows policy on a PL table."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-PERSON-EXPORT-AS-JOB
    pattern: "An export a person started, run as job_rt or under any scope wider than that person's Staff scope."
    adr: ADR-0003
    adr_status: Accepted
    status: active
  - id: FP-DATA-MIGRATION-AS-OWNER
    pattern: "A data migration (backfill) run as migrator or the bootstrap superuser instead of job_rt per tenant through the ADR-0002 helper."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-PRIVILEGED-MIGRATION-UNMARKED
    pattern: "A migration that creates or alters a role, or creates, replaces or re-owns a function owned by auth_lookup, support_fn or audit_writer, that is not marked privileged or is run as deploy_rt."
    adr: ADR-0001
    adr_status: Accepted
    status: active
  - id: FP-HARD-DELETE-TAX-ARCHIVE
    pattern: "Hard-deleting the tax archive (or any sales, receipt or ETA record) before its retain_until, outside a legal-hold release; exporting the owner's data with pg_dump (EXP-1)."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: FP-PURGE-WITHOUT-RECORD
    pattern: "A purge, erasure or export delivery that writes no dated record; a restore that serves traffic before the deletion journal is replayed; automatically wiping a device's local records on closure."
    adr: ADR-0005
    adr_status: Accepted
    status: active
  - id: FP-PRUNE-TOMBSTONE
    pattern: "Deleting a tombstone or any deletion-journal record through a support-journal path (SupportJournal.pruneBefore or any other) or before its own retention; storing the deletion journal inside the restorable database."
    adr: ADR-0005
    adr_status: Accepted
    status: active

  - id: FP-POOLED-CONN-AFTER-COPY-ERROR-R2
    pattern: "Returning a pooled JDBC connection to HikariCP after any exception from a streaming COPY (copyOut); calling close() on the pool's proxy counts as returning it. The connection must be evicted so the physical connection is discarded and never reused (S22b confirms the HikariCP 7.1.0 eviction API)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-UNLOCKED-GRADLE-BUILD-R2
    pattern: "A Gradle build without committed dependency locks (project and buildscript) and strict verification metadata, with version ranges, or with a dependency, lockfile or verification-metadata change auto-merged by the AI-agent CI without the founder's review."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-JVM-DEFAULT-HEAP-R2
    pattern: "Running the backend JVM container with the default heap sizing: no explicit -Xmx or MaxRAMPercentage, or no Compose memory limit (both sized from S18)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-QUEUE-WITHOUT-ADR-R2
    pattern: "Adopting a job-queue library (for example db-scheduler) or an external broker before an ADR fixes the ADR-0001 table class of its tables; work rows outside the tenant policy."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-SECOND-OTEL-SDK-R2
    pattern: "A second OpenTelemetry SDK or an SDK version in application code beside the Java agent; claiming no PII in telemetry before the Collector capture test shows that SQL parameter values, URL query strings and request headers do not reach it."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-RAW-JDBC-OUTSIDE-HELPER
    pattern: "Opening a raw JDBC transaction or using a raw java.sql.Connection, CopyManager or statement for tenant data outside the ADR-0002 scope-helper module (the only JDBC path is the helper's export carrier)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-NEW-SUSPENDED-TRANSACTION
    pattern: "Using Exposed's deprecated newSuspendedTransaction, or a nested tenant transaction, instead of suspendTransaction through withScope (ktor/best-practices.md line 55)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-ARGON2-JVM
    pattern: "Importing argon2-jvm (LGPL-3.0, F409) for password hashing; use Bouncy Castle or Password4j."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-SIGNING-ORACLE
    pattern: "An endpoint or use case that signs caller-chosen bytes with the licence key or the ETA e-seal key; signing is a purpose-tagged use case only (lic- F222)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-OTEL-LIBRARY-INSTRUMENTATION-WITH-AGENT
    pattern: "Installing KtorServerTelemetry or another OpenTelemetry library-instrumentation plugin beside the Java agent (it needs its own SDK instance and doubles the spans; ktor/best-practices.md lines 42-43)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-JDBC-ON-DEFAULT-DISPATCHER
    pattern: "Running blocking JDBC work (Exposed transactions, pgjdbc, copyOut) on Dispatchers.Default or an unbounded dispatcher; use a named two-argument limitedParallelism dispatcher no wider than its pool."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-JOOQ-UNCONFIRMED
    pattern: "Using jOOQ for PostgreSQL before its licence for the open-source edition is confirmed (ti-F241; ADR-0002 J2)."
    adr: ADR-0006
    adr_status: Accepted
    status: active
  - id: FP-SMS-OTP
    pattern: "Any sign-in, recovery or step-up code sent by SMS or voice (ASVS 6.6.1 at L3; founder 2026-10-19)."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-RESET-LINK-FROM-HOST
    pattern: "Building a password-reset link or code URL from the request's Host header instead of the configured base URL."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-PIN-VERIFIER-OFF-DEVICE
    pattern: "A counter PIN, its verifier or its lockout state leaving the encrypted device store: in a synced fact, the server database, a log or a backup outside the store."
    adr: ADR-0007
    adr_status: Accepted
    status: "superseded_by: ADR-0008 (Proposed 2026-10-19; effective when ADR-0008 is Accepted) -> FP-PIN-VERIFIER-OFF-DEVICE-R2"
  - id: FP-PEPPER-IN-DATABASE
    pattern: "Storing the password pepper (or the TOTP key-encryption key, or the KMS-unwrapped pepper) in the database, a log, a URL or a client bundle; calling KMS to compute a password hash."
    adr: ADR-0007
    adr_status: Accepted
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> FP-PEPPER-IN-DATABASE-R2"
  - id: FP-SYNCED-PASSKEY-ON-CONSOLE
    pattern: "Accepting a backup-eligible (BE=1, synced) passkey, a passkey without user verification, or a dashboard-RP passkey on the operator console."
    adr: ADR-0007
    adr_status: Proposed
    status: "superseded_by: ADR-0007 review fixes 2026-10-19 -> FP-SYNCED-PASSKEY-ON-CONSOLE-R2"
  - id: FP-TOKEN-IN-WEB-STORAGE
    pattern: "Keeping a session token or any credential in localStorage or sessionStorage, or in a cookie without __Host-, Secure, HttpOnly and SameSite=Strict."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-SPONSOR-CHOOSES-PIN
    pattern: "A manager, owner or Kodelix choosing, typing or seeing another person's lasting PIN or password; resets issue a random single-use temporary secret only (ASVS 6.4.6)."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-SYNCED-PASSKEY-ON-CONSOLE-R2
    pattern: "Accepting a passkey without user verification, or a dashboard-RP passkey, on the operator console; accepting a backup-eligible (BE=1, synced) passkey on the console once the two FIDO2 keys are registered. Interim exception, accepted by name by Kamel Mohamed, founder, 2026-10-19 (ASVS 6.3.3 L3 / NIST AAL3 deviation; review at the first paying customer): one synced passkey in the founder's Bitwarden (2FA on), UV required, with the console recovery codes stored offline apart from it."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-CONSOLE-CREDENTIAL-OUTSIDE-SCRIPT
    pattern: "Changing an operator credential outside the console other than through the audited console lock-out script run as the bootstrap superuser (SSH over Tailscale, local peer login; control-journal entry, off-host log line, security event, runbook); the script never touches tenant credentials."
    adr: ADR-0007
    adr_status: Accepted
    status: active
  - id: FP-PIN-VERIFIER-OFF-DEVICE-R2
    pattern: "effective when ADR-0008 is Accepted (replaces the device-only rule): a counter PIN or its plaintext anywhere outside the device; a PIN verifier stored unencrypted on the server, in a backup, a log, a trace, an authority_snapshots row or a synced fact other than the verifier upload; a verifier delivered to a device outside the person's assigned branches; a verifier upload accepted without a single-use enrolment or reset fact; per-device lockout state sent anywhere but the failure report at contact."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> FP-PIN-VERIFIER-OFF-DEVICE-R3"
  - id: FP-SERVER-PIN-VERIFY
    pattern: "effective when ADR-0008 is Accepted: the server verifying a counter PIN or comparing a presented PIN hash, or caching decrypted verifiers; KMS called per verifier."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 review fixes 2026-10-19 -> FP-SERVER-PIN-VERIFY-R2"
  - id: FP-OWNER-ONLY-KEY-IN-CUSTOM-ROLE
    pattern: "effective when ADR-0008 is Accepted: storing an owner-only permission key in a custom role, or editing the owner role beyond its label."
    adr: ADR-0008
    adr_status: Proposed
    status: active
  - id: FP-SELF-APPROVAL
    pattern: "effective when ADR-0008 is Accepted: an override approved by the requester; an approval covering more than one action (elevated session)."
    adr: ADR-0008
    adr_status: Proposed
    status: active
  - id: FP-ABSENT-LIMIT-UNLIMITED
    pattern: "effective when ADR-0008 is Accepted: treating an absent limit as unlimited outside the owner role; an approver limit below the do-limit in the same role."
    adr: ADR-0008
    adr_status: Proposed
    status: active
  - id: FP-TRAIL-WRITE-OUTSIDE-FUNCTIONS
    pattern: "effective when ADR-0008 is Accepted: writing, updating or deleting activity_trail rows other than through the audit_writer ActivityTrail functions; typed text, names or contact data in a trail record; rejecting a device money fact because its actor's authority changed (flag it instead)."
    adr: ADR-0008
    adr_status: Proposed
    status: active
  - id: FP-PIN-VERIFIER-OFF-DEVICE-R3
    pattern: "effective when ADR-0008 is Accepted (replaces the device-only rule): a counter PIN or its plaintext anywhere outside the device; a PIN verifier stored unencrypted on the server, in a backup, a log, a trace, an authority_snapshots row or a synced fact other than the verifier upload; a verifier delivered to a device outside the person's assigned branches; a verifier upload accepted without a single-use fact consumed in the database; an unconfirmed (device-minted) verifier delivered beyond its minting device for a person holding a privileged key, or for anyone before confirmation; a verifier in the authority snapshot; per-device lockout state sent anywhere but the failure report at contact."
    adr: ADR-0008
    adr_status: Proposed
    status: active
  - id: FP-SERVER-PIN-VERIFY-R2
    pattern: "effective when ADR-0008 is Accepted: the server verifying a lasting counter PIN or comparing a presented PIN hash, or caching decrypted verifiers; KMS called per verifier. The one stated exception is the dashboard-issued one-time activation code (IC-PIN-ACTIVATION), checked by the server once and never a lasting PIN."
    adr: ADR-0008
    adr_status: Proposed
    status: active
  - id: FP-PEPPER-IN-DATABASE-R2
    pattern: "Storing the password pepper (or the TOTP key-encryption key, or the KMS-unwrapped pepper) in the database, a log, a URL or a client bundle; calling KMS to compute a password hash. Extended by ADR-0008 (effective when ADR-0008 is Accepted): also the PIN-verifier master key or an unwrapped per-tenant data key in the database, a backup, a log, a URL, the repository or a client bundle."
    adr: ADR-0008
    adr_status: Proposed
    status: active
