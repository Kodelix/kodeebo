  - id: TR-BRANCH-SCOPE-R4
    rule: "Branch-scoped tables carry branch_id with a composite FK to branches and a RESTRICTIVE policy branch_scope on app.branch_ids / app.branch_all written TO app_rt, device_rt, support_rt, support_fn; app.branch_all = 'on' only for a verified owner (never a device or a support grant); staff_roles and staff_branches are tenant-wide; exports a person starts run as app_rt under that person's Staff scope, never as job_rt (ASVS 8.3.3); a background export re-checks the requester's status (Logins.statusOf) and re-reads role and branches when it starts, and is refused if the user is disabled or lost the permission or branch; a plain logout does not cancel it; application-layer function permissions through one deny-by-default Authorizer."
