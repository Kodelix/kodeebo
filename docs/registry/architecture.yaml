    adr_status: Proposed
    status: active
  - id: IC-COUNTER-ENROLMENT-R4
    contract: "effective when ADR-0008 is Accepted (amends ADR-0007): enrol once, valid on every device of the person's assigned branches. Password path: the counter calls the dashboard sign-in API (app_rt) with username, password and TOTP or one recovery code (no passkey on the counter); success returns a single-use enrolment assertion bound to the device credential (Enrolment.issueAssertion), never a session; the device consumes it over device_rt (Enrolment.consumeAssertion); the device refuses a PIN equal to the password just entered or contained in it, compared in memory only, never stored or sent. Sponsored path: a sponsor signed in on that device, confirmed online (Device scope), holding staff.enrol_device, assigned to that branch, whose permission set is a strict superset of the target's (owner above every role), picks the person; the device shows a random one-time TemporaryPin once, changed at first use, expiring on the lease clock. The device computes the Argon2id verifier (per-user salt, PHC, parameters fitted to the weakest supported PC by S40 = S22/S23, PBKDF2-SHA256 600k fallback, clamped on the device both ways) and uploads it; floors 6 / 8 as owner-visible settings, a raised floor forces a new PIN; lockout per device (delay from 5, lock at <= 10, override-dialog failures count) on the lease clock, failures reported at contact and summed per person into a lock on every device through the feed (aggregate budget a named deviation). Revised effective when ADR-0008 is Accepted: a verifier from a device-minted fact (sponsor, counter_reset, self_change, parameter rehash) is unconfirmed and delivered only to its minting device until a server-checked fact confirms it (the person's password-path sign-in on any counter, or the owner's dashboard confirmation); for a person holding a privileged key only a confirmed verifier leaves the minting device; a dashboard-issued activation code (IC-PIN-ACTIVATION) also confirms. The per-person lock threshold has a compiled ceiling of 10, a reported success clears the sum, an owner's lock is cleared by a dashboard reset required plus a password-path enrolment, and the widened 6.1.1 lockout is accepted by name. A received verifier with parameters outside the device's floor or ceiling is not installed."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> IC-COUNTER-ENROLMENT-R5"
  - id: IC-PIN-VERIFIER-CUSTODY-R2
    contract: "effective when ADR-0008 is Accepted: PinVerifiers.accept(personId, phc, fact: {kind in password_assertion | dashboard_reset | activation_code | sponsor | counter_reset | self_change, factId}, baseVersion) -> VerifierVersion(confirmed | unconfirmed) | Refused(no_fact | fact_used | stale_version | params_out_of_range), over device_rt; single use in the database (a trigger consumes the pin_upload_facts row; compare-and-set on verifier_version). password_assertion, dashboard_reset and activation_code are server-checked (confirmed); the device-minted kinds are unconfirmed and delivered only to the minting device until PinVerifiers.confirm (password sign-in or owner dashboard). Stored AEAD-encrypted under a per-tenant data key (AAD = tenant || person || verifierVersion, verifier_key_id) wrapped by a master key outside the database (secret file now, AWS KMS envelope at the first paying customer; never in the database, a backup, a log or the repository); rotation without any PIN; at purge_personal the tenant key and every verifier row are deleted and backup copies age out inside the backup window. The server never verifies a lasting PIN, never caches decrypted verifiers and no API returns a verifier or its ciphertext; the only server-checked PIN-like secret is the one-time activation code. Erasure: PinVerifiers.erasePerson deletes ciphertext, upload facts and activation codes. A key-and-database compromise is remediated by a PIN reset for every affected person, never by key rotation alone."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> IC-PIN-VERIFIER-CUSTODY-R3"
  - id: IC-PIN-ACTIVATION
    contract: "effective when ADR-0008 is Accepted: dashboard-issued temporary PIN for remote onboarding. PinActivation.issue(personId) (owner, step-up) only for a person whose roles hold no privileged key as defined by permission_catalogue.privileged (checked at issue and at use), assigned to a branch; the server generates the code with a CSPRNG (configured length, compiled floor 8 characters, unambiguous alphanumeric alphabet), shows it once, stores only a salted Argon2id PHC, single use, expires after a configured time (default 24 h), a new code voids the old. PinActivation.redeem(personId, code, deviceCredential) online only, on a lease-valid device of one of the person's branches; the server checks the code (the one stated exception to 'the server never verifies a PIN'); attempts per code counted, voided after a configured number (compiled ceiling 10); success consumes it and returns a single-use activation_code fact, which the person uses to set their own PIN before any other action; that verifier is confirmed and travels fleet-wide. Trail entry and owner notice on issue, use, expiry and voiding. ASVS 6.4.1, 6.4.6, 6.5.2."
    adr: ADR-0008
    adr_status: Proposed
    status: "superseded_by: ADR-0008 re-check fixes 2026-10-19 -> IC-PIN-ACTIVATION-R2"
