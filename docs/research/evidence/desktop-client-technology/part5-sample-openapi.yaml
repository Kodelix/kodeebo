openapi: 3.0.3
info: {title: "Part5 sample - synthetic, not the real contract", version: 0.0.1}
paths:
  /v1/sessions/{id}:
    get:
      operationId: getSession
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '4XX': {description: problem, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
components:
  schemas:
    Session:
      type: object
      required: [id, state, amountMinor, startedAt]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [open, closed, voided]}
        amountMinor: {type: integer, format: int64}
        startedAt: {type: string, format: date-time}
        payment: {oneOf: [{$ref: '#/components/schemas/Cash'}, {$ref: '#/components/schemas/Wallet'}], discriminator: {propertyName: kind}}
    Cash: {type: object, required: [kind], properties: {kind: {type: string}}}
    Wallet: {type: object, required: [kind], properties: {kind: {type: string}}}
    Problem: {type: object, properties: {type: {type: string}, title: {type: string}, status: {type: integer}}}
