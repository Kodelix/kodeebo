[databases]
* = host=ti-p2-pg port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 1
max_client_conn = 20
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
logfile = /dev/stdout
