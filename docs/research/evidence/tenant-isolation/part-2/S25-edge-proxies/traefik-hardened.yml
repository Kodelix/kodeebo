# Traefik 3.7.14 static config, hardened candidate: path and address fields dropped, headers dropped except Traceparent.
entryPoints:
  web:
    address: ":80"
providers:
  file:
    filename: /etc/traefik/dynamic.yml
accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      RequestPath: drop
      RequestLine: drop
      ClientAddr: drop
      ClientHost: drop
    headers:
      defaultMode: drop
      names:
        Traceparent: keep
    queryParameters:
      defaultMode: drop
log:
  level: INFO
